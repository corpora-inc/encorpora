[package]
name = "harvest-core"
version = "0.1.0"
description = "Offline knowledge-pack engine: signed packs, hybrid retrieval, grounded answers, support checking, audit log, records and sync."
authors = ["Corpora Inc"]
edition = "2024"
license = "Apache-2.0"
publish = false


[lib]
name = "harvest_core"

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The `harvest` binary (eval, bake verifier). The app links the library with
# `default-features = false`.
cli = []

[dependencies]
# `bundled` compiles SQLite with FTS5 and needs no system library or OpenSSL,
# so the same code builds for iOS, Android, desktop and aarch64 Linux.
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
rust-stemmers = "1.2"
# Archives are optional transport for packs; deflate only, pure Rust.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
