[package]
name = "harvest-core"
version = "0.1.0"
description = "Offline knowledge-pack engine: signed packs, hybrid retrieval, grounded answers, support checking, audit log, records and sync."
authors = ["Corpora Inc"]
edition = "2024"
license = "Apache-2.0"
publish = false


[lib]
name = "harvest_core"

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"
required-features = ["cli"]

[features]
default = ["cli", "serve", "hub"]
# The `harvest` binary (eval, bake verifier) and its OpenAI-compatible HTTP
# client. The app links the library with `default-features = false`.
cli = ["net"]
# The plain-HTTP client: an embedding server, an OpenAI-compatible model
# server, the device's link to a hub. A native shell that links the
# library with `default-features = false` turns this on to use them.
net = ["dep:ureq"]
# `harvest serve`: the local HTTP transport of the JSON API (`api`), for the
# app in a browser during development. Pure-Rust, synchronous.
serve = ["cli", "dep:tiny_http"]
# `harvest hub` (the hub's HTTP service and the device's HTTP link to it)
# and `harvest simulate`. The hub's store and review logic are always built.
hub = ["serve"]
# In-process llama.cpp embedder. Off by default: CI and the eval CLI stay
# offline and model-free; the app enables it (or bridges its own runtime).
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[dependencies]
# `bundled` compiles SQLite with FTS5 and needs no system library or OpenSSL,
# so the same code builds for iOS, Android, desktop and aarch64 Linux.
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
rust-stemmers = "1.2"
# Archives are optional transport for packs; deflate only, pure Rust.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Records encryption at rest: XChaCha20-Poly1305, pure Rust; nonces and keys
# from the OS RNG (getrandom 0.2 is already in the tree via rand_core).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["std"] }
# Delta packs: BSDIFF40 patches of the SQLite file (bsdiff 4.x compatible).
qbsdiff = "1.4"
# JSON Schema for every API request and response (`api`), from which the
# checked-in TypeScript types are generated.
schemars = "1.2"
# Signal patterns (`re:`) in a pack's signal map.
regex-lite = "0.1"
# The local HTTP server behind `harvest serve` (feature `serve`).
tiny_http = { version = "0.12", optional = true }
# Plain-HTTP client for a local or lab OpenAI-compatible server (CLI only).
ureq = { version = "3", default-features = false, features = ["json"], optional = true }
# Same pins as corpan/plugins/tauri-plugin-corpan-llm.
llama-cpp-sys-2 = { version = "=0.1.146", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-2 = { version = "=0.1.146", features = ["metal"], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
llama-cpp-2 = { version = "=0.1.146", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
