version: 1
engine: gemini
voices: {}
gemini:
  # Director's Notes prefix, prepended verbatim to every tts.text sent to
  # Gemini Flash 3.1 TTS. Chosen by user audition 2026-05-13 among 16 male
  # voices x 3 prefix flavors. Sadachbia + this prefix produced the best
  # measured-narrator register for the Oud book (audition at
  # /tmp/oud_gemini_male_audition/12b_Sadachbia_informative_measured.wav).
  director_prompt: "Style: informative, measured audiobook-narrator pace, calm and clear, with the warmth of a knowledgeable host introducing a long-form work. Read this: "
retry:
  # Gemini is approximately deterministic — same prompt → same audio. Same-
  # text retries waste compute. Internal _synth_with_retry already absorbs
  # transient API errors (≤5 attempts, ≤10s backoff = ~30s ceiling per call).
  # Pipeline max_retries=0 means: first validation-level failure → straight
  # to codex rewrite. After max_rewrites=3 source rewrites without
  # convergence the segment is escalated to a human verdict file.
  max_retries: 0
  max_rewrites: 3
  jitter: 0.0
  schedules:
    - {}
tts: {}
mastering:
  target_lufs: -22.0
  target_tp: -3.0
  audio_bitrate: '64000'
  audio_codec: aac
  output_ext: .m4a
filter_chain:
  highpass:
    enabled: true
    frequency: 80
    width_type: q
    width: 0.7
  adeclick:
    enabled: true
    window: 55
    overlap: 75
    threshold: 1.5
  afftdn:
    enabled: true
    nr: 15
    nf: -35
    tn: 1
  agate:
    enabled: true
    threshold: 0.018
    range: 0.01
    attack: 5
    release: 50
  acompressor:
    enabled: true
    threshold: 0.1
    ratio: 2
    attack: 10
    release: 100
    makeup: 1
  alimiter:
    enabled: true
    limit: 0.708
    level: false
denoise:
  enabled: false
trimming:
  zcr_window_ms: 500
  zcr_multiplier: 2.5
  consecutive_windows: 3
  scan_start_ratio: 0.6
  buffer_sec: 0.3
  tail_ms: 500
  fade_ms: 50
  fade_sec: 0.05
validation:
  min_word_ratio: 0.8
  max_trailing_silence_ratio: 0.25
  max_stacked_words: 3
  min_trailing_silence_ms: 75
  max_inter_word_gap_ms: 3000
