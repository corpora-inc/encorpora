series:
  title: "Fascinating Science"
  tagline: "The natural world in clear sentences."
  planned_volumes: 100+

  philosophy: |
    Each volume is a ~45-minute deep dive into one foundational science
    topic. Assume no prior knowledge. Every concept builds from zero.
    The vocabulary is basic but precise — the real words scientists use,
    defined clearly in context. Every sentence stands alone as a
    language-learning utterance. The books double as Corpan narration packs.

    A curious eight-year-old can follow every page. A smart adult reading
    in a second language is learning real science and real vocabulary at
    the same time. A native-speaking adult will still find something
    genuinely interesting — a fact they did not know, a connection they
    had not made.

    The topics are unordered. Any volume can be read independently.
    Together they form a complete foundation in natural science.

  audience: |
    Universal. Written for a third-grade reading level. Fully accessible
    to a language learner at any age. Interesting enough that an adult
    in their native language learns something real.

  voice: |
    Clear. Direct. Present tense where possible. Short sentences.
    No jargon without definition. No filler. No metaphors that
    obscure the science. Let the facts be fascinating on their own.

  output:
    trim: "6x9"
    target_words: 2500-3500
    target_time: "~45 minutes"
    formats: [pdf, epub, corpan-pack]
    tts: true

  editorial_rules:
    - Every sentence must stand alone as a language-learning utterance.
    - Define every technical term in plain language the first time it appears.
    - Assume no prior knowledge. Build from zero every time.
    - State facts. Let the facts be interesting. No hype.
    - If a number makes it concrete, use the number.
    - Timeless content only. No references to current events or recent discoveries.
    - Every chapter should contain at least one genuine moment of wonder.

  disciplines:
    - chemistry
    - biology
    - botany
    - marine-biology
    - earth-science
    - physics
    - astronomy
    - weather
    - ecology
    - anatomy
    - microbiology
    - zoology

