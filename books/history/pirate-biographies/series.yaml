series:
  title: "Pirate Biographies: Lives That Changed the Sea"
  tagline: "Twelve true stories from every ocean on Earth."
  planned_volumes: 12

  philosophy: |
    Each volume tells the true story of one pirate — their world, their rise,
    their reign, and their end. Every biography opens a window onto a different
    ocean, a different century, and a different culture. Rich geographic and
    historical context surrounds each life. Every sentence earns its place.
    Honest about uncertainty. Zero romanticization. Maximum fascination.
    Every sentence works as a standalone TTS language learning utterance.

  audience: |
    Universal. Fascinating for adults. Fully accessible and enjoyable for
    a curious child as young as ten. Think: the kind of book a parent
    and child can both be riveted by for completely different reasons.
    Designed for language learners across fourteen languages.

  output:
    trim: "6x9"
    formats: [pdf, epub, corpan-pack]
    tts: true
    target_time: "~30 minutes"
    target_segments: 300
    languages: [en, ar, de, es, fr, hi, it, ja, ko, pl, pt, ru, tr, zh]

  editorial_rules:
    - Every sentence must work as a standalone TTS utterance for language learning.
    - Short, clear sentences. Target ten to twenty-five words per segment.
    - No parenthetical pronunciation guides.
    - Historical accuracy. Real events, real dates, real places.
    - Honest about uncertainty. "Historians believe" not "It was."
    - Rich geographic and cultural context around each pirate's life.
    - All numbers spelled out in words. No digits.
    - No fluff. No padding. Every sentence earns its place.
    - Define terms. Explain frameworks. Ontological clarity.

  volumes:
    - number: 1
      title: "Zheng Yi Sao"
      subtitle: "The Pirate Queen of the South China Sea"
      directory: "01-zheng-yi-sao"
      region: "South China Sea, China"
      era: "1775–1844"
      leading_theme: "The most successful pirate in history commanded eighteen hundred vessels"

    - number: 2
      title: "Hayreddin Barbarossa"
      subtitle: "The King of the Mediterranean"
      directory: "02-hayreddin-barbarossa"
      region: "Mediterranean, Ottoman Empire"
      era: "1478–1546"
      leading_theme: "A corsair who became the sultan's admiral and master of the sea"

    - number: 3
