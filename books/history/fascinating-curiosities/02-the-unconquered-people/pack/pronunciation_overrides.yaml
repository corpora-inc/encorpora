# Pronunciation overrides for TTS engine (Book 02: The Unconquered People)
# These map display text → phonetic spellings that trick TTS into correct pronunciation.
# Applied as simple string replacements before text is sent to TTS.
#
# ONLY override words that English TTS will genuinely mispronounce.
# Don't override common Spanish/place names the TTS already handles (Chile, Valdivia, etc.)
#
