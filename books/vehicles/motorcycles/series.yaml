series:
  title: "Motorcycles"
  tagline: "The story of the world's fastest two-wheeled machines."
  planned_volumes: 12
  primary_language: en

  philosophy: |
    Twelve short books for young readers learning a new language. Every
    sentence is short, clear, and fun to say out loud. Volume 1 tells the
    big story of the motorcycle, from the first sputtering steam contraption
    to the electric superbikes of today. The next eleven dive into the
    machines, factories, and racers that made the motorcycle what it is.

    Each book is roughly one hundred sentences and ten minutes of audio.
    Every translation matches the English sentence-for-sentence so a learner
    can read along, hear the same idea in a new language, and build vocabulary
    one motorcycle at a time.

  audience: |
    Boys age six to fifteen — and any reader, any age, who is learning a
    new language and loves things that go fast. The vocabulary is concrete:
    motorcycle, engine, wheel, race, factory, road. The pace is brisk. The
    heroes are real people who built and rode real machines.

  voice:
    name: August
    voiceId: august
    reference: august-20.wav
    notes: |
      Warm, friendly narrator. The same voice across all twelve books and
      all twenty-three languages.

  output:
    formats: [corpan-pack]
    tts: true
    primary_language: en

  volumes:
    - number: 1
      title: "The Story of the Motorcycle"
      slug: 01-the-story-of-the-motorcycle
      angle: "History overview. Sets up the next eleven books."
