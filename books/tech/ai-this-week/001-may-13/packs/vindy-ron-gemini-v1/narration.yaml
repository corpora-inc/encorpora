      fa: "\u0628\u0627 \u0644\u062D\u0646\u06CC \u067E\u062E\u062A\u0647 \u0648 \u062F\
        \u0644\u0646\u0634\u06CC\u0646\u060C \u0634\u0628\u06CC\u0647 \u06AF\u0648\
        \u06CC\u0646\u062F\u06AF\u0627\u0646 \u062E\u0628\u0631 NPR\u060C \u06AF\u0631\
        \u0645\u060C \u0622\u0631\u0627\u0645 \u0648 \u062F\u0648\u0633\u062A\u0627\
        \u0646\u0647\u060C \u0628\u0627 \u062A\u0647 \u0645\u0627\u06CC\u0647\u200C\
        \u0627\u06CC \u0627\u0632 \u06A9\u0646\u062C\u06A9\u0627\u0648\u06CC \u0648\
        \ \u0627\u0639\u062C\u0627\u0628. \u0633\u0646\u062C\u06CC\u062F\u0647 \u0648\
        \ \u0647\u0648\u0634\u0645\u0646\u062F\u0627\u0646\u0647\u060C \u06AF\u0641\
        \u062A\u0627\u0631\u06CC \u0646\u0647 \u0646\u0645\u0627\u06CC\u0634\u06CC\
        . \u0622\u0647\u0646\u06AF \u0635\u062F\u0627\u06CC\u062A\u0627\u0646 \u0631\
        \u0627 \u0637\u0628\u06CC\u0639\u06CC \u0648 \u0645\u062A\u0646\u0648\u0639\
        \ \u06A9\u0646\u06CC\u062F\u061B \u067E\u0631\u0633\u0634\u200C\u0647\u0627\
        \ \u0647\u0645\u06CC\u0634\u0647 \u0628\u0627 \u0622\u0647\u0646\u06AF \u06CC\
        \u06A9\u0633\u0627\u0646 \u0628\u0627\u0644\u0627 \u0646\u0631\u0648\u0646\
        \u062F \u0648 \u0628\u0631\u062E\u06CC \u0627\u0632 \u0622\u0646\u200C\u0647\
        \u0627 \u062A\u0642\u0631\u06CC\u0628\u0627\u064B \u0645\u062B\u0644 \u062C\
