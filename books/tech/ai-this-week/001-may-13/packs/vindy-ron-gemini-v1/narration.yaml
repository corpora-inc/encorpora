        \u044B \u0434\u043E\u043B\u0436\u043D\u044B \u043E\u0434\u0438\u043D\u0430\
        \u043A\u043E\u0432\u043E \u0438\u0434\u0442\u0438 \u0432\u0432\u0435\u0440\
        \u0445; \u043D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043C\u043E\
        \u0433\u0443\u0442 \u0437\u0430\u043A\u0430\u043D\u0447\u0438\u0432\u0430\u0442\
        \u044C\u0441\u044F \u043F\u043E\u0447\u0442\u0438 \u043A\u0430\u043A \u0443\
        \u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043D\u0438\u044F. \u041B\u0435\
        \u0433\u043A\u0438\u0439, \u0441\u0443\u0445\u043E\u0439, \u0438\u043D\u043E\
        \u0433\u0434\u0430 \u0441 \u043D\u043E\u0442\u043A\u043E\u0439 \u044E\u043C\
        \u043E\u0440\u0430. \u041F\u0440\u043E\u0447\u0438\u0442\u0430\u0439\u0442\
        \u0435 \u044D\u0442\u043E: "
      nl: "Volwassen, sympathieke NPR-presentator \u2013 warm, ontspannen en gemoedelijk,\
        \ met een licht sprankje verwondering dat doorschemert. Gepolijst en intelligent;\
        \ converserend van aard, niet theatraal. Varieer je intonatie natuurlijk;\
        \ vragen gaan niet allemaal op dezelfde manier omhoog, sommige eindigen bijna\
        \ als mededelingen. Luchtig, droog, soms een vleugje humor. Lees dit: "
      pl: "Dojrza\u0142y, sympatyczny prezenter radiowy \u2013 ciep\u0142y, swobodny\
        \ i przyjazny, z widoczn\u0105 nut\u0105 zaciekawienia. Opanowany i inteligentny,\
        \ konwersacyjny, nie teatralny. Naturalnie moduluj intonacj\u0119 \u2013 pytania\
        \ nie zawsze ko\u0144cz\u0105 si\u0119 rosn\u0105co; niekt\xF3re brzmi\u0105\
        \ niemal jak stwierdzenia. Lekki, pow\u015Bci\u0105gliwy, czasem z odrobin\u0105\
        \ humoru. Przeczytaj to: "
      tr: "Olgun, sempatik, adeta bir NPR sunucusu gibi \u2013 s\u0131cak, rahat ve\
        \ cana yak\u0131n bir edayla, i\xE7inde hafif bir merak p\u0131r\u0131lt\u0131\
        s\u0131 ta\u015F\u0131yarak. D\xFCzg\xFCn, ak\u0131ll\u0131ca ve sohbet havas\u0131\
        nda, tiyatrovari bir \xFCsluptan ka\xE7\u0131narak. Tonlaman\u0131z\u0131\
        \ do\u011Fal bir \u015Fekilde de\u011Fi\u015Ftirin; t\xFCm sorular ayn\u0131\
        \ tonda y\xFCkselmesin, baz\u0131lar\u0131 neredeyse birer a\xE7\u0131klama\
        \ gibi son bulsun. Hafif, yer yer ince bir mizahla. Bunu oku: "
      sv: "Mogen, sympatisk programledare i NPR-anda \u2013 varm, avslappnad och v\xE4\
        nlig, med en glimt av f\xF6rundran. Polerad och intelligent, med en ledig\
        \ samtalston, inte teatralisk. Variera intonationen naturligt \u2013 inte\
        \ alla fr\xE5gor ska ha ett stigande tonfall; vissa kan avslutas n\xE4stan\
        \ som p\xE5st\xE5enden. L\xE4tt, torr, ibland med en gnutta humor. L\xE4s\
        \ detta: "
      da: "Moden, sympatisk nyhedsv\xE6rt, i NPR-stil \u2013 varm, afslappet og venlig,\
        \ hvor et lille glimt af undren skinner igennem. Velformuleret og intelligent,\
        \ samtaleagtig, ikke teatralsk. Vari\xE9r din intonation naturligt \u2013\
        \ ikke alle sp\xF8rgsm\xE5l skal have den samme stigende tone; nogle kan ende\
        \ n\xE6sten som konstaterende udsagn. Let, t\xF8r, indimellem med et strejf\
        \ af humor. L\xE6s dette: "
      'no': "Stil: Moden, sympatisk, som en NPR-nyhetspresentat\xF8r \u2013 varm,\
        \ avslappet og vennlig, med et lite glimt av undring som skinner gjennom.\
        \ Polert og intelligent, samtalende, ikke teatralsk. Varier intonasjonen naturlig\
        \ \u2013 sp\xF8rsm\xE5l stiger ikke alltid likt; noen kan nesten ende som\
        \ konstaterende utsagn. Lett, t\xF8rr, av og til med et snev av humor. Les\
        \ dette: "
      fi: "Kyps\xE4, sympaattinen NPR-tyylinen uutisjuontaja \u2013 l\xE4mminhenkinen,\
        \ rento ja yst\xE4v\xE4llinen, \xE4\xE4ness\xE4 pieni uteliaisuuden ja ihmettelyn\
        \ pilkahdus. Huoliteltu ja \xE4lyk\xE4s, puhetyylilt\xE4\xE4n luonnollisen\
        \ keskustelunomainen, ei teatraalinen. Intonaatio vaihtelee luonnollisesti\
        \ \u2013 kysymykset eiv\xE4t kaikki nouse samalla tavalla, vaan jotkut p\xE4\
        \xE4ttyv\xE4t l\xE4hes toteamukseen. Kevyt, hienovarainen ja toisinaan aavistuksen\
        \ humoristinen. Lue t\xE4m\xE4: "
      el: "\u03A0\u03B1\u03C1\u03BF\u03C5\u03C3\u03B9\u03AC\u03C3\u03C4\u03B5 \u03C4\
        \u03BF \u03BA\u03B5\u03AF\u03BC\u03B5\u03BD\u03BF \u03BC\u03B5 \u03C4\u03BF\
        \ \u03CD\u03C6\u03BF\u03C2 \u03B5\u03BD\u03CC\u03C2 \u03CE\u03C1\u03B9\u03BC\
        \u03BF\u03C5, \u03C3\u03C5\u03BC\u03C0\u03B1\u03B8\u03BF\u03CD\u03C2 \u03B5\
        \u03BA\u03C6\u03C9\u03BD\u03B7\u03C4\u03AE \u03B5\u03B9\u03B4\u03AE\u03C3\u03B5\
        \u03C9\u03BD, \u03B5\u03BC\u03C0\u03BD\u03B5\u03C5\u03C3\u03BC\u03AD\u03BD\
        \u03BF\u03C5 \u03B1\u03C0\u03CC \u03C4\u03BF NPR \u2014 \u03B6\u03B5\u03C3\
        \u03C4\u03CC\u03C2, \u03C7\u03B1\u03BB\u03B1\u03C1\u03CC\u03C2 \u03BA\u03B1\
        \u03B9 \u03C6\u03B9\u03BB\u03B9\u03BA\u03CC\u03C2, \u03BC\u03B5 \u03BC\u03B9\
        \u03B1 \u03C5\u03C0\u03BF\u03C8\u03AF\u03B1 \u03B8\u03B1\u03C5\u03BC\u03B1\
        \u03C3\u03BC\u03BF\u03CD \u03BD\u03B1 \u03B4\u03B9\u03B1\u03BA\u03C1\u03AF\
        \u03BD\u03B5\u03C4\u03B1\u03B9. \u0397 \u03B5\u03BA\u03C6\u03BF\u03C1\u03AC\
        \ \u03C4\u03BF\u03C5 \u03BB\u03CC\u03B3\u03BF\u03C5 \u03BD\u03B1 \u03B5\u03AF\
        \u03BD\u03B1\u03B9 \u03B5\u03BA\u03BB\u03B5\u03C0\u03C4\u03C5\u03C3\u03BC\u03AD\
        \u03BD\u03B7 \u03BA\u03B1\u03B9 \u03B5\u03C5\u03C6\u03C5\u03AE\u03C2, \u03C3\
        \u03C5\u03BD\u03BF\u03BC\u03B9\u03BB\u03B7\u03C4\u03B9\u03BA\u03AE \u03BA\u03B1\
        \u03B9 \u03CC\u03C7\u03B9 \u03B8\u03B5\u03B1\u03C4\u03C1\u03B9\u03BA\u03AE\
        . \u039D\u03B1 \u03C0\u03BF\u03B9\u03BA\u03AF\u03BB\u03BB\u03B5\u03B9 \u03C6\
        \u03C5\u03C3\u03B9\u03BA\u03AC \u03BF \u03B5\u03C0\u03B9\u03C4\u03BF\u03BD\
        \u03B9\u03C3\u03BC\u03CC\u03C2 \u2014 \u03BF\u03B9 \u03B5\u03C1\u03C9\u03C4\
        \u03AE\u03C3\u03B5\u03B9\u03C2 \u03BD\u03B1 \u03BC\u03B7\u03BD \u03AD\u03C7\
        \u03BF\u03C5\u03BD \u03CC\u03BB\u03B5\u03C2 \u03C4\u03BF\u03BD \u03AF\u03B4\
        \u03B9\u03BF \u03B1\u03BD\u03BF\u03B4\u03B9\u03BA\u03CC \u03C4\u03CC\u03BD\
        \u03BF, \u03BA\u03AC\u03C0\u03BF\u03B9\u03B5\u03C2 \u03BD\u03B1 \u03BA\u03B1\
        \u03C4\u03B1\u03BB\u03AE\u03B3\u03BF\u03C5\u03BD \u03C3\u03C7\u03B5\u03B4\u03CC\
        \u03BD \u03C3\u03B5 \u03B4\u03B7\u03BB\u03CE\u03C3\u03B5\u03B9\u03C2. \u039D\
        \u03B1 \u03C5\u03C0\u03AC\u03C1\u03C7\u03B5\u03B9 \u03BC\u03B9\u03B1 \u03B5\
        \u03BB\u03B1\u03C6\u03C1\u03B9\u03AC, \u03BE\u03B7\u03C1\u03AE, \u03BA\u03B1\
        \u03B9 \u03B5\u03BD\u03AF\u03BF\u03C4\u03B5 \u03BC\u03B9\u03B1 \u03B4\u03CC\
        \u03C3\u03B7 \u03C7\u03B9\u03BF\u03CD\u03BC\u03BF\u03C1. \u0394\u03B9\u03B1\
        \u03B2\u03AC\u03C3\u03C4\u03B5 \u03C4\u03BF \u03B5\u03BE\u03AE\u03C2: "
      he: "\u05E7\u05E8\u05D9\u05D9\u05DF \u05D7\u05D3\u05E9\u05D5\u05EA \u05D1\u05D5\
        \u05D2\u05E8 \u05D5\u05E1\u05D9\u05DE\u05E4\u05D8\u05D9 \u05D1\u05E1\u05D2\
        \u05E0\u05D5\u05DF NPR \u2014 \u05D7\u05DD, \u05E0\u05D9\u05E0\u05D5\u05D7\
        \ \u05D5\u05D7\u05D1\u05D9\u05D1, \u05E2\u05DD \u05E0\u05D9\u05E6\u05D5\u05E5\
        \ \u05E7\u05D8\u05DF \u05E9\u05DC \u05E4\u05DC\u05D9\u05D0\u05D4 \u05DE\u05D1\
        \u05E6\u05D1\u05E5. \u05DE\u05DC\u05D5\u05D8\u05E9 \u05D5\u05D0\u05D9\u05E0\
        \u05D8\u05DC\u05D9\u05D2\u05E0\u05D8\u05D9, \u05E9\u05D9\u05D7\u05EA\u05D9\
        \ \u05D5\u05DC\u05D0 \u05EA\u05D9\u05D0\u05D8\u05E8\u05DC\u05D9. \u05D2\u05D5\
        \u05D5\u05DF \u05D1\u05D0\u05D5\u05E4\u05DF \u05D8\u05D1\u05E2\u05D9 \u05D0\
        \u05EA \u05D4\u05D0\u05D9\u05E0\u05D8\u05D5\u05E0\u05E6\u05D9\u05D4 \u2014\
        \ \u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05D0 \u05DB\u05D5\u05DC\u05DF \u05E2\
        \u05D5\u05DC\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E6\u05D5\u05E8\
        \u05D4; \u05D7\u05DC\u05E7\u05DF \u05DE\u05E1\u05EA\u05D9\u05D9\u05DE\u05D5\
        \u05EA \u05DB\u05DE\u05E2\u05D8 \u05DB\u05D4\u05E6\u05D4\u05E8\u05D4. \u05E7\
        \u05DC\u05D9\u05DC, \u05DE\u05D0\u05D5\u05E4\u05E7, \u05E2\u05DD \u05E0\u05D2\
        \u05D9\u05E2\u05D4 \u05E9\u05DC \u05D4\u05D5\u05DE\u05D5\u05E8 \u05D9\u05D1\
        \u05E9 \u05DC\u05E2\u05D9\u05EA\u05D9\u05DD. \u05E7\u05E8\u05D0\u05D5 \u05D6\
        \u05D0\u05EA: "
      ms: "Gaya penyampai berita yang matang dan berwibawa, ala NPR \u2014 mesra,\
        \ santai, dan peramah, dengan sedikit rasa ingin tahu yang terserlah. Penyampaian\
        \ yang rapi dan bijak, bersifat perbualan, bukan teatrikal. Pelbagaikan intonasi\
        \ secara semula jadi \u2014 soalan tidak semuanya berintonasi menaik; ada\
        \ yang berakhir hampir seperti kenyataan. Ringan, bersahaja, kadang-kadang\
        \ diselitkan sentuhan jenaka kering. Baca ini: "
      sw: "Mkomavu, mwenye kuvutia, kama mtangazaji mahiri wa redio \u2014 joto, mtulivu,\
        \ na rafiki, huku ukionyesha cheche kidogo ya udadisi. Fasaha na mwenye akili,\
        \ ukizungumza kwa mtindo wa mazungumzo, si wa kuigiza. Tofautisha mdundo wa\
        \ sauti kiasilia \u2014 maswali yasiishie kwa sauti inayopanda kila mara;\
        \ mengine yafunge kama matamko ya kawaida. Njia yako iwe nyepesi, kavu, na\
        \ mara kwa mara ikidokeza ucheshi. Soma hii: "
      ro: "Stil: Matur, prezentator de \u0219tiri simpatic, \xEEn maniera NPR \u2014\
        \ cald, relaxat \u0219i prietenos, cu o lic\u0103rire de uimire ce transpare.\
        \ Rafinat \u0219i inteligent, conversa\u021Bional, nu teatral. Variaz\u0103\
        \ natural intona\u021Bia \u2014 \xEEntreb\u0103rile nu urc\u0103 toate la\
        \ fel; unele se \xEEncheie aproape ca ni\u0219te afirma\u021Bii. U\u0219or,\
        \ sec, uneori cu o tent\u0103 de umor. Cite\u0219te asta: "
      bg: "\u0421\u0442\u0438\u043B: \u0417\u0440\u044F\u043B, \u043F\u0440\u0438\u044F\
