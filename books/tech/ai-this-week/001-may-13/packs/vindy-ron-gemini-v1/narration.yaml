        \u0433\u0435\u043D\u0442\u043D\u044B\u0439, \u0440\u0430\u0437\u0433\u043E\
        \u0432\u043E\u0440\u043D\u044B\u0439, \u043D\u0435 \u0442\u0435\u0430\u0442\
        \u0440\u0430\u043B\u044C\u043D\u044B\u0439. \u0415\u0441\u0442\u0435\u0441\
        \u0442\u0432\u0435\u043D\u043D\u043E \u0432\u0430\u0440\u044C\u0438\u0440\u0443\
        \u0439\u0442\u0435 \u0438\u043D\u0442\u043E\u043D\u0430\u0446\u0438\u0438\
