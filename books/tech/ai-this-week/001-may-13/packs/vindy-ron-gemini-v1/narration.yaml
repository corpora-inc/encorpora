        \ \u0628\u062E\u0648\u0627\u0646\u06CC\u062F: "
      hu: "\xC9rett, szerethet\u0151, NPR-jelleg\u0171 h\xEDrbemond\xF3 \u2014 melegsz\xED\
        v\u0171, nyugodt \xE9s bar\xE1ts\xE1gos, egy apr\xF3, r\xE1csod\xE1lkoz\xF3\
        \ csillog\xE1ssal a hangj\xE1ban. Kifinomult \xE9s intelligens, besz\xE9lget\u0151\
        \ hangnem\u0171, nem te\xE1tr\xE1lis. Term\xE9szetes hanglejt\xE9ssel, v\xE1\
        ltozatosan: a k\xE9rd\xE9sek ne egyform\xE1n emelkedjenek; n\xE9melyik szinte\
        \ \xE1ll\xEDt\xE1sk\xE9nt v\xE9gz\u0151dj\xF6n. K\xF6nnyed, sz\xE1raz, olykor\
        \ egy csipetnyi humorral. Ezt olvasd fel: "
      sl: "Zrel, simpati\u010Den moderator v slogu NPR-ja \u2013 topel, spro\u0161\
        \u010Den in prijazen, z rahlo presevajo\u010Do iskrico radovednosti. Kultiviran\
        \ in inteligenten, pogovoren, ne teatralen. Intonacija naj bo naravna in raznolika\
        \ \u2013 vpra\u0161anja naj se ne dvigajo vsa enako; nekatera naj se kon\u010D\
        ajo skoraj kot trditve. Lahkoten, suh, ob\u010Dasno z nekaj humorja. Preberite\
        \ to: "
      cs: "Styl: Zral\xFD, sympatick\xFD moder\xE1tor ve stylu ve\u0159ejnopr\xE1\
        vn\xEDho rozhlasu \u2014 srde\u010Dn\xFD, uvoln\u011Bn\xFD a p\u0159\xE1telsk\xFD\
        , s lehkou, prosv\xEDtaj\xEDc\xED jisk\u0159i\u010Dkou \xFAdivu. Kultivovan\xFD\
        \ a inteligentn\xED, s projevem sp\xED\u0161e konverza\u010Dn\xEDm ne\u017E\
        \ teatr\xE1ln\xEDm. P\u0159irozen\u011B obm\u011B\u0148ujte intonaci \u2014\
        \ ot\xE1zky nezvedejte v\u017Edy stejn\xFDm zp\u016Fsobem; n\u011Bkter\xE9\
        \ mohou kon\u010Dit t\xE9m\u011B\u0159 jako prost\xE9 sd\u011Blen\xED. Lehk\xFD\
        , such\xFD t\xF3n, n\u011Bkdy s n\xE1dechem humoru. \u010Ct\u011Bte toto: "
      sk: "Zrel\xFD, sympatick\xFD moder\xE1tor spravodajstva v \u0161t\xFDle NPR\
        \ \u2014 srde\u010Dn\xFD, uvo\u013Enen\xFD a priate\u013Esk\xFD, s jemn\xFD\
        m z\xE1bleskom \xFAdivu, ktor\xFD presvit\xE1. Kultivovan\xFD a inteligentn\xFD\
        , konverza\u010Dn\xFD, nie teatr\xE1lny. Prirodzene me\u0148te inton\xE1ciu\
        \ \u2014 ot\xE1zky nemaj\xFA st\xFApa\u0165 v\u017Edy rovnako; niektor\xE9\
        \ sa m\xF4\u017Eu kon\u010Di\u0165 takmer ako kon\u0161tatovania. \u013Dahk\xFD\
        , such\xFD, miestami s n\xE1dychom humoru. \u010C\xEDtajte toto: "
      uk: "\u0423 \u0441\u0442\u0438\u043B\u0456 \u0437\u0440\u0456\u043B\u043E\u0433\
        \u043E, \u043F\u0440\u0438\u0454\u043C\u043D\u043E\u0433\u043E \u0432\u0435\
        \u0434\u0443\u0447\u043E\u0433\u043E \u043D\u043E\u0432\u0438\u043D \u0430\
        -\u043B\u044F NPR: \u0442\u0435\u043F\u043B\u0438\u0439, \u043D\u0435\u0432\
        \u0438\u043C\u0443\u0448\u0435\u043D\u0438\u0439 \u0456 \u043F\u0440\u0438\
