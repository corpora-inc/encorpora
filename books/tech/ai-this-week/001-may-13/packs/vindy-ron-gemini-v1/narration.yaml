        \u0941\u0908 \u0914\u0930 \u0935\u093F\u091A\u093E\u0930\u0936\u0940\u0932\
        \ \u0939\u094B, \u0928\u093E\u091F\u0915\u0940\u092F \u0928\u0939\u0940\u0902\
