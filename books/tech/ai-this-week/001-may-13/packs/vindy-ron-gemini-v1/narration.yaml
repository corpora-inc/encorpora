      ca: "Estil: Madur, agradable, amb la calidesa d'un presentador de not\xEDcies\
        \ a l'estil NPR \u2014 relaxat, proper i amb una petita espurna de curiositat.\
        \ Refinat i intel\xB7ligent, conversacional i gens teatral. Modula la teva\
        \ entonaci\xF3 amb naturalitat: les preguntes no han de pujar totes de la\
        \ mateixa manera; algunes poden acabar gaireb\xE9 com afirmacions. Lleuger,\
        \ sec, amb un punt d'humor ocasional. Llegeix aix\xF2: "
      id: "Gaya penyampaian: Presenter berita gaya NPR yang dewasa dan simpatik \u2014\
        \ hangat, santai, dan ramah, dengan sedikit nuansa kekaguman yang terpancar.\
        \ Profesional dan cerdas, dengan gaya percakapan yang alami, bukan teatrikal.\
        \ Variasikan intonasi secara alami \u2014 pertanyaan tidak semuanya bernada\
        \ naik; beberapa bahkan terdengar seperti pernyataan. Ringan, humor datar,\
        \ terkadang sedikit sentuhan jenaka. Baca ini: "
      vi: "Phong c\xE1ch: Tr\u01B0\u1EDFng th\xE0nh, d\u1EC5 m\u1EBFn, nh\u01B0 m\u1ED9\
        t ng\u01B0\u1EDDi d\u1EABn ch\u01B0\u01A1ng tr\xECnh tin t\u1EE9c phong c\xE1\
        ch NPR \u2014 \u1EA5m \xE1p, th\u01B0 th\xE1i v\xE0 th\xE2n thi\u1EC7n, pha\
        \ ch\xFAt \xE1nh l\xEAn s\u1EF1 t\xF2 m\xF2 th\xEDch th\xFA. Ch\u1EC9n chu,\
        \ th\xF4ng minh, \u0111\u1ED1i tho\u1EA1i t\u1EF1 nhi\xEAn ch\u1EE9 kh\xF4\
        ng khoa tr\u01B0\u01A1ng. Ng\u1EEF \u0111i\u1EC7u bi\u1EBFn \u0111\u1ED5i\
        \ linh ho\u1EA1t, t\u1EF1 nhi\xEAn \u2014 c\xE1c c\xE2u h\u1ECFi kh\xF4ng\
        \ nh\u1EA5t thi\u1EBFt ph\u1EA3i l\xEAn gi\u1ECDng; \u0111\xF4i khi k\u1EBF\
        t th\xFAc t\u1EF1a nh\u01B0 m\u1ED9t c\xE2u kh\u1EB3ng \u0111\u1ECBnh. Nh\u1EB9\
        \ nh\xE0ng, th\xE2m th\xFAy, \u0111\xF4i khi c\xF3 ch\xFAt h\xE0i h\u01B0\u1EDB\
        c. \u0110\u1ECDc \u0111o\u1EA1n n\xE0y: "
      hr: "Kao zreo i simpati\u010Dan radijski voditelj \u2013 topao, opu\u0161ten\
        \ i srda\u010Dan, s blagim sjajem znati\u017Eelje. Ugla\u0111en i inteligentan,\
        \ razgovoran, a ne teatralan. Prirodno varirajte intonaciju \u2013 pitanja\
        \ ne moraju uvijek zavr\u0161avati uzlazno; neka mogu zvu\u010Dati gotovo\
        \ kao izjave. Lagan, suptilan, ponekad s da\u0161kom humora. Pro\u010Ditaj\
        \ ovo: "
      th: "\u0E19\u0E49\u0E33\u0E40\u0E2A\u0E35\u0E22\u0E07\u0E41\u0E1A\u0E1A\u0E1C\
