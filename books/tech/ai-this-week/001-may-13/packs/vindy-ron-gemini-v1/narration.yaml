    role: host
    # Per-speaker Director's Notes. Sits between pack-level and per-segment
    # in the resolution order. Goal: chill conversational tech-podcast host,
    # not theatrical, not every question rising — varied prosody.
    director_prompt: "Style: Mature, likeable NPR-style news presenter — warm, relaxed, and friendly, with a little gleam of wonder showing through. Polished and intelligent, conversational not theatrical. Vary your inflection naturally — questions don't all rise the same way; some end almost as statements. Light, dry, sometimes a touch of humor. Read this: "
    # Per-language director prompts. The English prompt biases Gemini to
    # produce English audio when given non-English text on short segments
    # (observed on ch00-002 ES). Each entry overrides the English default
    # when generating in that target language. Add a new lang only after
    # ear-testing one segment in that language. JIT — write as we ship.
    director_prompt_translations:
      es: "Estilo: Presentadora madura y agradable, al estilo NPR — cálida, relajada y amistosa, con un leve destello de asombro. Pulida e inteligente, conversacional, no teatral. Varía tu entonación naturalmente — las preguntas no siempre suben igual; algunas terminan casi como afirmaciones. Ligera, seca, a veces con un toque de humor. Lee esto en español: "
      fr: "Style : Mature, bienveillant et attachant, dans l'esprit d'un présentateur de radio publique. Soyez chaleureux, détendu et amical, avec une pointe d'émerveillement qui transparaît. Le ton doit être soigné et intelligent, conversationnel plutôt que théâtral. Modulez votre intonation naturellement : les questions ne montent pas toutes de la même façon ; certaines se terminent presque comme des affirmations. Soyez léger, parfois sec, avec une touche d'humour occasionnelle. Lisez ceci : "
      de: "Stil: Reif, sympathisch, wie ein Nachrichtensprecher im NPR-Stil – warm, entspannt und freundlich, mit einem Hauch von Staunen in der Stimme. Kultiviert und intelligent, im Gesprächston, nicht theatralisch. Variieren Sie Ihre Sprachmelodie natürlich – Fragen enden nicht alle mit steigendem Ton; manche klingen fast wie Feststellungen. Leicht, trocken, manchmal mit einem Augenzwinkern. Lesen Sie dies: "
      it: "Stile: Maturo, affabile, come un presentatore radiofonico di alto livello — caldo, rilassato e amichevole, con un barlume di curiosità che traspare. Colto e intelligente, colloquiale, non teatrale. Modula l'intonazione con naturalezza — le domande non devono avere tutte la stessa cadenza ascendente; alcune possono terminare quasi come affermazioni. Leggero, con un umorismo sottile, a volte. Leggi questo: "
      pt: "Estilo: Maduro e simpático, como um apresentador de notícias ao estilo da NPR — caloroso, descontraído e amigável, com um leve brilho de admiração. Polido e inteligente, com um tom conversacional e não teatral. Varie a sua entonação naturalmente — nem todas as perguntas devem ter a mesma inflexão ascendente; algumas terminam quase como afirmações. Um humor leve e seco, com toques ocasionais. Leia isto: "
      ja: "声のトーンは、成熟した好感の持てるNPRスタイルのプレゼンターをイメージしてください。温かく、落ち着いていて、親しみやすい雰囲気で、知的な好奇心やふとした驚きが垣間見えるように。洗練されて知的で、芝居がかった感じではなく、会話をするように自然に話してください。イントネーションは変化に富ませ、質問でも語尾が必ずしも上がるわけではなく、まるで平叙文のように聞こえるものも含まれます。軽妙でドライ、時にユーモアも感じさせるような語り口で。読み上げてください: "
      ko: "NPR 앵커처럼 원숙하고 호감 가는 느낌으로, 따뜻하고 편안하며 친근하게 들려주세요. 경이로움이 살짝 엿보이도록, 세련되고 지적이지만 연극적이지 않고 대화하듯이 말이죠. 억양은 자연스럽게 변화를 주되, 질문이라도 끝을 항상 올리지 말고 때로는 평서문처럼 마무리하는 식으로요. 가볍고 담백하며, 때로는 살짝 유머가 섞인 어조를 더해주세요. 다음을 읽어주세요: "
      zh: "像NPR新闻主播一样，成熟稳重，亲和友善。语调温和从容，言语间流露着一丝探究的好奇心。表达得体，睿智，采用自然对话式，而非刻意或戏剧化的表演。语调变化自然，疑问句并非一概上扬，有些甚至接近陈述句的平稳。整体风格轻松，偶尔带点干冷的幽默。请读: "
      ar: "بأسلوب ناضج ومحبوب، كمقدم أخبار متزن، دافئ وهادئ وودود، يظهر من خلاله بريق خفيف من الدهشة. مصقول وذكي، حواري غير تمثيلي. نوع في نبرة صوتك طبيعياً — فالأسئلة لا ترتفع كلها بنفس الطريقة؛ بعضها ينتهي وكأنه جمل تقريرية. خفيف النبرة، يتمتع بفكاهة جافة أحيانًا، مع لمسة من الدعابة. اقرأ هذا: "
      hi: "शैली: एक परिपक्व और प्रभावशाली NPR-शैली के उद्घोषक जैसी – गर्मजोशी से भरी, सहज और मैत्रीपूर्ण, जिसमें कहीं-कहीं हल्की-सी जिज्ञासा या विस्मय की झलक हो। प्रस्तुति सुलझी हुई और विचारशील हो, नाटकीय नहीं बल्कि संवादात्मक। स्वर के उतार-चढ़ाव में सहजता और विविधता बनाए रखें – सभी प्रश्न एक ही अंदाज़ में ऊपर न उठें; कुछ तो जैसे बयान हों। प्रस्तुति हल्की, सूक्ष्म और कभी-कभी हास्यपूर्ण हो। इसे पढ़ें: "
      ru: "Стиль: Зрелый, обаятельный ведущий новостей в стиле NPR — теплый, расслабленный и дружелюбный, с легким проблеском любопытства. Отточенный и интеллигентный, разговорный, не театральный. Естественно варьируйте интонации — не все вопросы должны одинаково идти вверх; некоторые могут заканчиваться почти как утверждения. Легкий, сухой, иногда с ноткой юмора. Прочитайте это: "
      nl: "Volwassen, sympathieke NPR-presentator – warm, ontspannen en gemoedelijk, met een licht sprankje verwondering dat doorschemert. Gepolijst en intelligent; converserend van aard, niet theatraal. Varieer je intonatie natuurlijk; vragen gaan niet allemaal op dezelfde manier omhoog, sommige eindigen bijna als mededelingen. Luchtig, droog, soms een vleugje humor. Lees dit: "
      pl: "Dojrzały, sympatyczny prezenter radiowy – ciepły, swobodny i przyjazny, z widoczną nutą zaciekawienia. Opanowany i inteligentny, konwersacyjny, nie teatralny. Naturalnie moduluj intonację – pytania nie zawsze kończą się rosnąco; niektóre brzmią niemal jak stwierdzenia. Lekki, powściągliwy, czasem z odrobiną humoru. Przeczytaj to: "
      tr: "Olgun, sempatik, adeta bir NPR sunucusu gibi – sıcak, rahat ve cana yakın bir edayla, içinde hafif bir merak pırıltısı taşıyarak. Düzgün, akıllıca ve sohbet havasında, tiyatrovari bir üsluptan kaçınarak. Tonlamanızı doğal bir şekilde değiştirin; tüm sorular aynı tonda yükselmesin, bazıları neredeyse birer açıklama gibi son bulsun. Hafif, yer yer ince bir mizahla. Bunu oku: "
      sv: "Mogen, sympatisk programledare i NPR-anda – varm, avslappnad och vänlig, med en glimt av förundran. Polerad och intelligent, med en ledig samtalston, inte teatralisk. Variera intonationen naturligt – inte alla frågor ska ha ett stigande tonfall; vissa kan avslutas nästan som påståenden. Lätt, torr, ibland med en gnutta humor. Läs detta: "
      da: "Moden, sympatisk nyhedsvært, i NPR-stil – varm, afslappet og venlig, hvor et lille glimt af undren skinner igennem. Velformuleret og intelligent, samtaleagtig, ikke teatralsk. Variér din intonation naturligt – ikke alle spørgsmål skal have den samme stigende tone; nogle kan ende næsten som konstaterende udsagn. Let, tør, indimellem med et strejf af humor. Læs dette: "
      "no": "Stil: Moden, sympatisk, som en NPR-nyhetspresentatør – varm, avslappet og vennlig, med et lite glimt av undring som skinner gjennom. Polert og intelligent, samtalende, ikke teatralsk. Varier intonasjonen naturlig – spørsmål stiger ikke alltid likt; noen kan nesten ende som konstaterende utsagn. Lett, tørr, av og til med et snev av humor. Les dette: "
      fi: "Kypsä, sympaattinen NPR-tyylinen uutisjuontaja – lämminhenkinen, rento ja ystävällinen, äänessä pieni uteliaisuuden ja ihmettelyn pilkahdus. Huoliteltu ja älykäs, puhetyyliltään luonnollisen keskustelunomainen, ei teatraalinen. Intonaatio vaihtelee luonnollisesti – kysymykset eivät kaikki nouse samalla tavalla, vaan jotkut päättyvät lähes toteamukseen. Kevyt, hienovarainen ja toisinaan aavistuksen humoristinen. Lue tämä: "
      el: "Παρουσιάστε το κείμενο με το ύφος ενός ώριμου, συμπαθούς εκφωνητή ειδήσεων, εμπνευσμένου από το NPR — ζεστός, χαλαρός και φιλικός, με μια υποψία θαυμασμού να διακρίνεται. Η εκφορά του λόγου να είναι εκλεπτυσμένη και ευφυής, συνομιλητική και όχι θεατρική. Να ποικίλλει φυσικά ο επιτονισμός — οι ερωτήσεις να μην έχουν όλες τον ίδιο ανοδικό τόνο, κάποιες να καταλήγουν σχεδόν σε δηλώσεις. Να υπάρχει μια ελαφριά, ξηρή, και ενίοτε μια δόση χιούμορ. Διαβάστε το εξής: "
      he: "קריין חדשות בוגר וסימפטי בסגנון NPR — חם, נינוח וחביב, עם ניצוץ קטן של פליאה מבצבץ. מלוטש ואינטליגנטי, שיחתי ולא תיאטרלי. גוון באופן טבעי את האינטונציה — שאלות לא כולן עולות באותה צורה; חלקן מסתיימות כמעט כהצהרה. קליל, מאופק, עם נגיעה של הומור יבש לעיתים. קראו זאת: "
      ms: "Gaya penyampai berita yang matang dan berwibawa, ala NPR — mesra, santai, dan peramah, dengan sedikit rasa ingin tahu yang terserlah. Penyampaian yang rapi dan bijak, bersifat perbualan, bukan teatrikal. Pelbagaikan intonasi secara semula jadi — soalan tidak semuanya berintonasi menaik; ada yang berakhir hampir seperti kenyataan. Ringan, bersahaja, kadang-kadang diselitkan sentuhan jenaka kering. Baca ini: "
      sw: "Mkomavu, mwenye kuvutia, kama mtangazaji mahiri wa redio — joto, mtulivu, na rafiki, huku ukionyesha cheche kidogo ya udadisi. Fasaha na mwenye akili, ukizungumza kwa mtindo wa mazungumzo, si wa kuigiza. Tofautisha mdundo wa sauti kiasilia — maswali yasiishie kwa sauti inayopanda kila mara; mengine yafunge kama matamko ya kawaida. Njia yako iwe nyepesi, kavu, na mara kwa mara ikidokeza ucheshi. Soma hii: "
      "ro": "Stil: Matur, prezentator de știri simpatic, în maniera NPR — cald, relaxat și prietenos, cu o licărire de uimire ce transpare. Rafinat și inteligent, conversațional, nu teatral. Variază natural intonația — întrebările nu urcă toate la fel; unele se încheie aproape ca niște afirmații. Ușor, sec, uneori cu o tentă de umor. Citește asta: "
      "bg": "Стил: Зрял, приятен водещ, като от NPR — топъл, спокоен и приветлив, с лек проблясък на почуда. Изискан и интелигентен, разговорен, не театрален. Променяйте интонацията си естествено — въпросите не звучат винаги с една и съща възходяща интонация; някои завършват почти като изявления. Лек, сух, понякога с доза хумор. Прочетете това: "
      "bn": "একজন পরিপক্ক, শ্রোতাপ্রিয় সংবাদ উপস্থাপকের ভঙ্গিতে কথা বলুন — আন্তরিক, স্বচ্ছন্দ ও বন্ধুত্বপূর্ণ, যেখানে কৌতূহলের এক ঝলকও থাকবে। মার্জিত ও বুদ্ধিদীপ্ত হন, আলাপচারিতার মতো করে বলুন, কোনো নাটকীয়তা ছাড়াই। আপনার স্বরক্ষেপণে (inflection) স্বাভাবিক বৈচিত্র্য আনুন — প্রশ্নগুলো সবসময় একই রকম উচ্চস্বরে শেষ হবে না; কিছু প্রশ্ন প্রায় বক্তব্যের মতোই শোনাতে পারে। হালকা, শুষ্ক এবং মাঝে মাঝে সামান্য হাস্যরসের ছোঁয়া থাকুক। এটি পড়ুন: "
      "ta": "முதிர்ந்த, கவரும் NPR பாணி செய்தித் தொகுப்பாளரைப் போல் பேசுங்கள் — அன்புடன், நிதானமாக, தோழமையுடன், உள்ளே ஒரு லேசான வியப்புணர்வுடன். நேர்த்தியாகவும், புத்திசாலித்தனமாகவும், நாடகத்தன்மை இல்லாமல் உரையாடல் பாணியில் இருக்கட்டும் உங்கள் பேச்சு. உங்கள் குரலில் ஏற்ற இறக்கங்களை இயல்பாகவே கொண்டுவாருங்கள் — கேள்விகள் அனைத்தும் ஒரே மாதிரியாக உச்சஸ்தாயியில் ஒலிக்க வேண்டாம்; சில கேள்விகள் கூற்றுக்களைப் போலவே முடியலாம். இலகுவான, நுட்பமான (சில சமயங்களில் வறண்ட) நகைச்சுவையுடன் பேசுங்கள். இதனைப் படியுங்கள்: "
      "te": "పరిణతి చెందిన, ఆకట్టుకునే NPR తరహా వార్తా సమర్పకుడి వలె — ఆప్యాయంగా, ప్రశాంతంగా, స్నేహపూర్వకంగా ఉండండి, కొద్దిపాటి విస్మయం తొంగి చూస్తున్నట్లుగా. తీర్చిదిద్దబడిన, తెలివైన శైలిలో, నాటకీయత లేకుండా సంభాషణలా మాట్లాడండి. మీ స్వర విన్యాసాన్ని సహజంగా మార్చండి — ప్రశ్నలన్నీ ఒకే విధంగా పెరగకూడదు; కొన్ని దాదాపు ప్రకటనల వలె ముగుస్తాయి. తేలికపాటి, పొడిపొడి హాస్యాన్ని, కొన్నిసార్లు హాస్య స్పర్శను జోడించండి. దీన్ని చదవండి: "
      "mr": "शैली: प्रौढ आणि मनमिळाऊ, एनपीआरच्या निवेदकासारखे. आपुलकीने भरलेले, शांत आणि मैत्रीपूर्ण, ज्यात कुतूहलाची थोडी चमक दिसेल. उच्चार सुसंस्कृत आणि बुद्धिमान असावेत, पण नाटकी न वाटता संभाषणासारखे असावे. तुमच्या आवाजातील चढ-उतार नैसर्गिकरित्या बदलू द्या – प्रत्येक प्रश्नाचा सूर वर चढणार नाही; काही प्रश्न विधानाप्रमाणेच संपतील. हलकेपणा, सूक्ष्म विनोद आणि कधीकधी विनोदाची हलकी किनार असावी. हे वाचा: "
      "gu": "શૈલી: પરિપક્વ, પસંદ પડે તેવા NPR-શૈલીના સમાચાર પ્રસ્તુતકર્તા જેવા — હૂંફાળા, શાંત અને મૈત્રીપૂર્ણ, જેમાં આશ્ચર્યનો હળવો ચમકારો દેખાય. સુસંસ્કૃત અને બુદ્ધિશાળી, નાટકીય નહીં પણ વાતચીત જેવું. તમારા અવાજમાં કુદરતી ઉતાર-ચઢાવ રાખો. પ્રશ્નાર્થ વાક્યો હંમેશા એક જ રીતે ઊંચા ન જાય; કેટલાક તો જાણે કથન સ્વરૂપે જ પૂરા થાય. હળવો, સૂક્ષ્મ અને ક્યારેક રમૂજનો સ્પર્શ. આ વાંચો: "
      "kn": "ಎನ್.ಪಿ.ಆರ್. ಶೈಲಿಯ ಪ್ರಬುದ್ಧ, ಅಚ್ಚುಮೆಚ್ಚಿನ ನಿರೂಪಕರಂತೆ — ಆತ್ಮೀಯ, ನಿರಾಳ, ಸ್ನೇಹಪೂರ್ವಕವಾಗಿ ಮಾತನಾಡಿ, ನಿಮ್ಮ ಧ್ವನಿಯಲ್ಲಿ ಸಣ್ಣ ವಿಸ್ಮಯದ ಹೊಳಪು ಎದ್ದು ಕಾಣಲಿ. ಶೈಲಿ ಪರಿಷ್ಕೃತ ಮತ್ತು ಬುದ್ಧಿವಂತಿಕೆಯಿಂದ ಕೂಡಿರಲಿ; ನಾಟಕೀಯವಾಗಿರದೆ, ಸಂಭಾಷಣಾ ರೂಪದಲ್ಲಿರಲಿ. ಧ್ವನಿ ಏರಿಳಿತ ಸಹಜವಾಗಿ ಬದಲಾಗಲಿ — ಎಲ್ಲಾ ಪ್ರಶ್ನೆಗಳೂ ಒಂದೇ ರೀತಿ ಮೇಲೇರುವ ಧ್ವನಿಯಲ್ಲಿ ಕೊನೆಯಾಗದೆ, ಕೆಲವು ಹೇಳಿಕೆಗಳಂತೆ ಇರಲಿ. ಲಘುವಾದ, ನಿರ್ಲಿಪ್ತವಾದ ಮತ್ತು ಕೆಲವೊಮ್ಮೆ ಸಣ್ಣ ಹಾಸ್ಯದ ಸ್ಪರ್ಶವೂ ಇರಲಿ. ಓದಿರಿ: "
      "ne": "परिपक्व, मनपर्ने NPR-शैलीको समाचार प्रस्तुतकर्ताको जस्तो – न्यानो, सहज र मैत्रीपूर्ण। सानो कौतुकको झल्कोसहित। परिष्कृत र बौद्धिक, नाटकीय नभई कुराकानीपूर्ण। आवाजको आरोह-अवरोहलाई स्वाभाविक रूपमा परिवर्तन गर्नुहोस्—प्रश्नहरू सधैँ एकै किसिमले माथि नउठून्; केही त कथनजस्तै सुनिन्छन्। हलुका, सूक्ष्म र कहिलेकाहीँ थोरै हास्यको स्पर्श दिनुहोस्। यो पढ्नुहोस्: "
      "ur": "پختہ، دلکش این پی آر (NPR) طرز کے نیوز پیش کنندہ جیسا — گرمجوش، پُرسکون اور دوستانہ انداز، جس میں تجسس یا حیرت کی ہلکی سی جھلک بھی ہو۔ شائستہ اور ذہین ہو، گفتگو کا انداز ڈرامائی نہ ہو۔ آواز کے اتار چڑھاؤ میں فطری پن ہو — سوالات کا لہجہ ہمیشہ ایک سا بلند نہ ہو؛ کچھ تقریباً بیانات کی طرح ختم ہوں۔ ہلکا پھلکا، سنجیدہ مگر خشک نہیں، اور کبھی کبھار مزاح کا ہلکا سا تاثر بھی ہو۔ یہ پڑھیں: "
      "ca": "Estil: Madur, agradable, amb la calidesa d'un presentador de notícies a l'estil NPR — relaxat, proper i amb una petita espurna de curiositat. Refinat i intel·ligent, conversacional i gens teatral. Modula la teva entonació amb naturalitat: les preguntes no han de pujar totes de la mateixa manera; algunes poden acabar gairebé com afirmacions. Lleuger, sec, amb un punt d'humor ocasional. Llegeix això: "
      "id": "Gaya penyampaian: Presenter berita gaya NPR yang dewasa dan simpatik — hangat, santai, dan ramah, dengan sedikit nuansa kekaguman yang terpancar. Profesional dan cerdas, dengan gaya percakapan yang alami, bukan teatrikal. Variasikan intonasi secara alami — pertanyaan tidak semuanya bernada naik; beberapa bahkan terdengar seperti pernyataan. Ringan, humor datar, terkadang sedikit sentuhan jenaka. Baca ini: "
      "vi": "Phong cách: Trưởng thành, dễ mến, như một người dẫn chương trình tin tức phong cách NPR — ấm áp, thư thái và thân thiện, pha chút ánh lên sự tò mò thích thú. Chỉn chu, thông minh, đối thoại tự nhiên chứ không khoa trương. Ngữ điệu biến đổi linh hoạt, tự nhiên — các câu hỏi không nhất thiết phải lên giọng; đôi khi kết thúc tựa như một câu khẳng định. Nhẹ nhàng, thâm thúy, đôi khi có chút hài hước. Đọc đoạn này: "
      "hr": "Kao zreo i simpatičan radijski voditelj – topao, opušten i srdačan, s blagim sjajem znatiželje. Uglađen i inteligentan, razgovoran, a ne teatralan. Prirodno varirajte intonaciju – pitanja ne moraju uvijek završavati uzlazno; neka mogu zvučati gotovo kao izjave. Lagan, suptilan, ponekad s daškom humora. Pročitaj ovo: "
      "th": "น้ำเสียงแบบผู้ประกาศข่าวสไตล์ NPR ที่สุขุม น่าฟัง อบอุ่น ผ่อนคลาย เป็นกันเอง แฝงแววความทึ่งเล็กน้อย ดูสุภาพ ฉลาด มีภูมิ เป็นธรรมชาติเหมือนกำลังพูดคุย ไม่ใช่การแสดง ใช้ระดับเสียงที่หลากหลายอย่างเป็นธรรมชาติ โดยเฉพาะประโยคคำถาม ไม่จำเป็นต้องขึ้นเสียงสูงเสมอไป บางครั้งอาจจบคล้ายประโยคบอกเล่า น้ำเสียงเบาๆ คมคาย และอาจมีอารมณ์ขันเล็กน้อย อ่านออกเสียงว่า: "
      "fa": "با لحنی پخته و دلنشین، شبیه گویندگان خبر NPR، گرم، آرام و دوستانه، با ته مایه‌ای از کنجکاوی و اعجاب. سنجیده و هوشمندانه، گفتاری نه نمایشی. آهنگ صدایتان را طبیعی و متنوع کنید؛ پرسش‌ها همیشه با آهنگ یکسان بالا نروند و برخی از آن‌ها تقریباً مثل جملات خبری خاتمه یابند. لحنی سبک و موقر، با شوخ‌طبعی ظریف و کنترل‌شده. این را بخوانید: "
      "hu": "Érett, szerethető, NPR-jellegű hírbemondó — melegszívű, nyugodt és barátságos, egy apró, rácsodálkozó csillogással a hangjában. Kifinomult és intelligens, beszélgető hangnemű, nem teátrális. Természetes hanglejtéssel, változatosan: a kérdések ne egyformán emelkedjenek; némelyik szinte állításként végződjön. Könnyed, száraz, olykor egy csipetnyi humorral. Ezt olvasd fel: "
      "sl": "Zrel, simpatičen moderator v slogu NPR-ja – topel, sproščen in prijazen, z rahlo presevajočo iskrico radovednosti. Kultiviran in inteligenten, pogovoren, ne teatralen. Intonacija naj bo naravna in raznolika – vprašanja naj se ne dvigajo vsa enako; nekatera naj se končajo skoraj kot trditve. Lahkoten, suh, občasno z nekaj humorja. Preberite to: "
      "cs": "Styl: Zralý, sympatický moderátor ve stylu veřejnoprávního rozhlasu — srdečný, uvolněný a přátelský, s lehkou, prosvítající jiskřičkou údivu. Kultivovaný a inteligentní, s projevem spíše konverzačním než teatrálním. Přirozeně obměňujte intonaci — otázky nezvedejte vždy stejným způsobem; některé mohou končit téměř jako prosté sdělení. Lehký, suchý tón, někdy s nádechem humoru. Čtěte toto: "
      "sk": "Zrelý, sympatický moderátor spravodajstva v štýle NPR — srdečný, uvoľnený a priateľský, s jemným zábleskom údivu, ktorý presvitá. Kultivovaný a inteligentný, konverzačný, nie teatrálny. Prirodzene meňte intonáciu — otázky nemajú stúpať vždy rovnako; niektoré sa môžu končiť takmer ako konštatovania. Ľahký, suchý, miestami s nádychom humoru. Čítajte toto: "
      "uk": "У стилі зрілого, приємного ведучого новин а-ля NPR: теплий, невимушений і привітний, з легкою, ледь помітною іскоркою подиву. Витончений та інтелігентний, розмовний, а не театральний. Природно варіюйте інтонацію — питання не завжди мають однакову висхідну інтонацію; деякі можуть закінчуватися майже як ствердження. Легкий, сухий, іноді з ноткою гумору. Прочитайте це: "
      "lt": "Stilius: Brandus, malonus, NPR tipo naujienų pranešėjas. Būkite šiltas, atsipalaidavęs ir draugiškas, su persišviečiančiu smalsumo ir nuostabos spinduliu. Iškalba šlifuota ir protinga, kalbėkite bendraujamai, ne teatrališkai. Intonaciją keiskite natūraliai – ne visi klausimai turi kilti vienodai; kai kurie skamba beveik kaip teiginiai. Tonas lengvas, santūrus, kartais su švelniu humoro prieskoniu. Skaitykite tai: "
      "sr": "Stil: Zreo, dopadljiv NPR-ovski voditelj vesti — topao, opušten i prijateljski nastrojen, sa tračkom čuđenja. Uglađen i inteligentan, konverzacijski, a ne teatralan. Prirodno menjajte intonaciju — pitanja se ne završavaju sva istim podizanjem tona; neka zvuče gotovo kao izjave. Lagan, suptilan, ponekad sa dozom suvog humora. Pročitajte ovo: "
      "yue-Hant-HK": "聲線要成熟、穩重，有內涵，聽落去舒服又親切，就好似電台節目主持咁。語氣放鬆、溫和，帶點知性嘅好奇同對事物嘅探索。吐字清晰，感覺有修養、有智慧，但唔係做作，要好自然、好似傾緊偈咁。語調變化要自然，唔好平板，例如問問題嘅時候，唔使吓吓都將聲線提高，有時可以用平穩嘅語氣帶出問題。整體風格輕盈、帶點乾冷嘅幽默感。請讀： "
  analyst:
    backend: gemini
    provider_voice_id: Charon
    voice_id: gemini-ron
    character_id: ron
    display_name: Ron
    role: analyst
host_speaker_id: host

tts:
  cfg_weight: 0.85
  exaggeration: 0.3
  temperature: 0.3
  repetition_penalty: 2.0
  top_p: 0.85
  min_p: 0.1

retry:
  # Gemini is near-deterministic — param jitter mostly reproduces the same
  # defect at full cost. After 2 attempts on a given text, codex auto_rewrite
  # is the right escape hatch (changes the INPUT, which is what actually
  # changes Gemini's output). See memory: feedback_gemini_retries_are_waste.
  max_retries: 2
  jitter: 0.25
  schedules:
    - {}
    - cfg_weight: 0.8
      temperature: 0.5
    - cfg_weight: 0.5
      exaggeration: 0.2
      temperature: 0.3
    - cfg_weight: 0.6
      exaggeration: 0.6
      temperature: 0.7
    - cfg_weight: 1.0
      temperature: 0.2

mastering:
  audio_bitrate: '64000'
  audio_codec: aac
  output_ext: .m4a
  target_lufs: -22.0
  target_tp: -3.0

# Dialog packs: trim every segment to ~150ms trailing silence regardless of
# validator flags. The reader inserts inter-segment silence from
# audio_manifest_en.json's per-segment pause_after_ms (set by the pacing pass).
trimming:
  always_trim: true
  tail_grace_ms: 50
  tail_fade_ms: 100

# Dialog-pack validator overrides (added 2026-05-14).
# - Tighten first_word_weak from 0.20 -> 0.30: catches Vindy/Ron weak
#   onsets ("Exactly", "Anyone", "OpenAI says...") that slipped the default.
# - Tail-truncation free-transcribe check gates on vad_whisper_gap_ms > 600.
#   See ttsctl/changelog/decisions/2026-05-14_dialog_validators.md.
validation:
  first_word_weak_threshold: 0.30
  tail_free_transcribe_gate_ms: 600
  tail_free_transcribe_fail_wer: 0.5
  # Dialog packs keep first_word_weak blocking even on Gemini (the default
  # Gemini-voice downgrade is too lenient for hosted dialog).
  no_gemini_downgrade_checks:
    - first_word_weak

denoise:
  enabled: false

# Director's Notes prefix — reserved for the per-book director_prompt agent.
# Empty for issue 1 to establish bare-voice baseline. The architecture
# supports per-segment override via seg.tts.gemini_direction.
gemini:
  director_prompt: ""

voices:
  en: sky-21.wav
