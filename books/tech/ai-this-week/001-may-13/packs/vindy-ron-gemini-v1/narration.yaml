      \ and intelligent, conversational not theatrical. Vary your inflection naturally\
      \ \u2014 questions don't all rise the same way; some end almost as statements.\
      \ Light, dry, sometimes a touch of humor. Read this: "
    director_prompt_translations:
      es: "Estilo: Presentadora madura y agradable, al estilo NPR \u2014 c\xE1lida,\
        \ relajada y amistosa, con un leve destello de asombro. Pulida e inteligente,\
        \ conversacional, no teatral. Var\xEDa tu entonaci\xF3n naturalmente \u2014\
        \ las preguntas no siempre suben igual; algunas terminan casi como afirmaciones.\
        \ Ligera, seca, a veces con un toque de humor. Lee esto en espa\xF1ol: "
      fr: "Style : Mature, bienveillant et attachant, dans l'esprit d'un pr\xE9sentateur\
        \ de radio publique. Soyez chaleureux, d\xE9tendu et amical, avec une pointe\
        \ d'\xE9merveillement qui transpara\xEEt. Le ton doit \xEAtre soign\xE9 et\
        \ intelligent, conversationnel plut\xF4t que th\xE9\xE2tral. Modulez votre\
        \ intonation naturellement : les questions ne montent pas toutes de la m\xEA\
        me fa\xE7on ; certaines se terminent presque comme des affirmations. Soyez\
        \ l\xE9ger, parfois sec, avec une touche d'humour occasionnelle. Lisez ceci\
        \ : "
      de: "Stil: Reif, sympathisch, wie ein Nachrichtensprecher im NPR-Stil \u2013\
        \ warm, entspannt und freundlich, mit einem Hauch von Staunen in der Stimme.\
        \ Kultiviert und intelligent, im Gespr\xE4chston, nicht theatralisch. Variieren\
        \ Sie Ihre Sprachmelodie nat\xFCrlich \u2013 Fragen enden nicht alle mit steigendem\
        \ Ton; manche klingen fast wie Feststellungen. Leicht, trocken, manchmal mit\
        \ einem Augenzwinkern. Lesen Sie dies: "
      it: "Stile: Maturo, affabile, come un presentatore radiofonico di alto livello\
