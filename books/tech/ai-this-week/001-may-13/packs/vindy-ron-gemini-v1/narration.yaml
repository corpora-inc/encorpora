      hi: "\u0936\u0948\u0932\u0940: \u090F\u0915 \u092A\u0930\u093F\u092A\u0915\u094D\
        \u0935 \u0914\u0930 \u092A\u094D\u0930\u092D\u093E\u0935\u0936\u093E\u0932\
