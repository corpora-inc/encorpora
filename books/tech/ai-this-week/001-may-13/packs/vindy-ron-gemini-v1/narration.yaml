      ru: "\u0421\u0442\u0438\u043B\u044C: \u0417\u0440\u0435\u043B\u044B\u0439, \u043E\
        \u0431\u0430\u044F\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0432\u0435\u0434\
