        \ traspare. Colto e intelligente, colloquiale, non teatrale. Modula l'intonazione\
        \ con naturalezza \u2014 le domande non devono avere tutte la stessa cadenza\
        \ ascendente; alcune possono terminare quasi come affermazioni. Leggero, con\
        \ un umorismo sottile, a volte. Leggi questo: "
      pt: "Estilo: Maduro e simp\xE1tico, como um apresentador de not\xEDcias ao estilo\
        \ da NPR \u2014 caloroso, descontra\xEDdo e amig\xE1vel, com um leve brilho\
        \ de admira\xE7\xE3o. Polido e inteligente, com um tom conversacional e n\xE3\
        o teatral. Varie a sua entona\xE7\xE3o naturalmente \u2014 nem todas as perguntas\
        \ devem ter a mesma inflex\xE3o ascendente; algumas terminam quase como afirma\xE7\
        \xF5es. Um humor leve e seco, com toques ocasionais. Leia isto: "
      ja: "\u58F0\u306E\u30C8\u30FC\u30F3\u306F\u3001\u6210\u719F\u3057\u305F\u597D\
