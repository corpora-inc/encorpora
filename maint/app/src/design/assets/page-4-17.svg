<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100" font-family="Georgia, 'Times New Roman', serif" fill="#111">
  <rect width="850" height="1100" fill="#fdfdfb"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15">
    <text x="70" y="60">MODEL 40 UTILITY PUMP</text>
    <text x="780" y="60" text-anchor="end">TROUBLESHOOTING</text>
  </g>
  <path d="M70 74h710" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="120" font-size="22" font-weight="bold">4.3.2  Suction strainer</text>
  <g font-size="17">
    <text x="70" y="160">A blocked strainer starves the pump of water, which lowers discharge</text>
    <text x="70" y="184">pressure at every speed. Inspect the basket before any test on the</text>
    <text x="70" y="208">suction side.</text>
  </g>
  <rect x="70" y="232" width="710" height="112" fill="none" stroke="#111" stroke-width="3"/>
  <text x="425" y="262" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="17" text-anchor="middle">WARNING</text>
  <g font-size="16" text-anchor="middle">
    <text x="425" y="292">Shut down the pump and relieve system pressure before you open the strainer</text>
    <text x="425" y="316">housing. Water under pressure can cause serious injury.</text>
  </g>
  <rect x="70" y="362" width="710" height="86" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="425" y="390" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="17" text-anchor="middle">CAUTION</text>
  <text x="425" y="420" font-size="16" text-anchor="middle">Do not run the pump with the strainer basket removed. Debris will damage the impeller.</text>
  <g font-size="17">
    <text x="70" y="490">a. Release the cover clamp and lift off the strainer cover (figure 4-6).</text>
    <text x="70" y="518">b. Lift the basket straight up out of the housing.</text>
    <text x="70" y="546">c. Hold the basket to the light and estimate the blocked screen area.</text>
    <text x="70" y="574">d. If no more than one quarter of the screen area is blocked, go to 4.3.3.</text>
    <text x="70" y="602">   Otherwise clean the basket (5.2.1) and repeat the operating check.</text>
  </g>
  <svg x="150" y="630" width="550" height="361" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="3">
    <!-- housing -->
    <path d="M200 120h240v220a20 20 0 0 1-20 20H220a20 20 0 0 1-20-20z"/>
    <path d="M80 250h120M440 250h120"/>
    <path d="M80 222h120M440 222h120"/>
    <!-- cover and clamp -->
    <rect x="186" y="96" width="268" height="24" rx="4"/>
    <path d="M300 96v-30h40v30"/>
    <!-- basket -->
    <path d="M240 130h160v190a12 12 0 0 1-12 12H252a12 12 0 0 1-12-12z" stroke-dasharray="8 6"/>
  </g>
  <g stroke="#111" stroke-width="1.5">
    <path d="M250 160h140M250 190h140M250 220h140M250 250h140M250 280h140M250 310h140"/>
    <path d="M280 135v190M320 135v190M360 135v190"/>
  </g>
  <g font-size="20" fill="#111">
    <path d="M340 70 L500 40" stroke="#111" stroke-width="1.5"/><text x="506" y="46">1</text>
    <path d="M440 108 L540 108" stroke="#111" stroke-width="1.5"/><text x="548" y="114">2</text>
    <path d="M400 290 L540 300" stroke="#111" stroke-width="1.5"/><text x="548" y="306">3</text>
    <path d="M100 236 L60 180" stroke="#111" stroke-width="1.5"/><text x="44" y="174">4</text>
  </g>
  <g font-size="16" fill="#111">
    <text x="40" y="392">1. Cover clamp  2. Strainer cover  3. Basket  4. Suction inlet</text>
  </g>
</svg>
  <g transform="translate(150 630) scale(0.859)">
    <rect width="640" height="420" fill="none" stroke="#111" stroke-width="1"/>
  </g>
  <text x="425" y="1020" font-size="16" text-anchor="middle" font-style="italic">Figure 4-6. Suction strainer</text>
  <path d="M70 1046h710" stroke="#111" stroke-width="1"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15">
    <text x="70" y="1072">Rev. C</text>
    <text x="780" y="1072" text-anchor="end" font-weight="bold">4-17</text>
  </g>
</svg>
