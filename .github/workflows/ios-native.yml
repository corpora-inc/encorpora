name: iOS native

# Catch Swift / Rust compile breakage in the iOS native layer BEFORE it reaches
# a device build. Each Tauri plugin's Swift is compiled by swift-rs from the
# plugin's own build script when building for an Apple target — so a plain
# `cargo build --target aarch64-apple-ios` of each plugin that ships an `ios/`
# Swift package reproduces errors like the offer-code redeem sheet's
# `async`-call-in-sync-context break, with no Xcode signing/archive needed.
#
# We build the PLUGINS (not the whole app) so the gate stays fast — it skips the
# heavy app + llama.cpp iOS compile while still exercising every plugin's Swift.

on:
  pull_request:
    paths:
      - "corpan/plugins/**/ios/**"
      - "corpan/plugins/**/src/**"
      - "corpan/plugins/**/Cargo.toml"
      - "corpan/plugins/**/build.rs"
      - ".github/workflows/ios-native.yml"
  push:
    branches: ["main"]
    paths:
      - "corpan/plugins/**/ios/**"
      - "corpan/plugins/**/src/**"
      - "corpan/plugins/**/Cargo.toml"
      - "corpan/plugins/**/build.rs"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch: {}

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins-ios:
    name: Tauri plugins · Swift compile (aarch64-apple-ios)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            corpan/plugins/tauri-plugin-iap
            corpan/plugins/tauri-plugin-haptics

      - name: Build every plugin that ships an ios/ Swift package
        run: |
          set -uo pipefail
          shopt -s nullglob
          # Plugins whose ios/ Swift package links a PREBUILT binary xcframework
          # that is NOT committed (gitignored / fetched out-of-band) — a clean CI
          # checkout has no binary, so swift-rs can't compile them. The pure-Swift
          # plugins (iap, haptics, tts, subscriptions, …) are what this gate
          # exists to protect; skip only the binary-dependent ones.
          SKIP="tauri-plugin-stt"
          built=0
          failed=()
          for ios_dir in corpan/plugins/*/ios; do
            plugin_dir="$(dirname "$ios_dir")"
            name="$(basename "$plugin_dir")"
            # Only Cargo plugins (the Swift is compiled by the crate's build script).
            [ -f "$plugin_dir/Cargo.toml" ] || { echo "skip $name (no Cargo.toml)"; continue; }
            case " $SKIP " in
              *" $name "*) echo "::notice::skipping $name (needs an out-of-repo binary xcframework)"; continue;;
            esac
            echo "::group::$name → cargo build --target aarch64-apple-ios"
            if ( cd "$plugin_dir" && cargo build --target aarch64-apple-ios ); then
              built=$((built + 1))
            else
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          echo "Compiled $built plugin(s) for iOS; ${#failed[@]} failed."
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::iOS Swift compile failed for: ${failed[*]}"
            exit 1
          fi
          if [ "$built" -eq 0 ]; then
            echo "::warning::No iOS plugins found to build."
          fi
