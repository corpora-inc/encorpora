name: adversarial-review

# The machine gatekeeper that replaces the human. Three adversarial lenses
# (correctness / security / pack-compat) read the PR diff and emit ONE pass/fail
# status. Pass = no unresolved high-severity finding. Single job named
# `adversarial-review` so it always reports — safe as a required check on `main`.
#
# Cost: one model call per lens per PR/queue-entry. Tune ADVERSARIAL_MODEL and
# MAX_DIFF_BYTES to manage spend; a false positive that blocks the queue is a
# detrimental process — fix the prompt fast rather than routing around the gate.

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Per-PR for pull_request (cancel superseded runs); unique per run in the merge
  # queue so a queued entry's review is never cancelled by another entry.
  group: adversarial-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  adversarial-review:
    name: adversarial-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run adversarial review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADVERSARIAL_MODEL: ${{ vars.ADVERSARIAL_MODEL || 'claude-sonnet-4-6' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python .github/scripts/adversarial_review.py
