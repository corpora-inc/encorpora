name: hygiene

# Cheap gates that protect the trunk: secret scanning + a big-file guard.
# Single job named `hygiene` so it always reports a status — safe as a required
# check on `main`. Runs on every PR and in the merge queue.

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "Scanning range ${base}..${head}"

      # Secret scanning via the gitleaks binary (free; the GitHub Action requires a
      # paid license for org accounts). Scans only the PR's commit range so legacy
      # history can't fail a new PR.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLO "${base}/${tarball}"
          curl -sSLO "${base}/gitleaks_${VERSION}_checksums.txt"
          # Verify integrity against the release's published checksums before use.
          grep " ${tarball}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "${tarball}" gitleaks
          gitleaks version

      - name: Secret scan (diff range)
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
            echo "No base commit resolved; scanning HEAD commit only."
            gitleaks detect --no-banner --redact --log-opts="--max-count=1 ${HEAD}"
          else
            gitleaks detect --no-banner --redact --log-opts="${BASE}..${HEAD}"
          fi

      # Signing-material guard: a filename backstop for what gitleaks structurally
      # cannot see. Measured with the pinned gitleaks 8.18.4 against real keytool
      # and openssl output: it flags `service-account.json`, `AuthKey.p8` and a
      # PEM `.key` (the `private-key` rule fires on the `-----BEGIN` armour) and
      # finds nothing at all in `.jks`, `.keystore`, `.p12` or a DER `.cer`.
      # Those are binary, so there is no armour to match, and at ~2.7 KB the
      # big-file guard never looks at them either. Without this step `.gitignore`
      # is the only thing keeping a production signing key out of a public repo.
      - name: Signing-material guard
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          # Exact repo-relative paths, one per line, that are allowed to carry a
          # matching name. Empty today. Adding a line is a reviewed decision made
          # in the PR that needs it — the guard only looks at files a PR ADDS, so
          # an entry is needed exactly once and can be removed afterwards.
          ALLOWLIST: ""
        run: |
          set -euo pipefail
          # Files ADDED in this range only, so already-tracked paths can never
          # fail a PR that does not touch them. --no-renames matters: rename
          # detection is on by default, so `git mv notes.txt key.jks` reports as
          # R and would otherwise slip through as "nothing added".
          # -z plus `read -d ''` avoids git's quoting of unusual paths.
          #
          # There is deliberately no pipeline in this step. Under `set -o
          # pipefail` an early-exiting consumer (`grep -q`, `head`, `grep -m1`)
          # makes the producer take SIGPIPE and the pipeline return 141, which
          # has silently inverted a check in this repo before. `shopt -s
          # nocasematch` gives case-insensitive matching with no subprocess.
          if [ -n "${BASE}" ]; then
            added() { git diff -z --name-only --diff-filter=A --no-renames "${BASE}" "${HEAD}"; }
          else
            echo "No base commit resolved; inspecting the head commit's additions only."
            added() { git diff-tree -z --name-only --diff-filter=A --no-renames --no-commit-id -r "${HEAD}"; }
          fi

          shopt -s nocasematch
          fail=0
          while IFS= read -r -d '' f; do
            allowed=0
            while IFS= read -r a; do
              [ -n "${a}" ] || continue
              if [ "${f}" = "${a}" ]; then allowed=1; fi
            done <<< "${ALLOWLIST}"
            [ "${allowed}" -eq 0 ] || continue
            case "${f}" in
              *.jks | *.keystore | *.p12 | *.pfx | *.p8 | *.mobileprovision | *.provisionprofile | \
              *.cer | *.crt | *.certSigningRequest | *.pem | *.key | *service-account*.json)
                echo "::error file=${f}::${f} looks like signing or credential material and must not be committed to this public repository. Keep it outside the repo (e.g. ~/.corpora-signing/) and reference it by absolute path; give CI the value as a base64 GitHub Actions secret. See corpan/corpan-app/RELEASE_SETUP.md. If this file genuinely carries no secret, add its exact path to ALLOWLIST in .github/workflows/hygiene.yml in this PR."
                fail=1
                ;;
            esac
          done < <(added)

          if [ "${fail}" -ne 0 ]; then
            echo "Signing-material guard failed. gitleaks cannot catch these: a binary keystore has no PEM armour to match and is too small for the big-file guard."
            exit 1
          fi
          echo "No signing material added."

      # Big-file guard: fail when a PR adds a large blob that isn't tracked by LFS.
      - name: Big-file guard
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          MAX_BYTES: "5242880" # 5 MiB
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
            echo "No base commit; skipping big-file guard."
            exit 0
          fi
          # Files added (A) or modified (M) in this range.
          mapfile -t files < <(git diff --name-only --diff-filter=AM "${BASE}" "${HEAD}")
          fail=0
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            # Skip files declared as LFS in .gitattributes. Captured rather than
            # piped into `grep -q`: under `set -o pipefail` a consumer that exits
            # on its first match can SIGPIPE the producer for a 141, which here
            # would read as "not LFS" and fail a legitimate LFS file.
            attr="$(git check-attr filter -- "${f}" 2>/dev/null || true)"
            case "${attr}" in
              *"filter: lfs"*) continue ;;
            esac
            size=$(stat -c%s "${f}")
            if [ "${size}" -gt "${MAX_BYTES}" ]; then
              echo "::error file=${f}::${f} is ${size} bytes (> ${MAX_BYTES}). Use Git LFS or store it out of the repo."
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "No oversized non-LFS files added."
