name: Deploy Encorpora to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/io/**"
      - "web/data/**"
      - "corpan/packs/**"
      - "web/pages/**"
      - "web/scripts/**"
      - "books/fascinating-curiosities/**"
      - ".github/workflows/hover-runner-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENCORPORA_BASE_PATH: /encorpora
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install io/ Dependencies
        working-directory: web/io
        run: npm install

      - name: Build io/ Site (Root)
        working-directory: web/io
        run: npm run build

      - name: Build Corpan Pages into io/out
        run: |
          node web/pages/build.js web/io/out

      - name: Install Hover Runner Dependencies
        working-directory: corpan/packs/hover-runner
        run: npm install --legacy-peer-deps

      - name: Build Hover Runner
        working-directory: corpan/packs/hover-runner
        run: npm run build

      - name: Package Hover Runner as ZIP
        run: |
          cd corpan/packs/hover-runner
          zip -r hover-runner.zip manifest.json dist/
          cd ../../..

      - name: Package Hanzi Atelier as ZIP
        run: |
          cd corpan/packs/hanzipan
          mkdir -p dist
          cat hanziwriter.min.js > dist/app.js
          printf '\n;' >> dist/app.js
          cat index.js >> dist/app.js
          cp styles.css dist/app.css
          zip -r hanzipan.zip manifest.json dist/ HANZIWRITER_LICENSE.txt data/
          cd ../../..

      - name: Install Juice Squeeze Dependencies
        working-directory: corpan/packs/juice-squeeze
        run: npm install --legacy-peer-deps

      - name: Build Juice Squeeze
        working-directory: corpan/packs/juice-squeeze
        run: npm run build

      - name: Package Juice Squeeze as ZIP
        run: |
          cd corpan/packs/juice-squeeze
          zip -r juice-squeeze.zip manifest.json dist/
          cd ../../..

      - name: Install Stargate Reader Dependencies
        working-directory: corpan/packs/stargate-reader
        run: npm install --legacy-peer-deps

      - name: Build Stargate Reader
        working-directory: corpan/packs/stargate-reader
        run: npm run build

      - name: Package Stargate Reader with Book Data
        run: |
          cd corpan/packs/stargate-reader
          mkdir -p data/books/book_monte_alban/audio
          BOOK_PACK=../../../books/fascinating-curiosities/01-mystery-of-monte-alban/pack
          cp "$BOOK_PACK/segments.json" data/books/book_monte_alban/
          cp "$BOOK_PACK/segments_es.json" data/books/book_monte_alban/
          cp "$BOOK_PACK/audio_manifest_en.json" data/books/book_monte_alban/
          cp "$BOOK_PACK/audio_manifest_es.json" data/books/book_monte_alban/
          cp -r "$BOOK_PACK/audio/en" data/books/book_monte_alban/audio/
          cp -r "$BOOK_PACK/audio/es" data/books/book_monte_alban/audio/
          echo '[{"id":"book_monte_alban","name":"The Mystery of Monte Albán","volume":1,"series":"Fascinating Curiosities of Human History","hasAudio":true,"availableLanguages":["en","es"]}]' > data/catalog.json
          zip -r stargate-reader.zip manifest.json dist/ data/
          cd ../../..

      - name: Copy Hover Runner into io/out
        run: |
          mkdir -p "web/io/out/corpan/packs/hover-runner"
          cp corpan/packs/hover-runner/manifest.json "web/io/out/corpan/packs/hover-runner/"
          cp -R corpan/packs/hover-runner/dist "web/io/out/corpan/packs/hover-runner/"
          cp corpan/packs/hover-runner/hover-runner.zip "web/io/out/corpan/packs/hover-runner.zip"

      - name: Copy Hanzi Atelier into io/out
        run: |
          mkdir -p "web/io/out/corpan/packs/hanzipan"
          cp corpan/packs/hanzipan/manifest.json "web/io/out/corpan/packs/hanzipan/"
          cp -R corpan/packs/hanzipan/dist "web/io/out/corpan/packs/hanzipan/"
          cp -R corpan/packs/hanzipan/data "web/io/out/corpan/packs/hanzipan/"
          cp corpan/packs/hanzipan/hanzipan.zip "web/io/out/corpan/packs/hanzipan.zip"

      - name: Copy Juice Squeeze into io/out
        run: |
          mkdir -p "web/io/out/corpan/packs/juice-squeeze"
          cp corpan/packs/juice-squeeze/manifest.json "web/io/out/corpan/packs/juice-squeeze/"
          cp -R corpan/packs/juice-squeeze/dist "web/io/out/corpan/packs/juice-squeeze/"
          cp corpan/packs/juice-squeeze/juice-squeeze.zip "web/io/out/corpan/packs/juice-squeeze.zip"

      - name: Copy Stargate Reader into io/out
        run: |
          mkdir -p "web/io/out/corpan/packs/stargate-reader"
          cp corpan/packs/stargate-reader/manifest.json "web/io/out/corpan/packs/stargate-reader/"
          cp -R corpan/packs/stargate-reader/dist "web/io/out/corpan/packs/stargate-reader/"
          cp -R corpan/packs/stargate-reader/data "web/io/out/corpan/packs/stargate-reader/"
          cp corpan/packs/stargate-reader/stargate-reader.zip "web/io/out/corpan/packs/stargate-reader.zip"

      - name: Show Final Structure
        run: |
          echo "Final site structure:"
          find web/io/out -type f | sort

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/io/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
