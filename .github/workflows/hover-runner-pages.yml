name: Deploy Encorpora to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "io/**"
      - "corpan/games/**"
      - "pages/**"
      - ".github/workflows/hover-runner-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ENCORPORA_BASE_PATH: /encorpora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install io/ Dependencies
        working-directory: io
        run: npm install

      - name: Build io/ Site (Root)
        working-directory: io
        run: npm run build

      - name: Build Corpan Pages into io/out
        run: |
          node pages/build.js io/out

      - name: Install Hover Runner Dependencies
        working-directory: corpan/games/hover-runner
        run: npm install --legacy-peer-deps

      - name: Build Hover Runner
        working-directory: corpan/games/hover-runner
        run: npm run build

      - name: Copy Hover Runner into io/out
        run: |
          OUTPUT_ROOT="io/out${ENCORPORA_BASE_PATH}"
          mkdir -p "$OUTPUT_ROOT/corpan/games/hover-runner"
          cp corpan/games/hover-runner/manifest.json "$OUTPUT_ROOT/corpan/games/hover-runner/"
          cp -R corpan/games/hover-runner/dist/. "$OUTPUT_ROOT/corpan/games/hover-runner/"

      - name: Show Final Structure
        run: |
          echo "Final site structure:"
          find io/out -type f | sort

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: io/out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
