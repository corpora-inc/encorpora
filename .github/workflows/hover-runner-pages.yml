name: Deploy Encorpora to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "corpan/games/**"
      - "pages/**"
      - ".github/workflows/hover-runner-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Landing Pages
        run: |
          node pages/build.js .pages-temp

      - name: Install Hover Runner Dependencies
        working-directory: corpan/games/hover-runner
        run: npm install --legacy-peer-deps

      - name: Build Hover Runner
        working-directory: corpan/games/hover-runner
        run: npm run build

      - name: Assemble Pages Artifact
        run: |
          # Create the final directory structure
          mkdir -p .pages/corpan/games/hover-runner

          # Copy landing pages
          cp -R .pages-temp/* .pages/

          # Copy hover-runner game files
          cp corpan/games/hover-runner/manifest.json .pages/corpan/games/hover-runner/
          cp -R corpan/games/hover-runner/dist/. .pages/corpan/games/hover-runner/

          # Clean up temp directory
          rm -rf .pages-temp

          # Show the final structure for debugging
          echo "Final site structure:"
          find .pages -type f | sort

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
