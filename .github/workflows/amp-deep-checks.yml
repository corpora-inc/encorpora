name: AMP deep checks

# Independent feedback, never a release prerequisite or required PR context.
on:
  push:
    branches: [main]
    paths:
      - 'amp/**'
      - '.github/workflows/amp-deep-checks.yml'
      - '.github/scripts/amp_inventory_paths.py'
      - '.github/scripts/amp_ci_plan.py'
      - '.github/scripts/test_amp_ci_plan.py'
      - '.github/scripts/verify_amp_ui_sweep.py'
      - '.github/scripts/test_amp_ui_sweep.py'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: amp-deep-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --use-openssl-ca

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.paths.outputs.amp_browser }}
      content: ${{ steps.paths.outputs.amp_content }}
      native: ${{ steps.paths.outputs.amp_mobile }}
      amp_plan: ${{ steps.paths.outputs.amp_plan }}
      content_force: ${{ steps.paths.outputs.amp_content_force }}
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 .github/scripts/amp_ci_plan.py --full --github </dev/null >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only "$BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/amp-paths"
            python3 .github/scripts/amp_ci_plan.py --github < "$RUNNER_TEMP/amp-paths" >> "$GITHUB_OUTPUT"
          fi

  amp-browser:
    name: amp-browser (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.amp_plan).browser && fromJSON('["ui-1", "ui-2a", "ui-2b", "family", "contrast-light-390", "contrast-light-1280", "contrast-dark-390", "contrast-dark-1280"]') || fromJSON('["selected"]') }}
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: amp
    env:
      AMP_TEST_DATABASE_URL: postgres://amp:amp@127.0.0.1:5432/amp_test
      # Measure layout in the font Android learners get, not DejaVu Sans:
      # see amp/scripts/ci-fonts.conf. verify-ui asserts the prompt uses it.
      FONTCONFIG_FILE: ${{ github.workspace }}/amp/scripts/ci-fonts.conf
      AMP_EXPECT_UI_FONT: Roboto
      AMP_CI_PLAN: ${{ needs.changes.outputs.amp_plan }}
      AMP_UI_SKIP_TEMPLATE_SWEEP: "1"
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - name: Start PostgreSQL after trust verification
        id: ci-postgres
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=amp --env POSTGRES_PASSWORD=amp --env POSTGRES_DB=amp_test \
            --health-cmd 'pg_isready -U amp' --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24)
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          printf 'container_id=%s\n' "$container_id" >> "$GITHUB_OUTPUT"
          for attempt in {1..20}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            printf 'PostgreSQL health check %s: %s\n' "$attempt" "$health"
            if [ "$health" = healthy ]; then exit 0; fi
            if [ "$health" = unhealthy ]; then break; fi
            sleep 5
          done
          echo 'PostgreSQL failed its bounded health check' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit && npx playwright install-deps chromium && node scripts/install-browser.mjs --configure-linux-sandbox
      # test:payment-ui and the print suites inspect PDFs with pdfinfo.
      - name: Install PDF inspection tools and the Android UI font
        run: sudo apt-get install -y poppler-utils fonts-roboto && fc-match system-ui && fc-match sans-serif
      - name: Selected browser entrypoints
        if: matrix.lane == 'selected'
        run: node scripts/run-ci-tests.mjs browser
      - if: matrix.lane == 'ui-1'
        run: npm run test:ui:1
      - if: matrix.lane == 'ui-2a'
        run: npm run test:ui:2a
      - if: matrix.lane == 'ui-2b'
        run: npm run test:ui:2b
      - if: matrix.lane == 'family'
        run: npm run test:family-ui
      # Zero contrast violations: every route and state, light and dark, 390 and 1280.
      - if: startsWith(matrix.lane, 'contrast-')
        env:
          AMP_CONTRAST_LANE: ${{ matrix.lane }}
        run: |
          pair="${AMP_CONTRAST_LANE#contrast-}"
          npm run test:contrast -- "--only=${pair/-/:}"
      - name: Preserve the contrast sweep report
        if: always() && (startsWith(matrix.lane, 'contrast-') || matrix.lane == 'selected')
        uses: actions/upload-artifact@v4
        with:
          name: amp-contrast-${{ matrix.lane }}-${{ github.run_attempt }}
          path: amp/artifacts/contrast/
          if-no-files-found: ignore
          retention-days: 7
      - uses: dtolnay/rust-toolchain@1.93.0
        if: needs.changes.outputs.native == 'true' && (matrix.lane == 'ui-1' || matrix.lane == 'selected')
      - run: npm run test:native-session
        if: needs.changes.outputs.native == 'true' && (matrix.lane == 'ui-1' || matrix.lane == 'selected')
      - name: Remove this job's PostgreSQL container
        if: ${{ always() && steps.ci-postgres.outputs.container_id != '' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ steps.ci-postgres.outputs.container_id }}
        run: |
          set -euo pipefail
          [[ "$CI_POSTGRES_CONTAINER_ID" =~ ^[0-9a-f]{64}$ ]]
          docker rm --force --volumes "$CI_POSTGRES_CONTAINER_ID"

  amp-ui-sweep:
    name: amp-ui-sweep (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' && (fromJSON(needs.changes.outputs.amp_plan).browser || contains(fromJSON(needs.changes.outputs.amp_plan).browser_scripts, 'scripts/verify-ui.ts')) }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: amp
    env:
      AMP_TEST_DATABASE_URL: postgres://amp:amp@127.0.0.1:5432/amp_test
      # Measure layout in the font Android learners get, not DejaVu Sans:
      # see amp/scripts/ci-fonts.conf. verify-ui asserts the prompt uses it.
      FONTCONFIG_FILE: ${{ github.workspace }}/amp/scripts/ci-fonts.conf
      AMP_EXPECT_UI_FONT: Roboto
      AMP_UI_SHARD_INDEX: ${{ matrix.shard }}
      AMP_UI_SHARD_COUNT: 8
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - name: Start PostgreSQL after trust verification
        id: ci-postgres
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=amp --env POSTGRES_PASSWORD=amp --env POSTGRES_DB=amp_test \
            --health-cmd 'pg_isready -U amp' --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24)
          [[ "$container_id" =~ ^[0-9a-f]{64}$ ]]
          printf 'container_id=%s\n' "$container_id" >> "$GITHUB_OUTPUT"
          for attempt in {1..20}; do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            printf 'PostgreSQL health check %s: %s\n' "$attempt" "$health"
            if [ "$health" = healthy ]; then exit 0; fi
            if [ "$health" = unhealthy ]; then break; fi
            sleep 5
          done
          echo 'PostgreSQL failed its bounded health check' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amp/package-lock.json
      - run: npm ci
      - run: npx playwright install-deps chromium && node scripts/install-browser.mjs --configure-linux-sandbox
      # test:payment-ui and the print suites inspect PDFs with pdfinfo.
      - name: Install PDF inspection tools and the Android UI font
        run: sudo apt-get install -y poppler-utils fonts-roboto && fc-match system-ui && fc-match sans-serif
      - name: Verify template partition and shared browser journeys
        run: node --import tsx scripts/verify-ui.ts
      - name: Preserve completed template partition
        uses: actions/upload-artifact@v4
        with:
          name: amp-ui-sweep-${{ matrix.shard }}
          # A failed-job rerun reuses successful shards from the same run/SHA.
          overwrite: true
          path: amp/artifacts/ui-sweep/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic UI failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: amp-ui-failure-${{ matrix.shard }}-${{ github.run_attempt }}
          path: amp/artifacts/ui-failure/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove this job's PostgreSQL container
        if: ${{ always() && steps.ci-postgres.outputs.container_id != '' }}
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ steps.ci-postgres.outputs.container_id }}
        run: |
          set -euo pipefail
          [[ "$CI_POSTGRES_CONTAINER_ID" =~ ^[0-9a-f]{64}$ ]]
          docker rm --force --volumes "$CI_POSTGRES_CONTAINER_ID"

  amp-ui-coverage:
    needs: amp-ui-sweep
    if: ${{ needs.amp-ui-sweep.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: amp-ui-sweep-*
          path: ${{ runner.temp }}/amp-ui-sweep
          merge-multiple: true
      - name: Verify complete disjoint template coverage
        env:
          AMP_SWEEP_RECEIPTS: ${{ runner.temp }}/amp-ui-sweep
        run: python3 .github/scripts/verify_amp_ui_sweep.py "$AMP_SWEEP_RECEIPTS" --shards 8

  amp-content-checks:
    name: amp-content (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [publications, inventory]
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: amp
    env:
      CONTENT_LANE: ${{ matrix.lane }}
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: amp/package-lock.json
      - name: Fingerprint content inputs and runner
        id: content-key
        run: |
          inputs=$(python3 ../.github/scripts/amp_inventory_paths.py --fingerprint)
          environment=$(printf '%s\n' "$ImageOS" "$ImageVersion" "$(node --version)" "$(python3 --version)" | sha256sum | cut -d ' ' -f1)
          echo "key=amp-content-success-v2-${CONTENT_LANE}-${inputs}-${environment}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: content-cache
        if: github.event_name == 'push' && needs.changes.outputs.content_force != 'true'
        with:
          path: amp/artifacts/content-check-${{ matrix.lane }}-success.txt
          key: ${{ steps.content-key.outputs.key }}
      - name: Verify reusable result
        id: reuse
        env:
          EXACT_HIT: ${{ steps.content-cache.outputs.cache-hit }}
          EXPECTED: ${{ steps.content-key.outputs.key }}
        run: |
          reuse=false
          if [ "$EXACT_HIT" = true ] && [ -f "artifacts/content-check-${CONTENT_LANE}-success.txt" ] && [ "$(cat "artifacts/content-check-${CONTENT_LANE}-success.txt")" = "$EXPECTED" ]; then
            reuse=true
          fi
          echo "verified=$reuse" >> "$GITHUB_OUTPUT"
          echo "Content checks: exact successful input/environment reuse=$reuse" >> "$GITHUB_STEP_SUMMARY"
      # Remove an older success BEFORE forced/fresh validation. If invalidation
      # fails, stop before testing rather than leaving a newer failure reusable.
      - name: Invalidate earlier success before revalidation
        if: steps.reuse.outputs.verified != 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          CONTENT_CACHE_KEY: ${{ steps.content-key.outputs.key }}
        with:
          script: |
            try {
              await github.rest.actions.deleteActionsCacheByKey({
                ...context.repo,
                key: process.env.CONTENT_CACHE_KEY,
                ref: 'refs/heads/main',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Install PDF inspection tools
        if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - if: steps.reuse.outputs.verified != 'true'
        run: npm ci
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run audit
      # publications renders PDFs with Playwright's Chromium.
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npx playwright install-deps chromium && node scripts/install-browser.mjs --configure-linux-sandbox
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run publications
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run production:queue
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run review:math
      # The paired 900-learner placement simulation (about a minute).
      - if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run test:placement-sim
      - name: Complete-catalog regression sweeps
        if: matrix.lane == 'publications' && steps.reuse.outputs.verified != 'true'
        run: npm run test:content
      - name: Full independent inventory and corruption checks
        if: matrix.lane == 'inventory' && steps.reuse.outputs.verified != 'true'
        run: npm run test:inventory
      - name: Record successful content check
        if: success() && steps.reuse.outputs.verified != 'true'
        env:
          EXPECTED: ${{ steps.content-key.outputs.key }}
        run: |
          mkdir -p artifacts
          printf '%s\n' "$EXPECTED" > "artifacts/content-check-${CONTENT_LANE}-success.txt"
      - uses: actions/cache/save@v4
        if: success() && steps.reuse.outputs.verified != 'true' && github.ref == 'refs/heads/main'
        with:
          path: amp/artifacts/content-check-${{ matrix.lane }}-success.txt
          key: ${{ steps.content-key.outputs.key }}
      - name: Preserve synthetic book overflow screenshots
        if: failure() && matrix.lane == 'publications'
        uses: actions/upload-artifact@v4
        with:
          name: amp-book-overflow-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            amp/artifacts/book-reader/*/overflow-*.png
            amp/artifacts/progress-review/overflow-*.png
          if-no-files-found: ignore
          retention-days: 3

  amp-content:
    name: amp-content
    needs: [changes, amp-content-checks]
    if: ${{ always() && needs.changes.outputs.content == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - name: Require both content lanes
        env:
          CONTENT_RESULT: ${{ needs.amp-content-checks.result }}
        run: |
          if [ "$CONTENT_RESULT" != success ]; then
            echo "Both content lanes must succeed; aggregate result: $CONTENT_RESULT" >&2
            exit 1
          fi

  report:
    needs: [changes, amp-browser, amp-ui-sweep, amp-ui-coverage, amp-content]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Initialize verified client trust
        id: ci-trust
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I - <<'PY'
          import hashlib, os, pathlib, subprocess, sys, tempfile, urllib.request
          url = 'https://raw.githubusercontent.com/corpora-inc/encorpora/4aa31ea9b905faf587df857265b2160cd380c7fb/.github/scripts/ci_trust.py'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(url, timeout=30) as response:
              if response.url != url:
                  raise SystemExit('Unexpected CI trust helper redirect')
              source = response.read(50001)
          if hashlib.sha256(source).hexdigest() != '16923779dfbad6c110c5f78b668935df5976c89bbdc08a664be09c3dbee6a2ee':
              raise SystemExit('CI trust helper checksum mismatch')
          descriptor, name = tempfile.mkstemp(prefix='corpora-ci-bootstrap-', suffix='.py', dir=os.environ['RUNNER_TEMP'])
          try:
              with os.fdopen(descriptor, 'wb') as output:
                  output.write(source)
              subprocess.run([sys.executable, '-I', name, '--source-commit', '4aa31ea9b905faf587df857265b2160cd380c7fb'], check=True)
          finally:
              pathlib.Path(name).unlink()
          PY
      - name: Report deep-check failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'AMP deep checks failed';
            const body = `Deep validation failed for ${context.sha}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Investigate and fix forward; this workflow does not gate deployment.`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', labels: 'bug'});
            const issue = issues.find(i => !i.pull_request && i.title === title);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body, labels: ['bug']});
            core.setFailed('Deep validation failed; follow-up issue recorded.');
