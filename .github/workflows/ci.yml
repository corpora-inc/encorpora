name: CI

# Runs on EVERY PR to main and every merge_group (the merge queue), so the
# `ci-gate` summary status always reports. A required check that is filtered out
# at the workflow level would leave unrelated PRs "expecting" it forever and
# deadlock the queue. Path filtering instead lives in the `changes` job below,
# which skips the heavy build/test jobs when their area is untouched. The
# `changes` job is cheap (checkout + git diff), so running it on every PR is fine.

on:
  pull_request:
    branches: ["main"]
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      corpan_app: ${{ steps.filter.outputs.corpan_app }}
      dja: ${{ steps.filter.outputs.dja }}
      # `shared_ts` is declared ahead of the job that will consume it.
      # Nothing reads it yet, so it cannot affect any gate; declaring it here
      # keeps the follow-up PR a one-line `if:`. Every other output below is
      # consumed by a job in this file.
      dynawalla_android_gen: ${{ steps.filter.outputs.dynawalla_android_gen }}
      dynawalla_app: ${{ steps.filter.outputs.dynawalla_app }}
      dynawalla_curriculum: ${{ steps.filter.outputs.dynawalla_curriculum }}
      dynawalla_engine: ${{ steps.filter.outputs.dynawalla_engine }}
      lambda: ${{ steps.filter.outputs.lambda }}
      native: ${{ steps.filter.outputs.native }}
      packs: ${{ steps.filter.outputs.packs }}
      shared_ts: ${{ steps.filter.outputs.shared_ts }}
      terraform: ${{ steps.filter.outputs.terraform }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect changed areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi

          changed="$(mktemp)"
          if [ -n "${base}" ]; then
            git diff --name-only "${base}" "${head}" > "${changed}"
          else
            git diff-tree --no-commit-id --name-only -r "${head}" > "${changed}"
          fi

          echo "Changed files:"
          sed 's/^/  /' "${changed}"

          run_all=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            run_all=true
          fi

          set_output() {
            local name="$1"
            local pattern="$2"
            if [ "${run_all}" = "true" ] || grep -Eq "${pattern}" "${changed}"; then
              echo "${name}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          # The gate's own code. `.github/scripts/**` holds the adversarial
          # reviewer, whose failure mode when it regresses is to PASS wrongly —
          # so its tests must run on any change to it (or to this workflow, or
          # to the workflow that invokes it).
          set_output ci_scripts '^(\.github/scripts/|\.github/workflows/(ci|adversarial-review)\.yml$)'
          # `corpan/packs/shared/` and `corpan/packs/sdk/` are in here because the
          # corpan-app job COMPILES them: `tsconfig.json` maps `@shared/*` onto
          # `../packs/shared/*` and `include`s `../packs/shared/analytics`, vite
          # aliases the same tree, twenty source files import it, the job runs
          # `npm ci` in `packs/shared/capabilities`, and its contract-sync step
          # diffs the generated copies under `packs/sdk/` and
          # `packs/shared/capabilities/`.
          #
          # The `packs` filter does NOT stand in for this. `changed-packs` derives
          # a pack name from the path and skips any directory with no
          # `package.json`: `corpan/packs/shared` has none, so it is skipped
          # outright, and `corpan/packs/sdk`'s declares no test/tsc/build script.
          # Before this line a shared-only change ran nothing that compiled it.
          set_output corpan_app '^(corpan/(corpan-app|packs/(shared|sdk))/|\.github/workflows/ci\.yml$)'
          set_output dja '^(corpan/dja/|\.github/workflows/ci\.yml$)'
          set_output lambda '^(corpan/infra/terraform/lambda/|\.github/workflows/ci\.yml$)'
          # `pack_catalog_check.js` is the entire body of the `pack-catalog` job.
          # It lives under `.github/scripts/`, but `ci-scripts` runs pytest there
          # and collects no JavaScript — so without this alternation the checker
          # could be edited and never executed, and a break in it would surface on
          # some later, unrelated packs/web PR. Same treatment the `native` filter
          # below gives its two Python helpers.
          set_output packs '^(corpan/packs/|\.github/workflows/(ci|deploy-pages)\.yml$|\.github/scripts/pack_catalog_check\.js$)'
          set_output terraform '^(corpan/infra/terraform/.*(\.tf|\.tfvars|\.tf\.json)$|corpan/infra/terraform/\.terraform\.lock\.hcl$|\.github/workflows/ci\.yml$)'
          set_output web '^(web/(io|data|pages|scripts)/|\.github/workflows/(ci|deploy-pages)\.yml$)'

          # Dynawalla areas. Every one of them is consumed by a job below.
          #
          # `dynawalla/curriculum/` AND `dynawalla/engine/` are in the app filter
          # because the app compiles both: the practice loop imports each
          # package's TypeScript source directly (they are private, have no build
          # step and no resolvable name — see `src/work/curriculum.ts` and the
          # `../../../engine/src/index.ts` imports across `src/work/`). A change to
          # either can turn the app's tsc, tests or build red, and without this the
          # app job would not run on the PR that did it.
          set_output dynawalla_app '^(dynawalla/(dynawalla-app|curriculum|engine)/|\.github/workflows/ci\.yml$)'
          # The committed slice of gen/android and the recorded template it was
          # curated from. `tauri android init` never overwrites an existing
          # file, which is what makes the allowlist survive a CI re-init — and
          # is also why a @tauri-apps/cli bump that adds a required manifest
          # entry would be dropped SILENTLY, at runtime, with nothing in CI
          # compiling Android for either app. So: any move of the CLI pin, of
          # the tracked files, or of the baseline re-runs the drift job.
          set_output dynawalla_android_gen '^(dynawalla/dynawalla-app/(package(-lock)?\.json$|android-template-baseline/|src-tauri/gen/android/)|\.github/workflows/ci\.yml$)'
          # `dynawalla/engine/` is in the curriculum filter because the curriculum
          # gates SCAN engine source: `validate/cli.ts` passes
          # `[curriculum/src, engine/src]` as the lint roots, so `npm run check`
          # (M-05, CG-19, CG-16) and `validate/gates.test.ts` under `npm test` both
          # read it. The engine's own `boundary.test.ts` deliberately duplicates
          # EG-1 and M-05, but there is no CG-19 equivalent in it — so a
          # bare-string prompt added under `engine/src` failed the curriculum job
          # while the engine job stayed green, on a PR that ran neither.
          set_output dynawalla_curriculum '^(dynawalla/(curriculum|engine)/|\.github/workflows/ci\.yml$)'
          # Not the mirror image: the engine imports nothing at all (EG-1 asserts
          # exactly that), so a curriculum change cannot break the engine job.
          # `boundary.test.ts` duplicates the float scan for this reason — "the two
          # packages have independent CI filters, and an engine-only pull request
          # must be able to fail this on its own."
          set_output dynawalla_engine '^(dynawalla/engine/|\.github/workflows/ci\.yml$)'
          # Cross-product area. Deliberately no `ci.yml` self-trigger: it exists
          # to answer "did shared code move", and a workflow edit is not a
          # change to it. No job consumes it yet.
          set_output shared_ts '^(shared/|corpan/packs/shared/)'
          # The Rust/native layer: both apps' `src-tauri` trees and every Tauri
          # plugin crate. Consumed by the `native` job below, so — unlike
          # `shared_ts` above and unlike this filter before that job existed —
          # it DOES self-trigger on `ci.yml`, exactly like every other filter
          # that drives a job. A workflow edit that breaks the native gate has
          # to be caught by the native gate.
          set_output native '^(native/|.*/src-tauri/|corpan/plugins/|\.github/workflows/ci\.yml$|\.github/scripts/(patch_integrity|clippy_report)\.py$)'

      # Coverage warning. WARN-ONLY, and permanently scoped to `pull_request`.
      #
      # Do NOT extend this to merge_group. The `changes` job resolves its range
      # as merge_group.base_sha..head_sha, which spans the WHOLE batch the queue
      # assembled — so a fail-closed hygiene check here would attribute one PR's
      # uncovered path to every PR batched with it and eject them all at once.
      # On a pull_request the range is exactly that PR's own change, which is
      # the only range where "this path has no CI area" is a true statement
      # about the author's diff.
      #
      # Belt and braces so this can never flip a gate: an explicit `set +e`, an
      # explicit `exit 0`, and `continue-on-error: true`. The `set +e` is load
      # bearing — Actions runs a `run:` block as `bash -e {0}` on Linux, so
      # errexit is ON by default and `set -uo pipefail` does not turn it off.
      - id: uncovered
        name: Warn on paths with no CI area
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          set +e   # Actions invokes this as `bash -e {0}`; drop errexit.

          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit resolved; skipping coverage warning."
            exit 0
          fi

          # Areas a job actually consumes today, minus the `ci.yml` self-triggers
          # (a workflow edit is exempt below anyway). NOT the union of every
          # filter above: `shared_ts` is declared ahead of its job, so paths it
          # matches are genuinely ungated and must keep warning until that job
          # lands. `dynawalla/dynawalla-app/`, `dynawalla/curriculum/`,
          # `dynawalla/engine/` and now `native` have each graduated, as the
          # jobs below consume their filters.
          #
          # The terraform member is copied verbatim from the `terraform` filter —
          # extension-scoped, not the bare directory. A bare `corpan/infra/
          # terraform/` would mark helper scripts under it as covered when no job
          # runs them.
          #
          # `corpan/plugins/` is now compiled by the `native` job below, which
          # reports into the required `ci-gate` (every plugin is a path
          # dependency of Corpán's src-tauri, so a host `cargo clippy` of the
          # app compiles all of them). `.github/workflows/ios-native.yml`
          # additionally compiles their Swift, but it is advisory and does not
          # count here.
          covered='^(corpan/corpan-app/|corpan/dja/|corpan/infra/terraform/lambda/|corpan/packs/|corpan/infra/terraform/.*(\.tf|\.tfvars|\.tf\.json)$|corpan/infra/terraform/\.terraform\.lock\.hcl$|web/(io|data|pages|scripts)/|corpan/plugins/|dynawalla/dynawalla-app/|dynawalla/(curriculum|engine)/)'

          # Carve-outs checked BEFORE `covered`, because a broader area prefix
          # would otherwise swallow them. grep -E has no negative lookahead,
          # hence a separate pattern rather than an exclusion inside `covered`.
          #
          # The `native` job compiles exactly two src-tauri trees: Corpán's and
          # Dynawalla's. The four listed below are NOT compiled by any job.
          # `corpus-reader` and `panko` are dormant (last touched by a repo-wide
          # sweep in June); `panko` also resolves a plugin from a git BRANCH and
          # `homeschool-offline` tracks no Cargo.lock at all; the iap example is
          # a demo, not shipped.
          #
          # The rustfmt ratchet in `native` WALKS all four, but walking is not
          # gating: `corpus-reader/src-tauri` and both `homeschool-offline`
          # crates are on its DEBT list, so their diffs are reported as
          # warnings and cannot fail the job. `panko/pako/src-tauri` and the
          # iap example are off the list and therefore enforced. This warning
          # is about COMPILE coverage specifically.
          ungated='^(corpus-reader/src-tauri/|panko/pako/src-tauri/|homeschool-offline/app/src-tauri/|corpan/plugins/tauri-plugin-iap/examples/)'

          # Gate-free by design: CI config, agent control plane, docs, dotfiles.
          exempt='(^\.github/|^\.claude/|^\.gitignore$|^\.gitattributes$|^LICENSE$|\.md$)'

          n=0
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            if printf '%s\n' "${p}" | grep -Eq "${ungated}"; then
              echo "::warning::path ${p} has no CI area"
              n=$((n + 1))
              continue
            fi
            printf '%s\n' "${p}" | grep -Eq "${covered}" && continue
            printf '%s\n' "${p}" | grep -Eq "${exempt}" && continue
            echo "::warning::path ${p} has no CI area"
            n=$((n + 1))
          done <<< "$(git diff --name-only "${base}" "${head}" || true)"

          echo "${n} changed path(s) with no CI area."
          exit 0

  corpan-app:
    name: corpan-app · tsc + build
    needs: changes
    if: needs.changes.outputs.corpan_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: corpan/corpan-app/package-lock.json
      - name: Install
        working-directory: corpan/corpan-app
        run: npm ci
      # The corpan-app test/build graph imports @shared/capabilities (the
      # journey capability modules), which is its own npm workspace — without
      # its node_modules the app's tests fail on unresolved imports (the
      # integration two-failure lesson).
      - name: Install capabilities workspace
        working-directory: corpan/packs/shared/capabilities
        run: npm ci
      # Journey activity-contract drift gate: every generated copy of
      # activityContract.ts must match the authoritative corpan-app source.
      - name: Contract sync check
        run: node corpan/packs/sdk/sync-contract.mjs --check
      - name: Test
        working-directory: corpan/corpan-app
        run: npm test
      - name: Typecheck
        working-directory: corpan/corpan-app
        run: npm run tsc
      - name: Build
        working-directory: corpan/corpan-app
        run: npm run build

  # Django content-generation tests (corpan/dja). The shipped SQLite content
  # bundle is built from this code; a regression here (e.g. the #486 silent
  # translation-corruption bug) would otherwise ship unnoticed. The two test
  # modules under cor/utils are plain-pytest and stub out Django + corpora_ai
  # in sys.modules, so the only runtime deps are pytest + pydantic — no Django
  # install, no DB, no API access. Fast (<1s) and self-contained, so it cannot
  # jam the merge queue. Skips cleanly when no corpan/dja/** files changed,
  # exactly like the sibling area jobs; ci-gate treats a skip as a pass.
  dja:
    name: dja · tests
    needs: changes
    if: needs.changes.outputs.dja == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4" "pydantic==2.12.5"
      - name: Run dja tests
        working-directory: corpan/dja
        # Scope to cor/utils: the plain-pytest modules live here and stub their
        # Django/corpora_ai deps. This auto-collects future test_*.py added in
        # this dir, while NOT collecting cor/tests.py (a Django TestCase
        # placeholder that would need a full Django install + DB) — keeping the
        # gate fast and unable to jam the queue.
        run: python -m pytest cor/utils -q

  # Unit tests for the adversarial-review gate (.github/scripts). That script is
  # a required status check whose regression mode is to pass wrongly, which no
  # other job can detect — these assertions are the only signal. stdlib + pytest
  # only (the script itself has no third-party deps), so it is fast and cannot
  # jam the merge queue. Needs fetch-depth: 0 — the range tests build a real
  # throwaway repo, but `git` must be usable from the checkout.
  ci-scripts:
    name: ci-scripts · tests
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4"
      - name: Run CI script tests
        run: python -m pytest .github/scripts -q

  # Dynawalla's app shell. Node-only, exactly like `corpan-app`: lint, the
  # native test runner, tsc and a production vite build. It does NOT compile
  # the Rust under dynawalla/dynawalla-app/src-tauri — the `native` job below
  # does, with `cargo clippy --locked --all-targets`, so `src-tauri/` paths no
  # longer fall through to the `uncovered` warning above. Keep this job npm-only.
  #
  # Path-gated, and therefore NOT a required status context: it reports into
  # `ci-gate` below. A required context that never reports on unrelated PRs
  # blocks the merge queue forever.
  dynawalla-app:
    name: dynawalla-app · lint + tsc + test + build
    needs: changes
    if: needs.changes.outputs.dynawalla_app == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the app icon (Git LFS)
        # `*.png` is Git LFS repo-wide, so a plain checkout leaves a pointer
        # file where the icon should be. `lfs: true` would pull every sqlite3,
        # epub and pdf in the monorepo for the sake of 10 kB, so this fetches
        # the one path that is read twice: `capabilities.test.ts` asserts the
        # icon's PNG colour type, and the `native` job's tauri-codegen build
        # decodes the same file. tauri-codegen panics on anything but RGBA,
        # minutes into the cargo build — this test catches it in seconds.
        run: git lfs pull --include="dynawalla/dynawalla-app/src-tauri/icons/*"
      - uses: actions/setup-node@v4
        with:
          # Matches dynawalla/dynawalla-app/.nvmrc and the `engines` floor.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dynawalla/dynawalla-app/package-lock.json
      - name: Install
        working-directory: dynawalla/dynawalla-app
        run: npm ci
      - name: Lint
        working-directory: dynawalla/dynawalla-app
        run: npm run lint
      - name: Test
        working-directory: dynawalla/dynawalla-app
        run: npm test
      - name: Typecheck
        working-directory: dynawalla/dynawalla-app
        run: npm run tsc
      - name: Build
        working-directory: dynawalla/dynawalla-app
        run: npm run build

  # Drift gate for the committed slice of `src-tauri/gen/android`.
  #
  # Three generated files are tracked (Tauri gives Android no
  # `bundle.android.template` hook, so a build decision has nowhere else to
  # live), and `tauri android init` does NOT overwrite an existing file. That
  # is exactly what makes the allowlist survive a CI re-init — and exactly why
  # a `@tauri-apps/cli` bump that adds a required manifest entry or a required
  # Gradle block would be dropped SILENTLY and only surface at runtime on a
  # device. Nothing else in this workflow compiles Android for either app.
  #
  # So: regenerate the template into a scratch tree with no committed files
  # present, and diff it against the baseline recorded at the CLI version the
  # tracked files were curated from. The job is deliberately cheap — see the
  # NDK note in the regenerate step; local wall clock for `tauri android init`
  # this way is ~1.5 s.
  dynawalla-android-gen:
    name: dynawalla · gen/android template drift
    needs: changes
    if: needs.changes.outputs.dynawalla_android_gen == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dynawalla/dynawalla-app/package-lock.json
      - name: Install
        working-directory: dynawalla/dynawalla-app
        run: npm ci
      - name: Regenerate the Android project from the Tauri template
        working-directory: dynawalla/dynawalla-app
        run: |
          set -euo pipefail
          # `tauri android init` refuses to run without an SDK root and an NDK,
          # but for `init` it only READS the NDK's source.properties to learn a
          # version string — it compiles nothing. Verified locally: a directory
          # containing source.properties alone is accepted, and the three files
          # it generates are byte-identical to those produced against the real
          # NDK 28.2.13676358. That keeps this gate at a few seconds and off
          # the 700 MB sdkmanager download. If a future CLI genuinely needs a
          # real NDK it will fail loudly here, which is the correct outcome.
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export NDK_HOME="$RUNNER_TEMP/android-ndk"
          mkdir -p "$ANDROID_HOME/platforms" "$NDK_HOME"
          printf 'Pkg.Desc = Android NDK\nPkg.Revision = 28.2.13676358\n' \
            > "$NDK_HOME/source.properties"
          rm -rf src-tauri/gen/android
          npx tauri android init --ci
      - name: Diff the template against the recorded baseline
        working-directory: dynawalla/dynawalla-app
        run: |
          set -euo pipefail
          BASE=android-template-baseline
          GEN=src-tauri/gen/android/app

          RECORDED=$(cat "$BASE/tauri-cli-version.txt")
          ACTUAL=$(node -p "require('@tauri-apps/cli/package.json').version")
          echo "@tauri-apps/cli recorded=$RECORDED installed=$ACTUAL"

          drift=0
          check() {
            if diff -u "$BASE/$1" "$GEN/$2"; then
              echo "  $1: unchanged"
            else
              echo "::error::the Tauri Android template moved for $1"
              drift=1
            fi
          }
          check build.gradle.kts build.gradle.kts
          check AndroidManifest.xml src/main/AndroidManifest.xml
          check MainActivity.kt src/main/java/inc/corpora/dynawalla/MainActivity.kt

          if [ "$drift" -ne 0 ]; then
            {
              echo "The generated Android project no longer matches"
              echo "$BASE, which was recorded at @tauri-apps/cli $RECORDED"
              echo "(installed here: $ACTUAL)."
              echo
              echo "This is NOT automatically a bug — it is the one moment the"
              echo "silently-stale committed files can be caught. Re-curate:"
              echo "  1. read the diff above; decide what the new template adds"
              echo "  2. fold the additions into the tracked files under"
              echo "     dynawalla/dynawalla-app/src-tauri/gen/android/"
              echo "  3. copy the newly generated files over $BASE/"
              echo "  4. write the new CLI version into $BASE/tauri-cli-version.txt"
            } >&2
            exit 1
          fi
          [ "$RECORDED" = "$ACTUAL" ] || {
            echo "::error::@tauri-apps/cli moved $RECORDED -> $ACTUAL but the template did not."
            echo "Re-record it: printf '%s\\n' \"$ACTUAL\" > $BASE/tauri-cli-version.txt" >&2
            exit 1
          }
          echo "gen/android is in sync with the @tauri-apps/cli $ACTUAL template."

  lambda:
    name: lambda · tests
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: corpan/infra/terraform/lambda/package-lock.json
      - name: Install
        working-directory: corpan/infra/terraform/lambda
        run: npm ci
      - name: Test
        working-directory: corpan/infra/terraform/lambda
        run: npm test

  web-io:
    name: web/io · build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/io/package-lock.json
      - name: Install
        working-directory: web/io
        run: npm ci
      - name: Build
        working-directory: web/io
        run: npm run build

  changed-packs:
    name: changed packs · test + build
    needs: changes
    if: needs.changes.outputs.packs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test, typecheck, validate manifest, build changed packs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          mapfile -t packs < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
              awk -F/ '/^corpan\/packs\/[^/]+\// { print $3 }' |
              sort -u
          )

          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed packs."
            exit 0
          fi

          for pack in "${packs[@]}"; do
            dir="corpan/packs/${pack}"
            if [ ! -f "${dir}/package.json" ]; then
              echo "Skipping ${pack}: no package.json."
              continue
            fi

            echo "::group::${pack}"

            # Manifest schema sanity: must be valid JSON with id + version.
            if [ -f "${dir}/manifest.json" ]; then
              node -e '
                const fs = require("fs");
                const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                for (const k of ["id", "version"]) {
                  if (!m[k]) { console.error(`manifest.json missing required key: ${k}`); process.exit(1); }
                }
                console.log(`manifest ok: ${m.id}@${m.version}`);
              ' "${dir}/manifest.json"
            else
              echo "Note: ${pack} has no manifest.json (source-only pack)."
            fi

            npm install --prefix "${dir}" --legacy-peer-deps

            # Run the pack's own test + typecheck when defined (back-compat gate).
            if node -e 'process.exit(require(process.argv[1]).scripts?.test ? 0 : 1)' "${dir}/package.json" 2>/dev/null; then
              npm run --prefix "${dir}" test
            else
              echo "No test script for ${pack}; skipping."
            fi
            npm run --prefix "${dir}" tsc --if-present
            npm run --prefix "${dir}" build --if-present
            echo "::endgroup::"
          done

  terraform:
    name: terraform · fmt + validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init (no backend)
        working-directory: corpan/infra/terraform
        run: terraform init -backend=false
      - name: Format check
        working-directory: corpan/infra/terraform
        run: terraform fmt -check -recursive
      - name: Validate
        working-directory: corpan/infra/terraform
        run: terraform validate

  # Pack catalog integrity: every catalog entry's id matches the installer's
  # zip-derived id (else "Pack id mismatch" on install) and every declared
  # avatarSource resolves to a real file (else the pack ships with no artwork).
  # Runs whenever packs OR the catalog (web/data) change. Cheap, no npm.
  pack-catalog:
    name: pack-catalog · integrity
    needs: changes
    if: needs.changes.outputs.packs == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate pack ids + artwork against the catalog
        run: node .github/scripts/pack_catalog_check.js

  # Dynawalla curriculum: the skill graph, the generator families, the mal-rules
  # and `dw-curriculum check`. Pure TypeScript with no DOM and no Tauri, so this is
  # npm ci plus Node's own test runner — no vitest, matching corpan-app. Node 24 is
  # what dynawalla's `engines` pins and what its `--experimental-strip-types` tests
  # are written against.
  #
  # Two runners, because CG-16 is a claim about two operating systems: generators
  # run in a WebView on iOS, Android and desktop, and output that is not
  # platform-stable makes every committed golden transcript and every bug report
  # irreproducible. Verifying the committed hashes on one runner would only prove
  # they match whichever machine happened to write them. `fail-fast: false` so a
  # divergence shows which side diverged. ci-gate takes the combined result of the
  # matrix, so this is still one entry in its `needs` and no new required context.
  dynawalla-curriculum:
    name: dynawalla-curriculum · tests + gates (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dynawalla_curriculum == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dynawalla/curriculum/package-lock.json
      - name: Install
        working-directory: dynawalla/curriculum
        run: npm ci
      - name: Test
        working-directory: dynawalla/curriculum
        run: npm test
      - name: Typecheck
        working-directory: dynawalla/curriculum
        run: npm run tsc
      - name: Curriculum gates
        working-directory: dynawalla/curriculum
        run: npm run check

  # Dynawalla learner model. Independent of the curriculum job on purpose: the two
  # packages do not import each other, so a curriculum edit must not rebuild the
  # engine or vice versa. The engine carries its own copy of the float and purity
  # scan (`src/boundary.test.ts`, gate EG-1) so an engine-only PR is fully covered
  # by this job alone.
  dynawalla-engine:
    name: dynawalla-engine · tests
    needs: changes
    if: needs.changes.outputs.dynawalla_engine == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dynawalla/engine/package-lock.json
      - name: Install
        working-directory: dynawalla/engine
        run: npm ci
      - name: Test
        working-directory: dynawalla/engine
        run: npm test
      - name: Typecheck
        working-directory: dynawalla/engine
        run: npm run tsc

  # ───────────────────────────────────────────────────────────────────────────
  # The Rust / native gate.
  #
  # Before this job, NOTHING required ran cargo, rustfmt, clippy or rustup —
  # every Rust change in both shipping apps merged uncompiled, and the first
  # signal was a release build at store-submission time. `ios-native.yml`
  # compiles plugin Swift but is advisory, has no `merge_group` trigger and
  # carries a top-level `paths:` filter (which is why it can never BE required:
  # it would not report on unrelated PRs and would deadlock the queue forever).
  #
  # This job is path-gated, so it is NOT a required status context either. It
  # reports into `ci-gate`, which is already required and always reports. That
  # is what makes this safe by construction: adding a `needs` entry to an
  # always-reporting aggregate adds coverage without adding a context branch
  # protection is waiting on, so the merge queue cannot deadlock on it.
  #
  # SCOPE — deliberately the host target only:
  #   * `cargo clippy` (not `cargo check`) because clippy IS a check plus lints:
  #     one compile, both signals. A compile error fails it; lint warnings are
  #     counted and reported but do NOT fail, so the first PR to touch Rust is
  #     not blocked by pre-existing debt. See the enforcement note below.
  #   * Corpán's src-tauri depends on all eleven plugin crates by path, so
  #     compiling it compiles every plugin. Clippy LINTS only the app crate
  #     (path deps outside the workspace dir do not get the clippy wrapper);
  #     the plugins are compile-checked, not linted.
  #   * `#[cfg(mobile)]` code (each plugin's `mobile.rs`, the Android JNI and
  #     crash-breadcrumb blocks in Corpán's lib.rs) is NOT compiled here — a
  #     linux host build takes the `desktop` cfg. iOS Rust+Swift is covered
  #     advisory-only by ios-native.yml; the Android Rust glue is covered by
  #     nothing. Closing that needs an NDK on the runner and is its own PR.
  native:
    name: native · fmt + compile + clippy
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Measured on ubuntu-latest: 7m18s stone cold, 4m09s on a full cache match.
    # 30 is headroom over the cold number on a slow runner while still catching
    # a hang, rather than burning 45 minutes of queue time before anyone
    # notices. See the cache step for where the warm time actually goes.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the app icons (Git LFS)
        # `*.png` is Git LFS repo-wide (.gitattributes:2), and Tauri's
        # `generate_context!` decodes the icon during compilation — a pointer
        # file panics tauri-codegen minutes into the build. Same targeted pull
        # as the dynawalla-app job; `lfs: true` on checkout would drag every
        # sqlite3/epub/pdf in the monorepo along for ~20 kB of PNG.
        run: |
          git lfs pull \
            --include="corpan/corpan-app/src-tauri/icons/*,dynawalla/dynawalla-app/src-tauri/icons/*"
      - name: Toolchain
        # The runner image ships rustup + stable with rustfmt and clippy. No
        # third-party toolchain action, no extra download on the happy path;
        # `component add` is a no-op when they are already present.
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: System libraries (Tauri + llama.cpp)
        # Tauri v2 on Linux links webkit2gtk/soup; llama-cpp-sys-2's build
        # script drives cmake and bindgen (libclang). `cargo clippy` runs build
        # scripts, so these are needed for a check-only build too.
        #
        # Retried because this job reports into the REQUIRED `ci-gate`, and in
        # the merge queue a red `ci-gate` ejects the entry under ALLGREEN. A
        # flaky apt mirror should cost 20 s, not a re-queue. Still fails closed:
        # `until` is exempt from errexit, and the function returns 1 after the
        # third attempt.
        run: |
          set -euo pipefail

          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "${n}" -ge 3 ]; then
                echo "::error::failed after ${n} attempts: $*"
                return 1
              fi
              echo "attempt ${n} failed, retrying in $((n * 5))s: $*"
              sleep "$((n * 5))"
            done
          }

          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            cmake \
            libclang-dev
      - name: Cache cargo registry + target dirs
        # SHA-pinned to the commit tag v2.9.1 dereferences to. Keyed
        # per-workspace; the two src-tauri trees are separate implicit
        # workspaces with separate lockfiles.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: |
            corpan/corpan-app/src-tauri
            dynawalla/dynawalla-app/src-tauri
          cache-all-crates: "true"
          #
          # MEASURED CEILING — read this before trying to speed the job up.
          #
          # Warm (full cache match) is ~4m15s of which ~156s is Corpán's
          # compile; stone cold is ~7m. The residual is NOT registry deps: on a
          # full match cargo still rebuilds every PATH-sourced crate — the
          # vendored llama-cpp-sys-2 fork (cmake + bindgen over llama.cpp,
          # the single biggest item), all eleven plugins, and the app crate.
          # rust-cache strips those from the target dir before saving.
          #
          # `cache-workspace-crates: true` was tried and measured: 156s against
          # 165s, inside the noise, because the plugins live OUTSIDE the
          # workspace root and are not "workspace crates" by that flag's
          # definition. It is deliberately not set. The real lever is a
          # compiler cache (sccache, which also fronts the C++ via
          # CMAKE_C_COMPILER_LAUNCHER); that is a separate PR with its own
          # correctness argument.
          #
          # Trap for whoever tries: rust-cache does NOT re-save on a full key
          # match, so a caching change alone appears to do nothing against an
          # existing cache. Bump `prefix-key` to force a rebuild while
          # measuring, and note that a PR-event cache is scoped to that PR —
          # only the `push: main` run populates a cache every PR can read.

      # ── rustfmt, as a ratchet ────────────────────────────────────────────
      #
      # Fourteen of the eighteen tracked crates carry pre-existing formatting
      # debt (see DEBT below), so a blanket `cargo fmt --check` would fail on
      # day one and get deleted. Instead: every crate NOT on the list is
      # enforced — including every crate added from here on, since the default
      # is "enforced" — and the listed ones are reported.
      #
      # The list is bidirectional on purpose. Formatting a debt crate without
      # removing it here FAILS, with the exact line to delete. That is what
      # keeps the ratchet from rusting open.
      - name: rustfmt (enforced outside the debt list)
        run: |
          set -euo pipefail

          # Pre-existing rustfmt debt. Measured identically under rustfmt 1.8.0
          # (Rust 1.93, a local checkout) and rustfmt 1.9.0-stable (rustc
          # 1.97.1, what the runner image shipped for this PR) — the toolchain
          # is deliberately unpinned, so the bar is "whatever stable rustfmt
          # ships". rustfmt guarantees output stability within a style edition
          # and `style_edition` defaults to the crate's `edition`, so the only
          # thing that can move this list without a code change is bumping a
          # crate's edition (these span 2021 and 2024). Remove a line the moment
          # its crate is formatted — CI tells you to.
          DEBT='corpan/corpan-app/src-tauri
          corpan/plugins/corpan-asr-contract
          corpan/plugins/tauri-plugin-asr-native
          corpan/plugins/tauri-plugin-audio-keepalive
          corpan/plugins/tauri-plugin-corpan-llm
          corpan/plugins/tauri-plugin-game-packs
          corpan/plugins/tauri-plugin-iap
          corpan/plugins/tauri-plugin-radio-stream
          corpan/plugins/tauri-plugin-stt
          corpan/plugins/tauri-plugin-subscriptions
          corpan/plugins/tauri-plugin-tts
          corpus-reader/src-tauri
          homeschool-offline/app/src-tauri
          homeschool-offline/app/src-tauri/plugins/tauri-plugin-ios-share'

          # Membership is tested with a here-string, never `printf | grep -q`:
          # `grep -q` exits on the first match, the producer takes SIGPIPE and
          # `pipefail` turns a successful lookup into status 141. That has
          # silently inverted a compliance check in this repo before.
          seen="$(mktemp)"
          trap 'rm -f "${seen}"' EXIT
          fail=0
          while IFS= read -r manifest; do
            # `vendor/` is a third-party fork carried verbatim; reformatting it
            # would fight every rebase against upstream.
            case "${manifest}" in */vendor/*) continue ;; esac
            crate="$(dirname "${manifest}")"

            if grep -Fxq -- "${crate}" <<< "${DEBT}"; then
              listed=true
              printf '%s\n' "${crate}" >> "${seen}"
            else
              listed=false
            fi

            if cargo fmt --manifest-path "${manifest}" --check > /dev/null 2>&1; then
              if [ "${listed}" = true ]; then
                echo "::error::${crate} is now rustfmt-clean — delete it from the DEBT list in .github/workflows/ci.yml so it stays that way."
                fail=1
              else
                echo "  ok    ${crate}"
              fi
              continue
            fi

            # `cargo fmt --check` exits 1 when it finds diffs, so the `|| true`
            # is load bearing: without it `errexit` kills this step on the
            # first debt crate, before a single line is printed.
            hunks="$(
              { cargo fmt --manifest-path "${manifest}" --check 2>/dev/null || true; } \
                | sed -n 's/^Diff in .*/x/p' | wc -l | tr -d ' '
            )"
            if [ "${listed}" = true ]; then
              echo "::warning::${crate} has ${hunks} rustfmt diff(s) (known debt)"
              echo "  debt  ${crate} (${hunks} diffs)"
            else
              echo "::error::${crate} is not rustfmt-clean. Run: cargo fmt --manifest-path ${manifest}"
              fail=1
            fi
          done < <(git ls-files '*Cargo.toml')

          # A DEBT entry for a crate that no longer exists rots silently.
          while IFS= read -r entry; do
            [ -n "${entry}" ] || continue
            if ! grep -Fxq -- "${entry}" "${seen}"; then
              echo "::error::DEBT lists ${entry}, which is not a tracked crate. Delete the line."
              fail=1
            fi
          done <<< "${DEBT}"

          exit "${fail}"

      # ── [patch.crates-io] integrity ──────────────────────────────────────
      #
      # A Cargo patch that stops matching can be SILENT: when the lock already
      # carries the `[[patch.unused]]` stanza, `cargo metadata --locked` exits
      # 0 and the stderr warning is the only signal, and the build compiles,
      # tests and clippies clean against the upstream crate. This repo has
      # already lost a vendored fix that way. (Against a CLEAN lock the same
      # patch exits 101 instead — the script treats both as failures.)
      # Cheap (~1 s measured, resolution only, no compilation), so it runs
      # before the long build and fails fast.
      - name: Cargo [patch] integrity
        run: python3 .github/scripts/patch_integrity.py

      # ── compile + lint ───────────────────────────────────────────────────
      #
      # `--locked` is load-bearing: it fails if the committed lock would have to
      # move, so CI compiles the versions that ship. It is possible for all four
      # tracked locks (`git ls-files '*Cargo.lock'` — corpan, corpus-reader,
      # dynawalla, panko). The two trees compiled here are the two that ship;
      # `corpus-reader` and `panko` are dormant and `homeschool-offline` tracks
      # no Cargo.lock at all. See the `ungated` list in the `changes` job.
      #
      # `--all-targets` also compiles test and bin targets. On a check-only
      # build nothing links, so the marginal cost is small and it is what
      # catches a broken `#[cfg(test)]` module before someone runs the tests.
      #
      # Clippy is a BUDGET, not warn-only: CLIPPY_BUDGET below is bidirectional
      # in the same shape as the rustfmt DEBT list. Over it fails, under it
      # fails and tells you to lower the number. A count that is printed and
      # discarded is a log line, not a gate — 16 would drift to 60 unnoticed.
      - name: Compile + clippy (host target)
        run: |
          set -euo pipefail

          # Neither app has a `dist/` in a fresh checkout — the frontends are
          # built by their own npm jobs, not here. tauri-codegen embeds
          # whatever is at `frontendDist`; an empty dir keeps this a pure Rust
          # gate instead of dragging two full npm builds into a compile check.
          mkdir -p corpan/corpan-app/dist dynawalla/dynawalla-app/dist

          echo "disk before: $(df -h / | sed -n '2p')"

          counts="${RUNNER_TEMP}/clippy-counts.txt"
          : > "${counts}"

          for app in corpan/corpan-app/src-tauri dynawalla/dynawalla-app/src-tauri; do
            echo "::group::${app} · cargo clippy --locked --all-targets"
            started="${SECONDS}"
            # stdout is the JSON diagnostic stream (rendered + de-duplicated by
            # the reporter); stderr stays on the job log for cargo's progress
            # and its final "could not compile" summary. `pipefail` carries
            # cargo's exit code, so a COMPILE ERROR fails this step while lint
            # warnings do not — the reporter always exits 0.
            cargo clippy --locked --all-targets \
              --manifest-path "${app}/Cargo.toml" \
              --message-format=json \
              | python3 .github/scripts/clippy_report.py \
                  --label "${app}" --count-file "${counts}"
            echo "${app}: compiled + linted in $(( SECONDS - started ))s"
            echo "::endgroup::"
          done

          echo "disk after: $(df -h / | sed -n '2p')"

          # Pre-existing clippy debt across both shipping apps, measured on this
          # branch: 16 in corpan/corpan-app/src-tauri, 0 in dynawalla's. Every
          # warning is rendered in the groups above, so a rise names itself.
          #
          # Bidirectional, like the rustfmt DEBT list: fixing warnings without
          # lowering this FAILS, with the number to write. That is what turns
          # the eventual `-- -D warnings` into a countdown rather than one
          # heroic PR, and what stops the ratchet rusting open.
          CLIPPY_BUDGET=16

          total="$(awk '{ s += $1 } END { print s + 0 }' "${counts}")"
          {
            echo "### native gate"
            echo
            echo "Unique clippy warnings: **${total}** (budget ${CLIPPY_BUDGET})"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "TOTAL unique clippy warnings: ${total} (budget ${CLIPPY_BUDGET})"

          if [ "${total}" -gt "${CLIPPY_BUDGET}" ]; then
            echo "::error::clippy warnings rose to ${total}, over the budget of ${CLIPPY_BUDGET}. Fix the new warning(s) listed above, or justify raising CLIPPY_BUDGET in .github/workflows/ci.yml."
            exit 1
          fi
          if [ "${total}" -lt "${CLIPPY_BUDGET}" ]; then
            echo "::error::clippy warnings dropped to ${total}. Lower CLIPPY_BUDGET to ${total} in .github/workflows/ci.yml so the gain is held."
            exit 1
          fi

  # Single summary status that aggregates every job above. THIS is the context to
  # mark as a required check on `main` — it always runs (if: always()) and always
  # reports, so path-skipped sub-jobs never deadlock the branch protection / queue.
  # Skipped needs are fine; any failure or cancellation fails the gate.
  ci-gate:
    name: ci-gate
    needs:
      [
        changes,
        ci-scripts,
        corpan-app,
        dja,
        dynawalla-app,
        dynawalla-android-gen,
        lambda,
        native,
        web-io,
        changed-packs,
        terraform,
        pack-catalog,
        dynawalla-curriculum,
        dynawalla-engine,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs results: ${RESULTS}"
          IFS=',' read -ra arr <<< "${RESULTS}"
          for r in "${arr[@]}"; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: ${r})."
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped."
