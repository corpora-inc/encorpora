name: CI

# Lightweight build gate on every PR and push to main.
# Path-filtered so unrelated changes (books/, voices/, etc.) don't trigger.

on:
  pull_request:
    paths:
      - "corpan/corpan-app/**"
      - "corpan/packs/**"
      - "corpan/infra/terraform/**"
      - "web/io/**"
      - "web/data/**"
      - "web/pages/**"
      - "web/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "corpan/corpan-app/**"
      - "corpan/packs/**"
      - "corpan/infra/terraform/**"
      - "web/io/**"
      - "web/data/**"
      - "web/pages/**"
      - "web/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      corpan_app: ${{ steps.filter.outputs.corpan_app }}
      lambda: ${{ steps.filter.outputs.lambda }}
      packs: ${{ steps.filter.outputs.packs }}
      terraform: ${{ steps.filter.outputs.terraform }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect changed areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi

          changed="$(mktemp)"
          if [ -n "${base}" ]; then
            git diff --name-only "${base}" "${head}" > "${changed}"
          else
            git diff-tree --no-commit-id --name-only -r "${head}" > "${changed}"
          fi

          echo "Changed files:"
          sed 's/^/  /' "${changed}"

          run_all=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            run_all=true
          fi

          set_output() {
            local name="$1"
            local pattern="$2"
            if [ "${run_all}" = "true" ] || grep -Eq "${pattern}" "${changed}"; then
              echo "${name}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          set_output corpan_app '^(corpan/corpan-app/|\.github/workflows/ci\.yml$)'
          set_output lambda '^(corpan/infra/terraform/lambda/|\.github/workflows/ci\.yml$)'
          set_output packs '^(corpan/packs/|\.github/workflows/(ci|deploy-pages)\.yml$)'
          set_output terraform '^(corpan/infra/terraform/.*(\.tf|\.tfvars|\.tf\.json)$|corpan/infra/terraform/\.terraform\.lock\.hcl$|\.github/workflows/ci\.yml$)'
          set_output web '^(web/(io|data|pages|scripts)/|\.github/workflows/(ci|deploy-pages)\.yml$)'

  corpan-app:
    name: corpan-app · test + tsc + build
    needs: changes
    if: needs.changes.outputs.corpan_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: corpan/corpan-app/package-lock.json
      - name: Install
        working-directory: corpan/corpan-app
        run: npm ci
      - name: Test
        working-directory: corpan/corpan-app
        run: npm test
      - name: Typecheck
        working-directory: corpan/corpan-app
        run: npm run tsc
      - name: Build
        working-directory: corpan/corpan-app
        run: npm run build

  lambda:
    name: lambda · tests
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: corpan/infra/terraform/lambda/package-lock.json
      - name: Install
        working-directory: corpan/infra/terraform/lambda
        run: npm ci
      - name: Test
        working-directory: corpan/infra/terraform/lambda
        run: npm test

  web-io:
    name: web/io · build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/io/package-lock.json
      - name: Install
        working-directory: web/io
        run: npm ci
      - name: Build
        working-directory: web/io
        run: npm run build

  changed-packs:
    name: changed packs · build
    needs: changes
    if: needs.changes.outputs.packs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build changed packs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          mapfile -t packs < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
              awk -F/ '/^corpan\/packs\/[^/]+\// { print $3 }' |
              sort -u
          )

          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed packs."
            exit 0
          fi

          for pack in "${packs[@]}"; do
            dir="corpan/packs/${pack}"
            if [ ! -f "${dir}/package.json" ]; then
              echo "Skipping ${pack}: no package.json."
              continue
            fi

            echo "::group::${pack}"
            npm install --prefix "${dir}" --legacy-peer-deps
            npm run --prefix "${dir}" build --if-present
            echo "::endgroup::"
          done

  terraform:
    name: terraform · fmt + validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init (no backend)
        working-directory: corpan/infra/terraform
        run: terraform init -backend=false
      - name: Format check
        working-directory: corpan/infra/terraform
        run: terraform fmt -check -recursive
      - name: Validate
        working-directory: corpan/infra/terraform
        run: terraform validate
