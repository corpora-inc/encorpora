name: CI

# Lightweight build gate on every PR and push to main.
# Path-filtered so unrelated changes (books/, voices/, etc.) don't trigger.

on:
  pull_request:
    paths:
      - "corpan/corpan-app/**"
      - "corpan/packs/**"
      - "corpan/infra/terraform/**"
      - "web/io/**"
      - "web/data/**"
      - "web/pages/**"
      - "web/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: ["main"]
    paths:
      - "corpan/corpan-app/**"
      - "corpan/packs/**"
      - "corpan/infra/terraform/**"
      - "web/io/**"
      - "web/data/**"
      - "web/pages/**"
      - "web/scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpan-app:
    name: corpan-app · tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: corpan/corpan-app/package-lock.json
      - name: Install
        working-directory: corpan/corpan-app
        run: npm ci
      - name: Typecheck
        working-directory: corpan/corpan-app
        run: npm run tsc
      - name: Build
        working-directory: corpan/corpan-app
        run: npm run build

  web-io:
    name: web/io · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/io/package-lock.json
      - name: Install
        working-directory: web/io
        run: npm ci
      - name: Build
        working-directory: web/io
        run: npm run build

  changed-packs:
    name: changed packs · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build changed packs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          mapfile -t packs < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
              awk -F/ '/^corpan\/packs\/[^/]+\// { print $3 }' |
              sort -u
          )

          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed packs."
            exit 0
          fi

          for pack in "${packs[@]}"; do
            dir="corpan/packs/${pack}"
            if [ ! -f "${dir}/package.json" ]; then
              echo "Skipping ${pack}: no package.json."
              continue
            fi

            echo "::group::${pack}"
            npm install --prefix "${dir}" --legacy-peer-deps
            npm run --prefix "${dir}" build --if-present
            echo "::endgroup::"
          done

  terraform:
    name: terraform · fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init (no backend)
        working-directory: corpan/infra/terraform
        run: terraform init -backend=false
      - name: Format check
        working-directory: corpan/infra/terraform
        run: terraform fmt -check -recursive
      - name: Validate
        working-directory: corpan/infra/terraform
        run: terraform validate
