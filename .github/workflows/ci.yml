name: CI

# Runs on EVERY PR to main and every merge_group (the merge queue), so the
# `ci-gate` summary status always reports. A required check that is filtered out
# at the workflow level would leave unrelated PRs "expecting" it forever and
# deadlock the queue. Path filtering instead lives in the `changes` job below,
# which skips the heavy build/test jobs when their area is untouched. The
# `changes` job is cheap (checkout + git diff), so running it on every PR is fine.

on:
  pull_request:
    branches: ["main"]
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      corpan_app: ${{ steps.filter.outputs.corpan_app }}
      dja: ${{ steps.filter.outputs.dja }}
      # dynawalla_*, native and shared_ts are declared ahead of the jobs that
      # will consume them. Nothing reads them yet, so they cannot affect any
      # gate; declaring them here keeps the follow-up PR a one-line `if:`.
      dynawalla_app: ${{ steps.filter.outputs.dynawalla_app }}
      dynawalla_curriculum: ${{ steps.filter.outputs.dynawalla_curriculum }}
      dynawalla_engine: ${{ steps.filter.outputs.dynawalla_engine }}
      lambda: ${{ steps.filter.outputs.lambda }}
      native: ${{ steps.filter.outputs.native }}
      packs: ${{ steps.filter.outputs.packs }}
      shared_ts: ${{ steps.filter.outputs.shared_ts }}
      terraform: ${{ steps.filter.outputs.terraform }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect changed areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi

          changed="$(mktemp)"
          if [ -n "${base}" ]; then
            git diff --name-only "${base}" "${head}" > "${changed}"
          else
            git diff-tree --no-commit-id --name-only -r "${head}" > "${changed}"
          fi

          echo "Changed files:"
          sed 's/^/  /' "${changed}"

          run_all=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            run_all=true
          fi

          set_output() {
            local name="$1"
            local pattern="$2"
            if [ "${run_all}" = "true" ] || grep -Eq "${pattern}" "${changed}"; then
              echo "${name}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          # The gate's own code. `.github/scripts/**` holds the adversarial
          # reviewer, whose failure mode when it regresses is to PASS wrongly —
          # so its tests must run on any change to it (or to this workflow, or
          # to the workflow that invokes it).
          set_output ci_scripts '^(\.github/scripts/|\.github/workflows/(ci|adversarial-review)\.yml$)'
          set_output corpan_app '^(corpan/corpan-app/|\.github/workflows/ci\.yml$)'
          set_output dja '^(corpan/dja/|\.github/workflows/ci\.yml$)'
          set_output lambda '^(corpan/infra/terraform/lambda/|\.github/workflows/ci\.yml$)'
          set_output packs '^(corpan/packs/|\.github/workflows/(ci|deploy-pages)\.yml$)'
          set_output terraform '^(corpan/infra/terraform/.*(\.tf|\.tfvars|\.tf\.json)$|corpan/infra/terraform/\.terraform\.lock\.hcl$|\.github/workflows/ci\.yml$)'
          set_output web '^(web/(io|data|pages|scripts)/|\.github/workflows/(ci|deploy-pages)\.yml$)'

          # Dynawalla areas. No job consumes these yet — the filters land first
          # so the jobs that follow are a one-line addition instead of a
          # re-plumbing of this step.
          set_output dynawalla_app '^(dynawalla/dynawalla-app/|\.github/workflows/ci\.yml$)'
          set_output dynawalla_curriculum '^(dynawalla/curriculum/|\.github/workflows/ci\.yml$)'
          set_output dynawalla_engine '^(dynawalla/engine/|\.github/workflows/ci\.yml$)'
          # Cross-product areas. Deliberately no `ci.yml` self-trigger: these
          # exist to answer "did shared code / the native layer move", and a
          # workflow edit is not a change to either.
          set_output shared_ts '^(shared/|corpan/packs/shared/)'
          set_output native '^(native/|.*/src-tauri/|corpan/plugins/)'

      # Coverage warning. WARN-ONLY, and permanently scoped to `pull_request`.
      #
      # Do NOT extend this to merge_group. The `changes` job resolves its range
      # as merge_group.base_sha..head_sha, which spans the WHOLE batch the queue
      # assembled — so a fail-closed hygiene check here would attribute one PR's
      # uncovered path to every PR batched with it and eject them all at once.
      # On a pull_request the range is exactly that PR's own change, which is
      # the only range where "this path has no CI area" is a true statement
      # about the author's diff.
      #
      # Belt and braces so this can never flip a gate: an explicit `set +e`, an
      # explicit `exit 0`, and `continue-on-error: true`. The `set +e` is load
      # bearing — Actions runs a `run:` block as `bash -e {0}` on Linux, so
      # errexit is ON by default and `set -uo pipefail` does not turn it off.
      - id: uncovered
        name: Warn on paths with no CI area
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          set +e   # Actions invokes this as `bash -e {0}`; drop errexit.

          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No base commit resolved; skipping coverage warning."
            exit 0
          fi

          # Areas a job actually consumes today, minus the `ci.yml` self-triggers
          # (a workflow edit is exempt below anyway). NOT the union of every
          # filter above: `dynawalla_curriculum`, `dynawalla_engine`, `native`
          # and `shared_ts` are declared ahead of their jobs, so paths they
          # match are genuinely ungated and must keep warning until those jobs
          # land. `dynawalla/dynawalla-app/` graduated when the `dynawalla-app`
          # job below started consuming its filter.
          #
          # The terraform member is copied verbatim from the `terraform` filter —
          # extension-scoped, not the bare directory. A bare `corpan/infra/
          # terraform/` would mark helper scripts under it as covered when no job
          # runs them.
          #
          # `corpan/plugins/` is covered only by `.github/workflows/ios-native.yml`,
          # which is ADVISORY (not a required check). It compiles, so it counts
          # here, but a red run has to be read by hand.
          covered='^(corpan/corpan-app/|corpan/dja/|corpan/infra/terraform/lambda/|corpan/packs/|corpan/infra/terraform/.*(\.tf|\.tfvars|\.tf\.json)$|corpan/infra/terraform/\.terraform\.lock\.hcl$|web/(io|data|pages|scripts)/|corpan/plugins/|dynawalla/dynawalla-app/)'

          # Carve-outs checked BEFORE `covered`, because a broader area prefix
          # would otherwise swallow them. `corpan-app`'s job is npm only —
          # `npm test`/`tsc`/`build`. It never compiles the Rust under
          # `src-tauri/`, so `corpan/corpan-app/src-tauri/**` is ungated even
          # though `corpan/corpan-app/` is covered. grep -E has no negative
          # lookahead, hence a separate pattern.
          ungated='(^|/)src-tauri/'

          # Gate-free by design: CI config, agent control plane, docs, dotfiles.
          exempt='(^\.github/|^\.claude/|^\.gitignore$|^\.gitattributes$|^LICENSE$|\.md$)'

          n=0
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            if printf '%s\n' "${p}" | grep -Eq "${ungated}"; then
              echo "::warning::path ${p} has no CI area"
              n=$((n + 1))
              continue
            fi
            printf '%s\n' "${p}" | grep -Eq "${covered}" && continue
            printf '%s\n' "${p}" | grep -Eq "${exempt}" && continue
            echo "::warning::path ${p} has no CI area"
            n=$((n + 1))
          done <<< "$(git diff --name-only "${base}" "${head}" || true)"

          echo "${n} changed path(s) with no CI area."
          exit 0

  corpan-app:
    name: corpan-app · tsc + build
    needs: changes
    if: needs.changes.outputs.corpan_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: corpan/corpan-app/package-lock.json
      - name: Install
        working-directory: corpan/corpan-app
        run: npm ci
      # The corpan-app test/build graph imports @shared/capabilities (the
      # journey capability modules), which is its own npm workspace — without
      # its node_modules the app's tests fail on unresolved imports (the
      # integration two-failure lesson).
      - name: Install capabilities workspace
        working-directory: corpan/packs/shared/capabilities
        run: npm ci
      # Journey activity-contract drift gate: every generated copy of
      # activityContract.ts must match the authoritative corpan-app source.
      - name: Contract sync check
        run: node corpan/packs/sdk/sync-contract.mjs --check
      - name: Test
        working-directory: corpan/corpan-app
        run: npm test
      - name: Typecheck
        working-directory: corpan/corpan-app
        run: npm run tsc
      - name: Build
        working-directory: corpan/corpan-app
        run: npm run build

  # Django content-generation tests (corpan/dja). The shipped SQLite content
  # bundle is built from this code; a regression here (e.g. the #486 silent
  # translation-corruption bug) would otherwise ship unnoticed. The two test
  # modules under cor/utils are plain-pytest and stub out Django + corpora_ai
  # in sys.modules, so the only runtime deps are pytest + pydantic — no Django
  # install, no DB, no API access. Fast (<1s) and self-contained, so it cannot
  # jam the merge queue. Skips cleanly when no corpan/dja/** files changed,
  # exactly like the sibling area jobs; ci-gate treats a skip as a pass.
  dja:
    name: dja · tests
    needs: changes
    if: needs.changes.outputs.dja == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4" "pydantic==2.12.5"
      - name: Run dja tests
        working-directory: corpan/dja
        # Scope to cor/utils: the plain-pytest modules live here and stub their
        # Django/corpora_ai deps. This auto-collects future test_*.py added in
        # this dir, while NOT collecting cor/tests.py (a Django TestCase
        # placeholder that would need a full Django install + DB) — keeping the
        # gate fast and unable to jam the queue.
        run: python -m pytest cor/utils -q

  # Unit tests for the adversarial-review gate (.github/scripts). That script is
  # a required status check whose regression mode is to pass wrongly, which no
  # other job can detect — these assertions are the only signal. stdlib + pytest
  # only (the script itself has no third-party deps), so it is fast and cannot
  # jam the merge queue. Needs fetch-depth: 0 — the range tests build a real
  # throwaway repo, but `git` must be usable from the checkout.
  ci-scripts:
    name: ci-scripts · tests
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps (pinned)
        run: python -m pip install --disable-pip-version-check "pytest==8.3.4"
      - name: Run CI script tests
        run: python -m pytest .github/scripts -q

  # Dynawalla's app shell. Node-only, exactly like `corpan-app`: lint, the
  # native test runner, tsc and a production vite build. It does NOT compile
  # the Rust under dynawalla/dynawalla-app/src-tauri — there is no cargo gate
  # in this workflow for either app, and adding one is its own PR with its own
  # runner-cost and caching decisions. The `uncovered` warning above keeps
  # flagging `src-tauri/` paths until that lands, which is accurate.
  #
  # Path-gated, and therefore NOT a required status context: it reports into
  # `ci-gate` below. A required context that never reports on unrelated PRs
  # blocks the merge queue forever.
  dynawalla-app:
    name: dynawalla-app · lint + tsc + test + build
    needs: changes
    if: needs.changes.outputs.dynawalla_app == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches dynawalla/dynawalla-app/.nvmrc and the `engines` floor.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dynawalla/dynawalla-app/package-lock.json
      - name: Install
        working-directory: dynawalla/dynawalla-app
        run: npm ci
      - name: Lint
        working-directory: dynawalla/dynawalla-app
        run: npm run lint
      - name: Test
        working-directory: dynawalla/dynawalla-app
        run: npm test
      - name: Typecheck
        working-directory: dynawalla/dynawalla-app
        run: npm run tsc
      - name: Build
        working-directory: dynawalla/dynawalla-app
        run: npm run build

  lambda:
    name: lambda · tests
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: corpan/infra/terraform/lambda/package-lock.json
      - name: Install
        working-directory: corpan/infra/terraform/lambda
        run: npm ci
      - name: Test
        working-directory: corpan/infra/terraform/lambda
        run: npm test

  web-io:
    name: web/io · build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/io/package-lock.json
      - name: Install
        working-directory: web/io
        run: npm ci
      - name: Build
        working-directory: web/io
        run: npm run build

  changed-packs:
    name: changed packs · test + build
    needs: changes
    if: needs.changes.outputs.packs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test, typecheck, validate manifest, build changed packs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi

          mapfile -t packs < <(
            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
              awk -F/ '/^corpan\/packs\/[^/]+\// { print $3 }' |
              sort -u
          )

          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No changed packs."
            exit 0
          fi

          for pack in "${packs[@]}"; do
            dir="corpan/packs/${pack}"
            if [ ! -f "${dir}/package.json" ]; then
              echo "Skipping ${pack}: no package.json."
              continue
            fi

            echo "::group::${pack}"

            # Manifest schema sanity: must be valid JSON with id + version.
            if [ -f "${dir}/manifest.json" ]; then
              node -e '
                const fs = require("fs");
                const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                for (const k of ["id", "version"]) {
                  if (!m[k]) { console.error(`manifest.json missing required key: ${k}`); process.exit(1); }
                }
                console.log(`manifest ok: ${m.id}@${m.version}`);
              ' "${dir}/manifest.json"
            else
              echo "Note: ${pack} has no manifest.json (source-only pack)."
            fi

            npm install --prefix "${dir}" --legacy-peer-deps

            # Run the pack's own test + typecheck when defined (back-compat gate).
            if node -e 'process.exit(require(process.argv[1]).scripts?.test ? 0 : 1)' "${dir}/package.json" 2>/dev/null; then
              npm run --prefix "${dir}" test
            else
              echo "No test script for ${pack}; skipping."
            fi
            npm run --prefix "${dir}" tsc --if-present
            npm run --prefix "${dir}" build --if-present
            echo "::endgroup::"
          done

  terraform:
    name: terraform · fmt + validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Init (no backend)
        working-directory: corpan/infra/terraform
        run: terraform init -backend=false
      - name: Format check
        working-directory: corpan/infra/terraform
        run: terraform fmt -check -recursive
      - name: Validate
        working-directory: corpan/infra/terraform
        run: terraform validate

  # Pack catalog integrity: every catalog entry's id matches the installer's
  # zip-derived id (else "Pack id mismatch" on install) and every declared
  # avatarSource resolves to a real file (else the pack ships with no artwork).
  # Runs whenever packs OR the catalog (web/data) change. Cheap, no npm.
  pack-catalog:
    name: pack-catalog · integrity
    needs: changes
    if: needs.changes.outputs.packs == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate pack ids + artwork against the catalog
        run: node .github/scripts/pack_catalog_check.js

  # Single summary status that aggregates every job above. THIS is the context to
  # mark as a required check on `main` — it always runs (if: always()) and always
  # reports, so path-skipped sub-jobs never deadlock the branch protection / queue.
  # Skipped needs are fine; any failure or cancellation fails the gate.
  ci-gate:
    name: ci-gate
    needs:
      [
        changes,
        ci-scripts,
        corpan-app,
        dja,
        dynawalla-app,
        lambda,
        web-io,
        changed-packs,
        terraform,
        pack-catalog,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs results: ${RESULTS}"
          IFS=',' read -ra arr <<< "${RESULTS}"
          for r in "${arr[@]}"; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: ${r})."
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped."
