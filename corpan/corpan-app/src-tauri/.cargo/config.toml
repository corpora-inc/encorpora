# src-tauri/.cargo/config.toml

# macOS: Swift runtime for tauri-plugin-iap's Swift bridge.
# System Swift is in the dyld shared cache; /usr/lib/swift resolves there.
[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

# Force NDK linkers + 16 KB page size for ALL Android ABIs.

[target.aarch64-linux-android]
linker = "/Users/skyl/Android/ndk/28.2.13676358/toolchains/llvm/prebuilt/darwin-arm64/bin/aarch64-linux-android24-clang"
ar = "/Users/skyl/Android/ndk/28.2.13676358/toolchains/llvm/prebuilt/darwin-arm64/bin/llvm-ar"
rustflags = [
    "-C",
    "link-arg=-Wl,-z,common-page-size=16384",
    "-C",
    "link-arg=-Wl,-z,max-page-size=16384",
]

[target.armv7-linux-androideabi]
linker = "/Users/skyl/Android/ndk/28.2.13676358/toolchains/llvm/prebuilt/darwin-arm64/bin/armv7a-linux-androideabi24-clang"
