name: corpan
options:
  bundleIdPrefix: com.corpora.corpan
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: corpan
      PRODUCT_BUNDLE_IDENTIFIER: com.corpora.corpan
      DEVELOPMENT_TEAM: F9AV5HKF6N
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  corpan_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: corpan_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: Corpan.storekit
    info:
      path: corpan_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # SKAdNetwork identifiers Apple may send install postbacks to.
        # cstr6suwn9 = Google Ads. Append additional dicts (one per
        # network) for Meta, TikTok, etc. Metadata only — no SDK.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # ATS exception for media playback. The World Radio pack streams
        # public Icecast/Shoutcast radio, which is overwhelmingly delivered
        # over plain HTTP — WKWebView's `<audio>` element refuses HTTP under
        # default ATS. `NSAllowsArbitraryLoadsForMedia` is Apple's blessed
        # opt-out for streaming-media apps; `NSAllowsArbitraryLoadsInWebContent`
        # belt-and-braces for `<audio>` HLS playlists fetched through web
        # content. We do NOT enable the global `NSAllowsArbitraryLoads`
        # because no other corpan code path needs cleartext HTTP — keeping
        # it scoped to media is friendlier to App Review.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSMicrophoneUsageDescription: Corpán uses your microphone for on-device pronunciation practice with the Pronunciation Coach pack. Audio is processed locally on your device.
        # CFBundleShortVersionString + CFBundleVersion are auto-injected by
        # Tauri from tauri.conf.json's `version` field. Don't hardcode them
        # here or they'll drift.
    entitlements:
      path: corpan_iOS/corpan_iOS.entitlements
    scheme:
      run:
        config: debug
        storeKitConfiguration: Corpan.storekit
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64, x86_64]
        VALID_ARCHS: arm64  x86_64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64-sim]: $(inherited) $(PROJECT_DIR)/Externals/arm64-sim/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - /usr/lib/swift
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
        EXCLUDED_ARCHS[sdk=iphoneos*]: arm64-sim x86_64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F9AV5HKF6N
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: StoreKit.framework
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64-sim/${CONFIGURATION}/libapp.a
    postBuildScripts:
      - script: |
          rm -f "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/libapp.a"
          # Remove back-deploy Swift Concurrency shim — iOS 15+ has it in the OS.
          # The swift-bridge crate embeds it but not its dependency (libswiftCore),
          # causing a dyld crash. The system version works fine for our deployment target.
          FWDIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Frameworks"
          if [ -f "${FWDIR}/libswift_Concurrency.dylib" ]; then
            echo "Removing back-deploy libswift_Concurrency.dylib (iOS 15+ has it in the OS)"
            rm -f "${FWDIR}/libswift_Concurrency.dylib"
          fi
        name: Clean app bundle
        basedOnDependencyAnalysis: false
