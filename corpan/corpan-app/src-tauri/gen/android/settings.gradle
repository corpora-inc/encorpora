// Force modern AGP everywhere in this build (app + any included library modules)
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'com.android.application' version '8.6.0'
    id 'com.android.library'     version '8.6.0'
  }
}

include ':app'

apply from: 'tauri.settings.gradle'
