[package]
name = "corpan"
version = "0.11.8"
description = "Language learning app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "corpan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-safe-area-insets-css = "0.2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-game-packs = { path = "../../plugins/tauri-plugin-game-packs" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
sha2 = "0.10"
zip = "2.2.2"
tauri-plugin-tts = { path = "../../plugins/tauri-plugin-tts" }
tauri-plugin-audio-keepalive = { path = "../../plugins/tauri-plugin-audio-keepalive" }
tauri-plugin-subscriptions = { path = "../../plugins/tauri-plugin-subscriptions" }
tauri-plugin-iap = { path = "../../plugins/tauri-plugin-iap" }
futures-util = "0.3"

# Production optimizations for release builds
[profile.release]
opt-level = "z"   # Optimize for size (important for mobile apps)
lto = true        # Link-time optimization for better performance and smaller binary
codegen-units = 1 # Better optimization at cost of compile time
strip = true      # Strip symbols from binary (smaller size)
panic = "abort"   # Smaller binary, no unwinding
