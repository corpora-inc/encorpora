[package]
name = "tauri-plugin-haptics"
version = "0.1.0"
authors = ["Corpora Inc"]
description = "Native haptic feedback (impact/notification) for Corpán"
edition = "2021"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-haptics"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
