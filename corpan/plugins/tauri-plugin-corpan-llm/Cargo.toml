[package]
name = "tauri-plugin-corpan-llm"
version = "0.1.0"
authors = ["Corpora Inc"]
description = "On-device LLM runtime — vendored llama.cpp with Metal (iOS), Vulkan (Android), CPU fallback. Streaming inference, shared across packs."
edition = "2021"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules", "/vendor/llama.cpp/**/*.o"]
links = "tauri-plugin-corpan-llm"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"

# Desktop-only: use llama-cpp-2 for now (CPU). Mobile uses native llama.cpp via FFI bridges.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"

[features]
default = []
# Desktop only — enabled when running on macOS/Linux dev box
metal-desktop = []
cuda-desktop = []
