[package]
name = "tauri-plugin-radio-stream"
version = "0.1.1"
authors = ["Corpora Inc"]
description = "Native streaming radio player (ExoPlayer / AVPlayer) for the World Radio pack"
edition = "2021"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-radio-stream"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
