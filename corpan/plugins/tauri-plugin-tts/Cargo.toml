[package]
name = "tauri-plugin-tts"
version = "0.2.0"
authors = ["You"]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-tts"

[dependencies]
tauri = { version = "2.1.0" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

# macOS-only deps (so Linux/Windows builds don't pull them)
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.24"

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = ["build"] }
tauri-build = "2.0.2"
