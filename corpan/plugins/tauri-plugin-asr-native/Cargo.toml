[package]
name = "tauri-plugin-asr-native"
version = "0.1.0"
authors = ["Corpora Inc"]
description = "Provider-agnostic dictation over OS-native STT — Apple SpeechAnalyzer/SFSpeechRecognizer (iOS) + Android SpeechRecognizer. Zero download, ~0 added app memory, out-of-process. Conforms to corpan-asr-contract."
edition = "2021"
exclude = ["/examples", "/node_modules"]
links = "tauri-plugin-asr-native"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The FROZEN wire contract — re-use its structs, never redeclare them
# (corpan/docs/STT_MASTERPLAN.md §2.2). serde drops undeclared fields both ways.
corpan-asr-contract = { path = "../corpan-asr-contract" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
