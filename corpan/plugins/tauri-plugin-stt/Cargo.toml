[package]
name = "tauri-plugin-stt"
version = "0.3.1"
authors = ["Corpora Inc"]
description = "On-device speech-to-text via whisper.cpp (iOS XCFramework + Android JNI)."
edition = "2021"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-stt"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
