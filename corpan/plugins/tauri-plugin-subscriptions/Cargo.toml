[package]
name = "tauri-plugin-subscriptions"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-subscriptions"

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = "2"
