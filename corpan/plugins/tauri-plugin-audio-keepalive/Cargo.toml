[package]
name = "tauri-plugin-audio-keepalive"
version = "0.1.0"
authors = ["Corpora Inc"]
description = "Native audio session keepalive for background playback"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/webview-dist", "/webview-src", "/node_modules"]
links = "tauri-plugin-audio-keepalive"

[dependencies]
tauri = { version = "2.1.0" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = ["build"] }
tauri-build = "2.0.2"
