permissions = [
    "allow-start-audio-keepalive",
    "allow-stop-audio-keepalive",
    "allow-update-now-playing",
    "allow-pause-audio-keepalive",
    "allow-resume-audio-keepalive",
    "allow-register-listener",
    "allow-remove-listener",
    "allow-trace-event",
]
