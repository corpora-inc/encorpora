<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Plaza — Top HUD verify</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden;
        /* a warm Antigua sky so the paper chrome reads in-context */
        background: radial-gradient(120% 100% at 50% 0%, #d9c9a6, #c9b48c 60%, #b89e72);
        font-family: ui-sans-serif, system-ui, sans-serif; }
      /* Mimic the in-game overlay surface — the chrome mounts INSIDE this. */
      .wp-overlay { position: absolute; inset: 0; }
      /* A faux NPC dialogue window so we can see the chrome recede behind it. */
      .faux-dialogue {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        width: min(520px, 92vw); padding: 16px 18px; border-radius: 16px;
        background: linear-gradient(180deg, #fbf4e6, #efe1c8);
        box-shadow: 0 18px 50px rgba(58,47,37,0.34); color: #3a2f25; display: none;
        z-index: 40;
      }
      .faux-dialogue.show { display: block; }
    </style>
  </head>
  <body>
    <div class="wp-overlay">
      <div class="faux-dialogue">A townsperson: "¡Buenos días! ¿En qué le ayudo?"</div>
    </div>
    <script type="module" src="/qa/hud-verify.ts"></script>
  </body>
</html>
