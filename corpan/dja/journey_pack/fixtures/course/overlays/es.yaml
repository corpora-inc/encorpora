# FIXTURE es overlay — exercises contrastive notes, cognate credit, phoneme pairs.
l1: es
contrastive_notes:
  - ref_kind: grammarNode
    ref: en.gn.be-statements
    note: >-
      Spanish splits 'to be' into ser and estar; English uses one verb for
      both. Say the shop is open (estar sense) and the shop is small (ser
      sense) with the same 'is'.
