id: en.a0.u01
arc: en.arc0
theme: "Survival kit"
# Communicative-first launchpad opener (V-23): the very first minutes surface
# high-frequency, immediately useful language — greetings and courtesy — before
# any pronunciation drilling. The sounds unit (en.a0.u02) reinforces phonology
# afterwards.
cando:
  - key: greet
    text: "Can say hello, thank you, please, sorry, and goodbye in everyday moments."
  - key: basics
    text: "Can use a handful of rescue phrases: greetings, thanks, and asking people to slow down."
  - key: numbers
    text: "Can say and understand the numbers from one to ten."
vocab_band: { lo: 1, hi: 1500 }
phrase_domains: [everyday]
skills:
  - id: en.skill.survival
    kind: function
    title: "Survival phrases"
    b: -3.5
items:
  # ---- courtesy words first (highest-frequency, immediately useful) ----
  - ref: "word:en:hello"
    skills: [en.skill.survival]
    importance: 3
    probe: true
    b: -3.5
  - ref: "word:en:please"
    skills: [en.skill.survival]
    importance: 3
    b: -3.5
  - ref: "word:en:thanks"
    skills: [en.skill.survival]
    importance: 3
    probe: true
    b: -3.5
  - ref: "word:en:yes"
    skills: [en.skill.survival]
    importance: 2
    b: -3.5
  - ref: "word:en:no"
    skills: [en.skill.survival]
    importance: 2
    b: -3.5
  - ref: "word:en:sorry"
    skills: [en.skill.survival]
    importance: 2
    b: -3.5
  - ref: "word:en:help"
    skills: [en.skill.survival]
    importance: 2
    b: -3.5
  - ref: "word:en:name"
    skills: [en.skill.survival]
    importance: 2
    b: -3.5
  # ---- core communicative phrases: greetings + courtesy ----
  - ref: "phrase:base:27300"  # Good morning
    skills: [en.skill.survival]
    importance: 3
    probe: true
    b: -3.5
  - ref: "phrase:base:27320"  # Thank you
    skills: [en.skill.survival]
    importance: 3
    probe: true
    b: -3.5
  - ref: "phrase:base:27002"  # Yes please
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:27003"  # No thank you
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:27325"  # I am sorry
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:27304"  # Nice to meet you
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:21687"  # How are you?
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:27298"  # See you later
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  # ---- ask for help / slow down (rescue phrases) ----
  - ref: "phrase:base:21765"  # Can you help?
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:13752"  # Hi, I don’t understand this.
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:11793"  # Thanks for your help!
    skills: [en.skill.survival]
    importance: 3
    substitutable: true
  - ref: "phrase:base:27079"  # One ticket please
    skills: [en.skill.survival]
    importance: 2
    substitutable: true
  - ref: "phrase:base:27108"  # Come here please
    skills: [en.skill.survival]
    importance: 2
