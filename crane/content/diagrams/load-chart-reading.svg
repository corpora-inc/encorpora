<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 844" role="img" aria-labelledby="lcr-title lcr-desc" font-family="system-ui, sans-serif" font-size="18" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title id="lcr-title">Reading a load chart</title>
  <desc id="lcr-desc">A fictional load chart excerpt with boom lengths of 40, 60 and 80 feet across the top and radii from 10 to 50 feet down the side. Shaded cells at short radius are limited by structural strength; the rest are limited by stability. Example lift: 60 ft boom at 27 ft radius. 27 ft is not listed, so use the next longer radius, 30 ft: 16,500 lb gross. Subtract hook block 450 lb, stowed jib 1,200 lb and slings and shackles 150 lb to get 14,700 lb net, the most the load may weigh.</desc>
  <style>svg:root{color:#111}@media (prefers-color-scheme:dark){svg:root{color:#eee}}</style>

  <text x="240" y="28" text-anchor="middle" fill="var(--crane-muted, #8a8f98)">Fictional chart excerpt · gross lb</text>
  <text x="240" y="56" text-anchor="middle" font-size="20" font-weight="700">Lift: 60 ft boom, 27 ft radius</text>

  <!-- structural (shaded) cells -->
  <g fill="var(--crane-muted, #8a8f98)" fill-opacity="0.3">
    <rect x="111" y="136" width="236" height="76"/>
    <rect x="111" y="212" width="118" height="38"/>
  </g>
  <!-- example cell -->
  <rect x="229" y="288" width="118" height="38" fill="var(--crane-accent, #d97706)" fill-opacity="0.18"/>

  <!-- grid -->
  <g stroke="var(--crane-muted, #8a8f98)" stroke-width="1.5" fill="none">
    <rect x="15" y="72" width="450" height="330"/>
    <line x1="111" y1="104" x2="465" y2="104"/>
    <line x1="15" y1="136" x2="465" y2="136"/>
    <line x1="15" y1="174" x2="465" y2="174"/>
    <line x1="15" y1="212" x2="465" y2="212"/>
    <line x1="15" y1="250" x2="465" y2="250"/>
    <line x1="15" y1="288" x2="465" y2="288"/>
    <line x1="15" y1="326" x2="465" y2="326"/>
    <line x1="15" y1="364" x2="465" y2="364"/>
    <line x1="111" y1="72" x2="111" y2="402"/>
    <line x1="229" y1="104" x2="229" y2="402"/>
    <line x1="347" y1="104" x2="347" y2="402"/>
  </g>
  <!-- bold line between structural and stability ratings -->
  <path d="M347 136 V212 H229 V250 H111" fill="none" stroke="currentColor" stroke-width="5"/>
  <rect x="229" y="288" width="118" height="38" fill="none" stroke="var(--crane-accent, #d97706)" stroke-width="4"/>

  <!-- headers -->
  <text x="63" y="96" text-anchor="middle" font-weight="700">Radius</text>
  <text x="63" y="124" text-anchor="middle" font-weight="700">ft</text>
  <text x="288" y="96" text-anchor="middle" font-weight="700">Boom length, ft</text>
  <text x="170" y="127" text-anchor="middle" font-weight="700">40</text>
  <text x="288" y="127" text-anchor="middle" font-weight="700" fill="var(--crane-accent, #d97706)">60</text>
  <text x="406" y="127" text-anchor="middle" font-weight="700">80</text>

  <!-- radius column -->
  <g text-anchor="middle" font-weight="700">
    <text x="63" y="161">10</text>
    <text x="63" y="199">15</text>
    <text x="63" y="237">20</text>
    <text x="63" y="275">25</text>
    <text x="63" y="313" fill="var(--crane-accent, #d97706)">30</text>
    <text x="63" y="351">40</text>
    <text x="63" y="389">50</text>
  </g>

  <!-- ratings -->
  <g text-anchor="middle">
    <text x="170" y="161">52,000</text><text x="288" y="161">44,000</text><text x="406" y="161">—</text>
    <text x="170" y="199">38,500</text><text x="288" y="199">34,000</text><text x="406" y="199">28,000</text>
    <text x="170" y="237">29,000</text><text x="288" y="237">26,500</text><text x="406" y="237">23,000</text>
    <text x="170" y="275">22,000</text><text x="288" y="275">20,500</text><text x="406" y="275">18,500</text>
    <text x="170" y="313">17,000</text><text x="288" y="313" font-weight="700">16,500</text><text x="406" y="313">15,000</text>
    <text x="170" y="351">—</text><text x="288" y="351">10,200</text><text x="406" y="351">9,800</text>
    <text x="170" y="389">—</text><text x="288" y="389">6,900</text><text x="406" y="389">6,600</text>
  </g>

  <!-- next longer radius -->
  <text x="240" y="436" text-anchor="middle" font-size="20" font-weight="700">27 ft is not listed → use 30 ft</text>
  <text x="240" y="462" text-anchor="middle">Next longer radius, never shorter.</text>

  <!-- gross to net -->
  <line x1="15" y1="484" x2="465" y2="484" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="30" y="518">Gross capacity</text><text x="450" y="518" text-anchor="end">16,500 lb</text>
  <text x="30" y="548">− Hook block</text><text x="450" y="548" text-anchor="end">450 lb</text>
  <text x="30" y="578">− Stowed jib</text><text x="450" y="578" text-anchor="end">1,200 lb</text>
  <text x="30" y="608">− Slings, shackles</text><text x="450" y="608" text-anchor="end">150 lb</text>
  <line x1="30" y1="622" x2="450" y2="622" stroke="currentColor" stroke-width="2"/>
  <g font-size="20" font-weight="700" fill="var(--crane-accent, #d97706)">
    <text x="30" y="650">= Net capacity</text><text x="450" y="650" text-anchor="end">14,700 lb</text>
  </g>
  <text x="30" y="676">The load may weigh no more than net.</text>

  <!-- legend -->
  <line x1="15" y1="698" x2="465" y2="698" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="30" y="714" width="36" height="24" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.3" stroke="var(--crane-muted, #8a8f98)" stroke-width="1.5"/>
  <text x="80" y="732">Structural strength limit</text>
  <rect x="30" y="750" width="36" height="24" fill="none" stroke="var(--crane-muted, #8a8f98)" stroke-width="1.5"/>
  <text x="80" y="768">Stability (tipping) limit</text>
  <text x="30" y="804">Charts mark the split with shading,</text>
  <text x="30" y="828">a bold line or an asterisk.</text>
</svg>
