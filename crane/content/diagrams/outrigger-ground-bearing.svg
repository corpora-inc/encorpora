<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img" aria-labelledby="ogb-title ogb-desc" font-family="system-ui, sans-serif" font-size="18" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title id="ogb-title">Outrigger ground bearing pressure</title>
  <desc id="ogb-desc">Side view of an outrigger beam fully extended, its jack and float resting on a mat on firm, level ground. The mat spreads the outrigger force over a larger area. Ground bearing pressure equals force divided by area. Example: 60,000 lb on a 2 ft by 2 ft float (4 square feet) is 15,000 pounds per square foot. The same 60,000 lb on a 6 ft by 6 ft mat (36 square feet) is about 1,667 pounds per square foot: nine times the area, one ninth the pressure, assuming a stiff mat that bears evenly.</desc>
  <style>svg:root{color:#111}@media (prefers-color-scheme:dark){svg:root{color:#eee}}</style>
  <defs>
    <marker id="ogb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--crane-accent, #d97706)"/>
    </marker>
  </defs>

  <!-- force -->
  <text x="470" y="34" text-anchor="end" font-weight="700">60,000 lb on this outrigger</text>
  <line x1="358" y1="44" x2="358" y2="94" stroke="var(--crane-accent, #d97706)" stroke-width="4" marker-end="url(#ogb-arrow)"/>

  <!-- carrier and outrigger -->
  <rect x="10" y="64" width="140" height="80" rx="6" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.25" stroke="currentColor" stroke-width="3"/>
  <rect x="150" y="100" width="220" height="18" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.45" stroke="currentColor" stroke-width="3"/>
  <text x="250" y="90" text-anchor="middle">Beam fully extended</text>
  <rect x="346" y="118" width="24" height="78" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.25" stroke="currentColor" stroke-width="3"/>
  <rect x="323" y="196" width="70" height="12" rx="2" fill="var(--crane-muted, #8a8f98)" stroke="currentColor" stroke-width="3"/>
  <text x="316" y="204" text-anchor="end">Float</text>

  <!-- mat / cribbing -->
  <rect x="253" y="208" width="210" height="24" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.45" stroke="currentColor" stroke-width="3"/>
  <g stroke="currentColor" stroke-width="1.5">
    <line x1="283" y1="208" x2="283" y2="232"/><line x1="313" y1="208" x2="313" y2="232"/>
    <line x1="343" y1="208" x2="343" y2="232"/><line x1="373" y1="208" x2="373" y2="232"/>
    <line x1="403" y1="208" x2="403" y2="232"/><line x1="433" y1="208" x2="433" y2="232"/>
  </g>

  <!-- ground -->
  <rect x="0" y="232" width="480" height="40" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.15"/>
  <line x1="0" y1="232" x2="480" y2="232" stroke="currentColor" stroke-width="2"/>
  <text x="16" y="258">Firm, level ground</text>
  <g stroke="var(--crane-accent, #d97706)" stroke-width="2.5" marker-end="url(#ogb-arrow)">
    <line x1="268" y1="238" x2="268" y2="264"/><line x1="298" y1="238" x2="298" y2="264"/>
    <line x1="328" y1="238" x2="328" y2="264"/><line x1="358" y1="238" x2="358" y2="264"/>
    <line x1="388" y1="238" x2="388" y2="264"/><line x1="418" y1="238" x2="418" y2="264"/>
    <line x1="448" y1="238" x2="448" y2="264"/>
  </g>
  <text x="358" y="296" text-anchor="middle">Mat spreads the load</text>

  <!-- formula -->
  <line x1="8" y1="314" x2="472" y2="314" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="240" y="346" text-anchor="middle" font-size="22" font-weight="700">Pressure = force ÷ area</text>

  <!-- plan views to scale: 25 units per foot -->
  <text x="120" y="400" text-anchor="middle">Float</text>
  <rect x="95" y="410" width="50" height="50" fill="var(--crane-danger, #dc2626)" fill-opacity="0.25" stroke="var(--crane-danger, #dc2626)" stroke-width="3"/>
  <rect x="280" y="362" width="150" height="150" fill="var(--crane-accent, #d97706)" fill-opacity="0.15" stroke="var(--crane-accent, #d97706)" stroke-width="3"/>
  <text x="355" y="443" text-anchor="middle">Mat</text>

  <g text-anchor="middle">
    <text x="120" y="546">2 ft × 2 ft = 4 ft²</text>
    <text x="120" y="572">60,000 lb ÷ 4 ft²</text>
    <text x="120" y="604" font-size="22" font-weight="700" fill="var(--crane-danger, #dc2626)">15,000 psf</text>
    <text x="355" y="546">6 ft × 6 ft = 36 ft²</text>
    <text x="355" y="572">60,000 lb ÷ 36 ft²</text>
    <text x="355" y="604" font-size="22" font-weight="700">≈ 1,667 psf</text>
  </g>

  <line x1="8" y1="624" x2="472" y2="624" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="240" y="652" text-anchor="middle" font-weight="700">9× the area, 1/9 the pressure.</text>
  <text x="240" y="678" text-anchor="middle">Assumes a stiff mat that bears evenly.</text>
  <text x="240" y="704" text-anchor="middle">Set up on firm, drained, level ground.</text>
</svg>
