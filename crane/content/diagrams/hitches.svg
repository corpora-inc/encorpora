<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 576" role="img" aria-labelledby="hit-title hit-desc" font-family="system-ui, sans-serif" font-size="18" fill="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title id="hit-title">Vertical, choker and basket hitches</title>
  <desc id="hit-desc">Three ways to rig one sling. Vertical: one sling leg straight from hook to load, rated at the sling's vertical capacity. Choker: the sling wraps the load and chokes through its own eye; capacity is less than vertical and drops further as the choke angle tightens. Basket: the sling cradles the load with both eyes on the hook; with vertical legs it can carry up to twice the vertical rating, less as the legs angle out. Balance basket loads to prevent slippage, and use the rating on the sling tag.</desc>
  <style>svg:root{color:#111}@media (prefers-color-scheme:dark){svg:root{color:#eee}}</style>

  <!-- vertical -->
  <line x1="80" y1="30" x2="80" y2="62" stroke="currentColor" stroke-width="2"/>
  <circle cx="80" cy="70" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <line x1="80" y1="78" x2="80" y2="164" stroke="var(--crane-accent, #d97706)" stroke-width="6"/>
  <circle cx="80" cy="168" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="48" y="174" width="64" height="50" rx="3" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.35" stroke="currentColor" stroke-width="2.5"/>

  <!-- choker -->
  <line x1="240" y1="30" x2="240" y2="62" stroke="currentColor" stroke-width="2"/>
  <circle cx="240" cy="70" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="240" cy="196" r="30" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.35" stroke="currentColor" stroke-width="2.5"/>
  <line x1="240" y1="78" x2="240" y2="160" stroke="var(--crane-accent, #d97706)" stroke-width="6"/>
  <circle cx="240" cy="196" r="35" fill="none" stroke="var(--crane-accent, #d97706)" stroke-width="6"/>
  <circle cx="240" cy="161" r="6" fill="var(--crane-accent, #d97706)" stroke="currentColor" stroke-width="2"/>

  <!-- basket -->
  <line x1="400" y1="30" x2="400" y2="62" stroke="currentColor" stroke-width="2"/>
  <circle cx="400" cy="70" r="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="400" cy="196" r="30" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.35" stroke="currentColor" stroke-width="2.5"/>
  <path d="M394 78 L365 196 A35 35 0 0 0 435 196 L406 78" fill="none" stroke="var(--crane-accent, #d97706)" stroke-width="6"/>

  <g text-anchor="middle" font-size="20" font-weight="700">
    <text x="80" y="266">Vertical</text>
    <text x="240" y="266">Choker</text>
    <text x="400" y="266">Basket</text>
  </g>

  <!-- relative capacity -->
  <line x1="8" y1="286" x2="472" y2="286" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="240" y="316" text-anchor="middle" font-weight="700">Capacity compared with vertical</text>
  <text x="24" y="352">Vertical</text>
  <rect x="120" y="335" width="110" height="24" rx="3" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.6"/>
  <text x="240" y="352">1×</text>
  <text x="24" y="392">Choker</text>
  <rect x="120" y="375" width="80" height="24" rx="3" fill="var(--crane-muted, #8a8f98)" fill-opacity="0.35" stroke="var(--crane-muted, #8a8f98)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="210" y="392">less than 1×</text>
  <text x="24" y="432">Basket</text>
  <rect x="120" y="415" width="220" height="24" rx="3" fill="var(--crane-accent, #d97706)" fill-opacity="0.6"/>
  <text x="350" y="432">up to 2×</text>

  <line x1="8" y1="462" x2="472" y2="462" stroke="var(--crane-muted, #8a8f98)" stroke-width="1" stroke-opacity="0.6"/>
  <text x="24" y="490">Choker: tighter choke, lower rating.</text>
  <text x="24" y="514">Basket: 2× only with vertical legs.</text>
  <text x="24" y="538">Balance basket loads so they can't slip.</text>
  <text x="24" y="562" font-weight="700">Use the rating on the sling tag.</text>
</svg>
