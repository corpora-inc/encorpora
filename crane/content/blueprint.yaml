coverage_notes:
  - The construction rigging rule 29 CFR 1926.251 (Subpart H) is not in the corpus yet; rigging skills cite 1910.184 and Subpart CC. Add 1926.251 to the corpus registry to cover construction sling rules directly.
  - '"Critical lift" is an industry term (lift planning practice and consensus standards cited by number only). Subpart CC regulates multiple-crane lifts and hoisting personnel; critical-lift content says so and does not invent a federal definition.'
  - Sling angle factors, ground bearing pressure and load-chart arithmetic are physics and practice, not regulation; items teach them as such and cite rules only where a rule applies.
