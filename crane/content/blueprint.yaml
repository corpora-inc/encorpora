# Crane pack blueprint: what the pack teaches, tests and walks people through.
#
# topics  -> the course tree (Learn), each with summary and governing sections
# skills  -> the units the practice engine tracks (harvest/practice evidence model);
#            every question, lesson and answer is tagged with one or more skill_ids
# exams   -> the written-exam blueprint our practice mirrors, verified against the
#            current candidate handbook (see exams[].source). Our items are original
#            practice, written from the federal rules; no affiliation with or
#            endorsement by the certifying body or OSHA is implied.
#
# section_ids follow harvest/CONTRACT.md citation paths ('29cfr1926.1408(a)(2)').
# Appendices: '29cfr1926.cc.appA' (B, C likewise). Tables live in their section's text.
# verify/verify.py checks every section_id here against the eCFR text.
#
# Skill kinds: knowledge (recall/apply a rule), calc (exact arithmetic; deterministic
# generators), procedure (a field sequence; maps to procedures/*.yaml), judgment
# (recognize a hazard or choose an action from a scenario).
# Levels: which roles the skill matters to (trainee, operator, inspector). The app
# filters depth by role; all roles can practice everything.

blueprint_version: 1
lang: en
ecfr:
  up_to_date_as_of: "2026-11-24"
  api: https://www.ecfr.gov/api/versioner/v1
  parts: ["29 CFR 1926 Subpart CC (1926.1400-1926.1443, Appendices A-C)", "29 CFR 1910.179", "29 CFR 1910.180", "29 CFR 1910.184"]

exams:
  - exam_id: mobile-core
    title: Mobile crane operator written exam, core (style)
    items: 95
    minutes: 90
    calculator: false
    format: 4-choice multiple choice
    domains:
      - {domain_id: core.site, title: Site, weight: 0.22}
      - {domain_id: core.ops, title: Operations, weight: 0.28}
      - {domain_id: core.tech, title: Technical Knowledge, weight: 0.23}
      - {domain_id: core.lc, title: Load Charts, weight: 0.27}
    outline:
      core.site.1: Elements that affect ground stability (below surface, on surface, boom position)
      core.site.2: Proper use of supporting materials (mats, blocking/cribbing)
      core.site.3: Electric power line hazards during assembly/disassembly
      core.site.4: Requirements to travel without load
      core.site.5: Hazards of access to set-up location, pinch/crush points, personnel
      core.site.6: Controlling entity responsibilities for site conditions
      core.ops.1: Unsafe operating conditions
      core.ops.2: Leveling the crane
      core.ops.3: Verifying load dimensions, weight and center of gravity
      core.ops.4: Determining and verifying radius
      core.ops.5: Power line hazards and mitigation during travel, operations, assembly/disassembly
      core.ops.6: Wire rope reeving and parts of line
      core.ops.7: Hand, voice, audible and new or non-standard signals
      core.ops.8: Specialty operations (multi-crane, suspended personnel platforms, duty cycle, barge, multi-drum)
      core.ops.9: Lifting loads from beneath the surface of the water
      core.ops.10: Tag lines
      core.ops.11: The fall zone
      core.ops.12: Operator aids (LMI/limiters/load weighing, anti-two-block, boom angle, wind, drum rotation, radius)
      core.ops.13: Alternative procedures when operator aids malfunction
      core.ops.14: Safety devices (horn, level indicator)
      core.ops.15: Emergency procedures (power line contact, control malfunction, travel malfunction, two-blocking, overloading, fire)
      core.ops.16: Dynamic loading (shock loading, duty cycle, rapid loss of load, loss of backward stability)
      core.ops.17: Side loading
      core.ops.18: Boom deflection
      core.ops.19: Weather (wind, temperature, wave action)
      core.ops.20: Manufacturer-approved attachments
      core.ops.21: Operator authority to stop operations
      core.ops.22: Shutdown and securing when unattended
      core.tech.1: Federal regulations and industry standards (B30.5, B30.10, 1910.180, 1926 Subpart CC)
      core.tech.2: Crane terminology and definitions
      core.tech.3: Functions and limitations of cranes and attachments
      core.tech.4: Shift, monthly and annual inspections; reporting deficiencies
      core.tech.5: Rigging devices (slings, softeners, lifting beams, shackles)
      core.tech.6: Wire rope terminations
      core.tech.7: Hook blocks and overhaul balls
      core.tech.8: Wire rope types, replacement criteria, inspection, lubrication
      core.tech.9: Protective measures against electrical hazards and their limits
      core.tech.10: Instruments and gauges
      core.tech.11: Fall protection during assembly/disassembly/maintenance
      core.tech.12: Access and egress
      core.tech.13: Personnel safety during inspections
      core.tech.14: Fall protection requirements
      core.tech.15: Access and egress requirements
      core.lc.1: Load chart terminology
      core.lc.2: Arithmetic (no calculator)
      core.lc.3: Selecting the right chart for the configuration
      core.lc.4: Rated capacity chart, range diagram, work area chart, parts-of-line, boom angle limits
      core.lc.5: Optimizing configuration
  - exam_id: mobile-specialty
    title: Mobile crane operator written exam, specialty (style; telescopic fixed cab, telescopic swing cab, lattice boom)
    items: 28
    minutes: 60
    calculator: true
    format: 4-choice multiple choice, load-chart heavy, chart supplied
    domains:
      - {domain_id: spec.site, title: Site, weight: 0.23}
      - {domain_id: spec.ops, title: Operations, weight: 0.23}
      - {domain_id: spec.tech, title: Technical Knowledge, weight: 0.19}
      - {domain_id: spec.lc, title: Manufacturers' Load Charts, weight: 0.35}
    outline:
      spec.site.1: Supporting materials (mats, blocking/cribbing)
      spec.site.2: Boom assembly/disassembly (lattice, telescopic, extensions/jibs)
      spec.site.3: Outriggers/stabilizers and crawlers
      spec.site.4: Outrigger position indicators/sensors
      spec.ops.1: Operating stationary on rubber, on outriggers, on crawlers
      spec.ops.2: Pick and carry on rubber and on crawlers
      spec.ops.3: Shutdown and securing, lattice and telescopic
      spec.ops.4: Boom length indicators, boom hoist limiting, luffing jib limiting devices
      spec.ops.5: Boom stops, brake locks, jib stops
      spec.ops.6: Power flow systems
      spec.ops.7: Approaching two-blocking, telescopic and lattice
      spec.tech.1: Terminology specific to crane types
      spec.tech.2: Functions, limitations and attachments by crane type
      spec.tech.3: Wire rope replacement and inspection (standing ropes)
      spec.lc.1: Chart notes, specifications, range diagram, work area diagram, erection charts, rated capacity charts
      spec.lc.2: Maximum radius, gross capacity and net capacity in various configurations
      spec.lc.3: Maximum line pull vs safe working load of running ropes
  - exam_id: service-truck
    title: Service truck crane operator written exam (style)
    items: 80
    minutes: 90
    calculator: false
    domains:
      - {domain_id: stc.site, title: Site, weight: 0.17}
      - {domain_id: stc.ops, title: Operations, weight: 0.45}
      - {domain_id: stc.tech, title: Technical Knowledge, weight: 0.21}
      - {domain_id: stc.lc, title: Manufacturers' Load Charts, weight: 0.17}
    note: Covered by the same skills; no separate outline mapping in v1.
exam_source:
  title: Candidate Handbook, Mobile Crane Operator (LAT, TLL, TSS, STC)
  publisher: CCO (the certifying body formerly published as NCCCO; nccco.org now redirects to ccocert.org)
  edition: "MCO CH REV 06/24 (page footers), DOC 50014-102; cover reads MCO CH REV 01/25; PDF modified 2024-11-14"
  url: https://ccocert.org/wp-content/uploads/2026/06/mobile-crane-operator-candidate-handbook_111424-en.pdf
  sha256: 51b0e67f7e250c763dc1a1c47b611bf4a9bc0b1ec24e910a8e7965573b8dd31f
  retrieved_at: "2026-11-27"
  verified: >-
    Core: 95 questions, 90 minutes, calculator not permitted; domains Site 22%, Operations 28%,
    Technical Knowledge 23%, Load Charts 27%. Specialty (TSS, TLL, LAT): 28 questions, 60 minutes,
    calculator permitted; Site 23%, Operations 23%, Technical Knowledge 19%, Manufacturers' Load
    Charts 35%. Service truck: 80 questions, 90 minutes, calculator not permitted; 17/45/21/17%.
    The certifier's web page (ccocert.org/en/certifications/mobile-crane-operator/, read
    2026-11-27) lists the core as 95 questions / 90 minutes with different weights
    (Site 20%, Operations 26%, Technical Knowledge 28%, Load Charts 26%); the handbook PDF above
    is the document of record here. Recheck both before each release.
  reference_list: [ASME B30.5 (2021), ASME B30.30 (2019), IHSA Mobile Crane Manual (2017), AEM Mobile Crane Safety Manual (2014), OSHA 1926 Subpart CC, OSHA 1910.180, IPT Crane and Rigging Handbook (2020)]
  copyright_note: ASME B30 and the other references are copyrighted; cite by number only, never copy.

# Variant awareness (CONTRACT `equipment` table). Skills and procedures carry `equipment`
# when they apply only to some machines; no `equipment` means all.
equipment:
  - {equip_id: mobile, name: Mobile crane, aliases: [crane, mobile crane]}
  - {equip_id: tele-swing, parent_id: mobile, name: Telescopic boom crane, swing cab, aliases: [hydraulic truck crane, all-terrain, AT, truck crane, hydro, TLL]}
  - {equip_id: rough-terrain, parent_id: tele-swing, name: Rough-terrain crane, aliases: [RT, cherry picker, rough terrain]}
  - {equip_id: tele-fixed, parent_id: mobile, name: Telescopic boom crane, fixed cab, aliases: [boom truck, fixed cab, TSS, stinger]}
  - {equip_id: lattice, parent_id: mobile, name: Lattice boom crane, aliases: [stick crane, conventional, friction crane, LAT]}
  - {equip_id: crawler, parent_id: lattice, name: Lattice boom crawler crane, aliases: [crawler, tracked crane]}
  - {equip_id: lattice-truck, parent_id: lattice, name: Lattice boom truck crane, aliases: [truck-mounted lattice]}
  - {equip_id: articulating, parent_id: mobile, name: Articulating (knuckle-boom) crane, aliases: [knuckle boom, knuckleboom, loader crane]}
  - {equip_id: service-truck, parent_id: mobile, name: Service truck crane, aliases: [mechanic's truck, service crane]}
  - {equip_id: locomotive, parent_id: mobile, name: Locomotive crane, aliases: [rail crane]}
  - {equip_id: tower, name: Tower crane, aliases: [tower, hammerhead, luffer, self-erector]}
  - {equip_id: overhead, name: Overhead and gantry crane, aliases: [bridge crane, overhead crane, gantry, semigantry, EOT crane]}
  - {equip_id: derrick, name: Derrick, aliases: [guy derrick, stiffleg, gin pole, A-frame]}
  - {equip_id: floating, name: Floating crane or crane on a barge, aliases: [barge crane, floating derrick]}
  - {equip_id: sideboom, name: Sideboom crane, aliases: [pipelayer, sideboom]}

topics:
  # ------------------------------------------------------------------ 1
  - topic_id: rules
    ord: 1
    title: The rules and who they cover
    summary: Which federal crane rules apply where, what equipment they cover and exclude, and how to read a citation.
    section_ids: ["29cfr1926.1400", "29cfr1926.1401", "29cfr1910.179(a)", "29cfr1910.180(a)", "29cfr1910.184(a)"]
    skills:
      - {skill_id: rules.scope, title: Know what equipment Subpart CC covers, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1400(a)", "29cfr1926.1400(b)"], exam: [core.tech.1]}
      - {skill_id: rules.exclusions, title: Recognize equipment and uses excluded from Subpart CC, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1400(c)"], exam: [core.tech.1]}
      - {skill_id: rules.construction-vs-general, title: Tell construction (1926 Subpart CC) from general industry (1910.179, .180, .184), kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1400", "29cfr1910.179", "29cfr1910.180", "29cfr1910.184"], exam: [core.tech.1]}
      - {skill_id: rules.definitions, title: Use the defined terms precisely, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1401"], exam: [core.tech.2]}
      - {skill_id: rules.controlling-entity, title: Know the controlling entity's duties, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1400(e)", "29cfr1926.1402(c)", "29cfr1926.1424(a)(2)"], exam: [core.site.6]}
      - {skill_id: rules.standards, title: Place consensus standards (ASME B30 series) alongside the federal rules, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1433(b)"], exam: [core.tech.1]}
      - {skill_id: rules.b30-roles-and-language, title: "The consensus-standard responsibility model (owner, user, site supervisor, lift director, operator), shall and should, and which standard covers hooks", kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1433", "29cfr1926.1401"], exam: [core.tech.1, core.ops.21]}

  # ------------------------------------------------------------------ 2
  - topic_id: roles
    ord: 2
    title: People, qualifications and authority
    summary: Operator certification and evaluation, signal person and rigger qualification, competent vs qualified persons, A/D and lift directors, training, and the authority to stop.
    section_ids: ["29cfr1926.1427", "29cfr1926.1428", "29cfr1926.1429", "29cfr1926.1430", "29cfr1926.1418", "29cfr1926.1401"]
    skills:
      - {skill_id: roles.competent-vs-qualified, title: Distinguish competent person, qualified person and qualified rigger, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1401", "29cfr1926.1404(r)(1)", "29cfr1926.1425(c)(3)"], exam: [core.tech.2]}
      - {skill_id: roles.operator-certification, title: Know the operator certification options and what certification covers, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1427(a)", "29cfr1926.1427(b)", "29cfr1926.1427(d)", "29cfr1926.1427(e)", "29cfr1926.1427(j)"], exam: [core.tech.1]}
      - {skill_id: roles.operator-evaluation, title: Know the employer's evaluation and documentation duties, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1427(f)"], exam: [core.tech.1]}
      - {skill_id: roles.operator-in-training, title: Apply the operator-in-training conditions, kind: knowledge, levels: [trainee, operator], section_ids: ["29cfr1926.1427(a)(1)"], exam: [core.tech.1]}
      - {skill_id: roles.signal-person-qualification, title: Know signal person qualification requirements, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1428(a)", "29cfr1926.1428(c)"], exam: [core.ops.7]}
      - {skill_id: roles.training, title: Know required training topics (power lines, signals, crush/pinch points, tag-out), kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1430"], exam: [core.tech.1]}
      - {skill_id: roles.authority-to-stop, title: Apply the operator's authority and duty to stop, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1418", "29cfr1926.1417(y)"], exam: [core.ops.21]}
      - {skill_id: roles.ad-director, title: Know the A/D director's role, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1404(a)", "29cfr1926.1401"], exam: [spec.site.2]}
      - {skill_id: roles.maintenance-operators, title: Know when maintenance and inspection personnel may operate, kind: knowledge, levels: [inspector], section_ids: ["29cfr1926.1429"], exam: [core.tech.13]}
      - {skill_id: roles.language-literacy, title: Apply the language and literacy provisions, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1427(h)"], exam: [core.tech.1]}

  # ------------------------------------------------------------------ 3
  - topic_id: site
    ord: 3
    title: Site, ground and set-up
    summary: Ground conditions and who must provide them, mats and cribbing, outriggers and leveling, swing-radius barricades, the fall zone and keeping people clear.
    section_ids: ["29cfr1926.1402", "29cfr1926.1404(q)", "29cfr1926.1424", "29cfr1926.1425", "29cfr1926.1415(a)(1)"]
    skills:
      - {skill_id: site.ground-conditions, title: Judge ground conditions as firm, drained and graded, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1402(a)", "29cfr1926.1402(b)"], exam: [core.site.1]}
      - {skill_id: site.hazards-below-surface, title: Identify voids, tanks, utilities and loose fill, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1402(e)"], exam: [core.site.1]}
      - {skill_id: site.controlling-entity-ground, title: Know who must ensure and disclose ground conditions, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1402(c)", "29cfr1926.1402(d)", "29cfr1926.1402(e)"], exam: [core.site.6, core.site.1]}
      - {skill_id: site.supporting-materials, title: Use mats, blocking and cribbing correctly, kind: procedure, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1402(a)", "29cfr1926.1402(b)"], exam: [core.site.2, spec.site.1]}
      - {skill_id: site.ground-bearing, title: Compute outrigger ground bearing pressure (force over area), kind: calc, levels: [operator, inspector], section_ids: ["29cfr1926.1402(b)"], exam: [core.site.1, core.lc.2, core.site.2]}
      - {skill_id: site.outriggers, title: Deploy outriggers and stabilizers per the manufacturer, kind: procedure, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1404(q)", "29cfr1926.1415(a)(5)"], exam: [spec.site.3]}
      - {skill_id: site.outrigger-sensors, title: Know outrigger position sensor requirements, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1416(e)(5)(i)"], exam: [spec.site.4]}
      - {skill_id: site.leveling, title: Level the crane and know why level matters, kind: procedure, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1415(a)(1)"], exam: [core.ops.2, core.ops.14]}
      - {skill_id: site.swing-radius, title: Barricade the swing radius of the rotating superstructure, kind: procedure, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1424(a)"], exam: [core.site.5]}
      - {skill_id: site.fall-zone, title: Define the fall zone and keep people out of it, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1401", "29cfr1926.1425"], exam: [core.ops.11, core.site.5]}
      - {skill_id: site.keeping-clear, title: Apply the rules for hooking, guiding and receiving loads, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1425(b)", "29cfr1926.1425(c)", "29cfr1926.1425(d)"], exam: [core.ops.11, core.site.5]}
      - {skill_id: site.access-hazards, title: Recognize access, pinch and crush hazards at set-up, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1424(a)", "29cfr1926.1430(e)"], exam: [core.site.5]}
      - {skill_id: site.travel-without-load, title: Travel the crane safely without a load, kind: knowledge, levels: [operator], section_ids: ["29cfr1926.1411", "29cfr1926.1417(u)"], exam: [core.site.4]}
      - {skill_id: site.multiple-cranes-area, title: Coordinate when cranes' working radii overlap, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1424(b)"], exam: [core.ops.8]}
      - {skill_id: site.slopes-excavations, title: "Judge set-back from excavations, trenches, walls, slopes and fresh backfill; when a qualified person decides", kind: judgment, levels: [operator], section_ids: ["29cfr1926.1402(e)", "29cfr1926.1402"], exam: [core.site.1]}
      - {skill_id: site.boom-position-loading, title: "Which outrigger or track carries the most load as the boom swings and booms down", kind: calc, levels: [operator], section_ids: ["29cfr1926.1402", "29cfr1926.1417(r)"], exam: [core.site.1, core.site.2]}

  # ------------------------------------------------------------------ 4
  - topic_id: powerlines
    ord: 4
    title: Power lines
    summary: The work zone, the 20-foot rule and Table A, encroachment prevention, voltage information, working closer than Table A, traveling under lines, and what to do on contact.
    section_ids: ["29cfr1926.1407", "29cfr1926.1408", "29cfr1926.1409", "29cfr1926.1410", "29cfr1926.1411", "29cfr1910.180(j)"]
    skills:
      - {skill_id: powerlines.work-zone, title: Define the work zone (demarcated or 360 degrees to maximum working radius), kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(a)(1)"], exam: [core.ops.5]}
      - {skill_id: powerlines.twenty-foot-check, title: Decide whether any part could get within 20 feet, kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(a)(2)"], exam: [core.ops.5]}
      - {skill_id: powerlines.options, title: Choose among deenergize-and-ground, 20-foot clearance and Table A clearance, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1408(a)(2)(i)", "29cfr1926.1408(a)(2)(ii)", "29cfr1926.1408(a)(2)(iii)"], exam: [core.ops.5]}
      - {skill_id: powerlines.table-a, title: Read Table A minimum clearance by voltage, kind: calc, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408"], exam: [core.ops.5, core.tech.9]}
      - {skill_id: powerlines.over-350kv, title: Apply the over-350 kV rules (50 feet up to 1,000 kV; utility or engineer above), kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1409(a)", "29cfr1926.1409(b)"], exam: [core.ops.5]}
      - {skill_id: powerlines.encroachment-measures, title: Set up the encroachment prevention measures (meeting, nonconductive tag lines, warning line, plus one more), kind: procedure, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(b)"], exam: [core.ops.5, core.tech.9]}
      - {skill_id: powerlines.dedicated-spotter, title: Know the dedicated spotter's duties and qualification, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(b)(4)(ii)", "29cfr1926.1401"], exam: [core.ops.5]}
      - {skill_id: powerlines.voltage-and-energized, title: Get voltage from the utility; treat lines as energized until confirmed and grounded, kind: knowledge, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(c)", "29cfr1926.1408(e)"], exam: [core.ops.5]}
      - {skill_id: powerlines.below-lines, title: Know the limits on operating and assembling below power lines, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1408(d)", "29cfr1926.1407(c)"], exam: [core.ops.5, core.site.3]}
      - {skill_id: powerlines.assembly, title: Assemble and disassemble near power lines, kind: procedure, levels: [operator, inspector], section_ids: ["29cfr1926.1407"], exam: [core.site.3, core.ops.5]}
      - {skill_id: powerlines.closer-than-table-a, title: Know the conditions for work closer than Table A, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1410"], exam: [core.ops.5]}
      - {skill_id: powerlines.travel, title: Travel under or near power lines with no load, kind: knowledge, levels: [operator], section_ids: ["29cfr1926.1411"], exam: [core.ops.5, core.site.4]}
      - {skill_id: powerlines.contact-emergency, title: Respond to power line contact (operator stays on, others stay away), kind: judgment, levels: [trainee, operator, inspector], section_ids: ["29cfr1926.1408(g)"], exam: [core.ops.15]}
      - {skill_id: powerlines.protective-limits, title: Know the limits of insulating links, proximity alarms and range limiters, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1408(b)(4)", "29cfr1926.1408(h)"], exam: [core.tech.9]}
      - {skill_id: powerlines.towers, title: Handle induced current near transmitter towers, kind: knowledge, levels: [operator], section_ids: ["29cfr1926.1408(f)"], exam: [core.tech.9]}
      - {skill_id: powerlines.general-industry, title: Know the general industry overhead line rule, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1910.180(j)"], exam: [core.tech.1]}
      - {skill_id: powerlines.training, title: Know what power line training must cover, kind: knowledge, levels: [operator, inspector], section_ids: ["29cfr1926.1408(g)", "29cfr1926.1430(a)"], exam: [core.tech.9]}

  # ------------------------------------------------------------------ 5
  - topic_id: signals
    ord: 5
    title: Signals
    summary: When a signal person is required, hand signals (Appendix A), radio and voice signals, new signals, one signaler at a time, and stop signals from anyone.
    section_ids: ["29cfr1926.1419", "29cfr1926.1420", "29cfr1926.1421", "29cfr1926.1422", "29cfr1926.cc.appA"]
