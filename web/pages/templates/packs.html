<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpán Packs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #171717;
            background: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .breadcrumb {
            font-size: 0.875rem;
            color: #737373;
            margin-bottom: 3rem;
        }

        .breadcrumb a {
            color: #171717;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        .breadcrumb a:hover {
            opacity: 0.7;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            padding-bottom: 2rem;
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            display: block;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #171717;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .tagline {
            font-size: 1.125rem;
            color: #737373;
            font-weight: 400;
        }

        .packs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .game-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            border-color: #171717;
            transform: translateY(-2px);
        }

        .game-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .game-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .game-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #171717;
            letter-spacing: -0.01em;
        }

        .game-version {
            font-size: 0.75rem;
            color: #a3a3a3;
            margin-top: 0.25rem;
        }

        .game-description {
            color: #737373;
            font-size: 0.9375rem;
            margin-bottom: 1rem;
            line-height: 1.6;
            flex-grow: 1;
        }

        .game-status {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .status-prototype {
            background: #f5f5f5;
            color: #171717;
        }

        .status-active {
            background: #171717;
            color: #ffffff;
        }

        .status-beta {
            background: #f5f5f5;
            color: #171717;
        }

        .game-actions {
            display: flex;
            gap: 0.625rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .game-button {
            flex: 1;
            padding: 0.75rem 1rem;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 100px;
        }

        .button-primary {
            background: #171717;
            color: #ffffff;
        }

        .button-primary:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .button-secondary {
            background: #ffffff;
            color: #171717;
            border: 1px solid #e5e5e5;
        }

        .button-secondary:hover {
            border-color: #171717;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #737373;
        }

        .empty-state p {
            font-size: 1rem;
        }

        footer {
            margin-top: 6rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            color: #737373;
            font-size: 0.875rem;
        }

        footer a {
            color: #171717;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        footer a:hover {
            opacity: 0.7;
        }

        @media (max-width: 640px) {
            .logo {
                width: 80px;
                height: 80px;
            }

            h1 {
                font-size: 2rem;
            }

            .packs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17513523888"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17513523888');
    </script>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="{{BASE_PATH}}">← encorpora.io</a> / <a href="{{BASE_PATH}}corpan/">Corpán</a>
        </div>

        <header>
            <div class="logo-container">
                <img src="{{BASE_PATH}}assets/logo-512.png" alt="Corpán" class="logo">
            </div>
            <h1>Corpán Packs</h1>
            <p class="tagline">Interactive language learning packs</p>
        </header>

        <main>
            <div class="packs-grid" id="packs-container">
                <!-- Packs will be inserted here by JavaScript -->
            </div>
        </main>

        <footer>
            <p>
                <a href="https://github.com/corpora-inc/encorpora/tree/main/corpan/packs" target="_blank" rel="noopener">
                    Packs on GitHub
                </a>
                ·
                <a href="https://github.com/corpora-inc/encorpora/tree/main/corpan/packs/sdk" target="_blank" rel="noopener">
                    Pack SDK
                </a>
            </p>
        </footer>
    </div>

    <script>
        const packs = {{PACKS_DATA}};
        const container = document.getElementById('packs-container');

        if (packs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <p>No packs available yet. Check back soon!</p>
                </div>
            `;
        } else {
            packs.forEach(pack => {
                const card = document.createElement('div');
                card.className = 'game-card';

                const statusClass = 'status-' + pack.status;
                const avatarUrl = pack.avatarUrl || '';

                let imageHtml = '';
                if (avatarUrl) {
                    imageHtml = `<img src="${avatarUrl}" alt="${pack.name}" class="game-image">`;
                }

                let actionsHtml = '<div class="game-actions">';
                if (pack.landingUrl) {
                    actionsHtml += `<a href="${pack.landingUrl}" class="game-button button-primary">View Details</a>`;
                }
                const downloadUrl = pack.zipUrl || pack.manifestUrl;
                if (downloadUrl) {
                    actionsHtml += `<a href="${downloadUrl}" class="game-button button-secondary">Download Pack</a>`;
                }
                if (pack.github) {
                    actionsHtml += `<a href="${pack.github}" target="_blank" rel="noopener" class="game-button button-secondary">GitHub ↗</a>`;
                }
                actionsHtml += '</div>';

                card.innerHTML = `
                    ${imageHtml}
                    <div class="game-content">
                        <div class="game-header">
                            <div>
                                <div class="game-name">${pack.name}</div>
                                <div class="game-version">v${pack.version}</div>
                            </div>
                        </div>
                        <div class="game-description">${pack.description}</div>
                        <span class="game-status ${statusClass}">${pack.status}</span>
                        ${actionsHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
