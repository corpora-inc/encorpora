<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpán Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.2rem;
            color: #666;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .game-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 2rem;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .game-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .game-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .game-version {
            font-size: 0.85rem;
            color: #999;
            font-weight: normal;
        }

        .game-description {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .game-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .status-prototype {
            background: #fbbf24;
            color: white;
        }

        .status-active {
            background: #4ade80;
            color: white;
        }

        .status-beta {
            background: #60a5fa;
            color: white;
        }

        .game-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .game-button {
            flex: 1;
            padding: 0.75rem 1rem;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            min-width: 100px;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .button-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .button-secondary:hover {
            background: #f5f7fa;
        }

        .game-meta {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85rem;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <a href="../../">← Encorpora</a> / <a href="../">Corpán</a> / Games
        </div>

        <header>
            <h1>🎮 Corpán Games</h1>
            <p class="tagline">Interactive language learning games</p>
        </header>

        <main>
            <div class="games-grid" id="games-container">
                <!-- Games will be inserted here by JavaScript -->
            </div>
        </main>

        <footer>
            <p>
                <a href="https://github.com/corpora-inc/encorpora/tree/main/corpan/games" target="_blank" rel="noopener">
                    View Games on GitHub
                </a>
                |
                Want to create a game? Check out the <a href="https://github.com/corpora-inc/encorpora/tree/main/corpan/games/sdk" target="_blank" rel="noopener">Game SDK</a>
            </p>
        </footer>
    </div>

    <script>
        // Games data will be injected here
        const games = {{GAMES_DATA}};

        const container = document.getElementById('games-container');

        if (games.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎮</div>
                    <p>No games available yet. Check back soon!</p>
                </div>
            `;
        } else {
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';

                const statusClass = 'status-' + game.status;

                let actionsHtml = '<div class="game-actions">';
                if (game.playUrl) {
                    actionsHtml += `<a href="${game.playUrl}" class="game-button button-primary">Play →</a>`;
                }
                if (game.manifestUrl) {
                    actionsHtml += `<a href="${game.manifestUrl}" class="game-button button-secondary">Manifest</a>`;
                }
                if (game.github) {
                    actionsHtml += `<a href="${game.github}" target="_blank" rel="noopener" class="game-button button-secondary">GitHub ↗</a>`;
                }
                actionsHtml += '</div>';

                card.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-header">
                        <div class="game-name">${game.name}</div>
                    </div>
                    <div class="game-description">${game.description}</div>
                    <span class="game-status ${statusClass}">${game.status}</span>
                    ${actionsHtml}
                    <div class="game-meta">
                        Version ${game.version}
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
