<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encorpora - Open Educational Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.2rem;
            color: #666;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .app-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 8px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .app-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .app-description {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .app-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #4ade80;
            color: white;
        }

        .app-links {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .app-link {
            font-size: 0.85rem;
            color: #667eea;
            text-decoration: none;
            padding: 0.25rem 0.75rem;
            border: 1px solid #667eea;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .app-link:hover {
            background: #667eea;
            color: white;
        }

        footer {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e0e0e0;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Encorpora</h1>
            <p class="tagline">Open educational content for language learning and beyond</p>
        </header>

        <main>
            <h2 style="margin-bottom: 1.5rem; color: #333;">Apps & Projects</h2>
            <div class="apps-grid" id="apps-container">
                <!-- Apps will be inserted here by JavaScript -->
            </div>
        </main>

        <footer>
            <p>
                <a href="https://github.com/corpora-inc/encorpora" target="_blank" rel="noopener">
                    View on GitHub
                </a>
                |
                Open Source Educational Content
            </p>
        </footer>
    </div>

    <script>
        // Apps data will be injected here
        const apps = {{APPS_DATA}};

        const container = document.getElementById('apps-container');

        apps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';

            const statusClass = app.status === 'active' ? 'status-active' : 'status-' + app.status;

            let linksHtml = '';
            if (app.links) {
                linksHtml = '<div class="app-links">';
                if (app.links.games) {
                    linksHtml += `<a href="${app.links.games}" class="app-link">Games →</a>`;
                }
                if (app.links.github) {
                    linksHtml += `<a href="${app.links.github}" target="_blank" rel="noopener" class="app-link">GitHub ↗</a>`;
                }
                linksHtml += '</div>';
            }

            card.innerHTML = `
                <div class="app-icon">${app.icon}</div>
                <div class="app-name">${app.name}</div>
                <div class="app-description">${app.description}</div>
                <span class="app-status ${statusClass}">${app.status}</span>
                ${linksHtml}
            `;

            if (app.links && app.links.games) {
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('app-link')) {
                        window.location.href = app.links.games;
                    }
                });
            }

            container.appendChild(card);
        });
    </script>
</body>
</html>
