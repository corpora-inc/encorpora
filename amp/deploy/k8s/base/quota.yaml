# AMP can never take more than this from the shared cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: amp-quota
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
    pods: "24"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: amp-defaults
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
