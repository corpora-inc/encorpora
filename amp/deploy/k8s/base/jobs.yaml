# Daily: expired trials, export tickets, audit events and offline packs.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amp-privacy-retention
spec:
  schedule: "17 7 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: amp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: job
              image: ${AMP_API_IMAGE}
              command: ["node_modules/.bin/tsx", "scripts/privacy-retention.ts"]
              envFrom:
                - configMapRef: { name: amp-config }
                - secretRef: { name: amp-env }
              resources:
                requests: { cpu: 50m, memory: 192Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }]
---
