# One host: /api/* to the API, everything else to the web app. TLS from
# cert-manager (namespaced Issuer, HTTP-01), as the rest of the cluster does.
# cert-manager inserts challenge rules into this Ingress while it renews, so
# deploys create it only when absent and never re-apply it (see render.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amp
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: ${AMP_STATIC_IP_NAME}
    cert-manager.io/issuer: amp-letsencrypt
    acme.cert-manager.io/http01-edit-in-place: "true"
    networking.gke.io/v1beta1.FrontendConfig: amp
spec:
  tls:
    - hosts: ["${AMP_HOSTNAME}"]
      secretName: amp-tls
  rules:
    - host: ${AMP_HOSTNAME}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: amp-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: amp-web, port: { number: 80 } }
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: amp
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: amp-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${AMP_ACME_EMAIL}
    privateKeySecretRef:
      name: amp-letsencrypt-account
    solvers:
      - http01:
          ingress:
            name: amp
