<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#154d49" />
    <title>AMP: Adaptive Math Pathways, a complete math curriculum</title>
    <meta
      name="description"
      content="A complete math curriculum, from counting to precalculus. AMP finds your child’s level and chooses each next problem, with lessons and printable workbooks built in."
    />
    <!--amp-product-social-start-->
    <!-- The signed-out pitch at `/`, for link previews that do not run the
      app. This file is served for every route, so it has no canonical link:
      the router writes the canonical, title, description and these tags per
      route. The build adds the generated share card's image tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AMP · Adaptive Math Pathways" />
    <meta property="og:title" content="AMP: Adaptive Math Pathways, a complete math curriculum" />
    <meta property="og:description" content="A complete math curriculum, from counting to precalculus. AMP finds your child’s level and chooses each next problem, with lessons and printable workbooks built in." />
    <meta property="og:url" content="https://amp.corpora.inc/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AMP: Adaptive Math Pathways, a complete math curriculum" />
    <meta name="twitter:description" content="A complete math curriculum, from counting to precalculus. AMP finds your child’s level and chooses each next problem, with lessons and printable workbooks built in." />
    <!--amp-product-social-end-->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f6f0;
        color: #183e3a;
        font-family: system-ui, sans-serif;
      }
      .app-loading {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 24px;
        background: var(--color-surface, #f7f6f0);
        color: var(--color-on-surface, #183e3a);
      }
      .app-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        min-width: 0;
        max-width: 100%;
      }
      .app-loading-mark {
        display: block;
        flex: none;
        width: 56px;
        height: 36px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        color: var(--color-primary, #1f5f55);
        overflow: hidden;
        mask-image: linear-gradient(
          90deg,
          transparent,
          #000 12%,
          #000 88%,
          transparent
        );
      }
      /* One full wavelength per loop, so its endpoints join without a jump. */
      @keyframes amp-loading-wave {
        to {
          transform: translateX(-24px);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-loading[aria-busy="true"] .app-loading-wave {
          animation: amp-loading-wave 1.8s linear infinite;
        }
      }
      .app-loading-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .app-loading-body p {
        margin: 0;
        max-width: 32ch;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #122522;
          color: #e9f0e8;
        }
        .app-loading {
          background: var(--color-surface, #122522);
          color: var(--color-on-surface, #e9f0e8);
        }
        .app-loading-mark {
          color: var(--color-primary, #8bd1b5);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="app-loading"
        role="status"
        aria-label="Loading AMP"
        aria-busy="true"
      >
        <div class="app-loading-content">
          <svg class="app-loading-mark" viewBox="0 0 44 28" aria-hidden="true">
            <path
              class="app-loading-wave"
              d="M-23 14C-19 0-15 0-11 14S-3 28 1 14S9 0 13 14S21 28 25 14S33 0 37 14S45 28 49 14S57 0 61 14S69 28 73 14"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
