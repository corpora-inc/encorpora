<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#154d49" />
    <title>AMP · Adaptive Math Pathways</title>
    <meta
      name="description"
      content="Adaptive math practice. AMP finds each learner's level and moves them forward, with a hint and a lesson for every problem type and printable worksheets with solutions."
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f6f0;
        color: #183e3a;
        font-family: system-ui, sans-serif;
      }
      .app-loading {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 24px;
        background: var(--color-surface, #f7f6f0);
        color: var(--color-on-surface, #183e3a);
      }
      .app-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        min-width: 0;
        max-width: 100%;
      }
      .app-loading-mark {
        display: block;
        flex: none;
        width: 56px;
        height: 36px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        color: var(--color-primary, #1f5f55);
      }
      .app-loading-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .app-loading-body p {
        margin: 0;
        max-width: 32ch;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #122522;
          color: #e9f0e8;
        }
        .app-loading {
          background: var(--color-surface, #122522);
          color: var(--color-on-surface, #e9f0e8);
        }
        .app-loading-mark {
          color: var(--color-primary, #8bd1b5);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="app-loading"
        role="status"
        aria-label="Loading AMP"
        aria-busy="true"
      >
        <div class="app-loading-content">
          <svg class="app-loading-mark" viewBox="0 0 44 28" aria-hidden="true">
            <path d="M1 14C5 0 9 0 13 14S21 28 25 14S33 0 37 14S41 28 43 14" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
