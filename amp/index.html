<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#154d49" />
    <title>AMP · Mathematics, your way forward</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f6f0;
        color: #183e3a;
        font-family: system-ui, sans-serif;
      }
      .app-loading {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .app-loading strong {
        font-size: 28px;
        letter-spacing: -1px;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #122522;
          color: #e9f0e8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" aria-busy="true">
        <strong>AMP</strong>
        <p>Opening your workspace…</p>
        <button style="visibility:hidden;min-height:48px;min-width:120px;margin-top:12px" disabled>Try again</button>
      </div>
    </div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
