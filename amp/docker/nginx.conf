# Static browser app. A reverse proxy routes /api/* to the API image.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Static text only; /api responses are served by the separate API image.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json application/xml application/manifest+json image/svg+xml image/x-icon;
  gzip_proxied any;
  gzip_vary on;
  include /etc/nginx/amp-security-headers.conf;

  location = /healthz { access_log off; return 200 "ok\n"; }
  # The release this image serves (Dockerfile: AMP_BUILD_COMMIT).
  location = /version.json {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  # Hashed build assets never change.
  location ^~ /assets/ {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # The pitch's own document: the shell plus preloads for what it paints first,
  # its canonical link and its structured data (scripts/build-home-document.ts).
  location = / {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /home.html =404;
  }
  # Known legacy query URLs receive the same public HTML and social card as
  # their canonical skill path. Query state remains available to the app.
  location = /pathways {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $pathways_document =404;
  }
  location = /pathways/ {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $pathways_document =404;
  }
  # Public skill pages have build-generated HTML, including direct URLs without
  # a trailing slash. Unknown skill IDs return 404 instead of a generic SPA shell.
  location ^~ /pathways/ {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  location = /index.html {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /site.webmanifest {
    include /etc/nginx/amp-security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  # A missing file is a 404, never the app's HTML: no route has a file extension.
  location ~ \.[A-Za-z0-9]+$ {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  # A class code in the path stays out of access logs. A printed card's secret
  # is in the fragment (/c#...), which never reaches this server.
  location ^~ /join/ {
    access_log off;
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  # A family's progress link. Its secret is in the fragment too. The page stays
  # out of search, and the later Referrer-Policy line is the one browsers use.
  location = /p {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
    try_files /index.html =404;
  }
  # Single-page app: every other path serves index.html, never cached.
  location / {
    include /etc/nginx/amp-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
}
