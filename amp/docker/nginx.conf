# Static browser app. A reverse proxy routes /api/* to the API image.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  # The release this image serves (Dockerfile: AMP_BUILD_COMMIT).
  location = /version.json {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Known legacy query URLs receive the same public HTML and social card as
  # their canonical skill path. Query state remains available to the app.
  location = /pathways {
    add_header Cache-Control "no-cache";
    try_files $pathways_document =404;
  }
  location = /pathways/ {
    add_header Cache-Control "no-cache";
    try_files $pathways_document =404;
  }
  # Public skill pages have build-generated HTML, including direct URLs without
  # a trailing slash. Unknown skill IDs return 404 instead of a generic SPA shell.
  location /pathways/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }
  # Single-page app: every other path serves index.html, never cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /index.html;
  }
}
