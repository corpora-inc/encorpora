# Sent on every response from this image. nginx drops inherited add_header lines
# in any location that has its own, so each location includes this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
# corpora.inc embeds the invoice form, so framing is limited to it rather than
# denied. Inline styles are required by KaTeX's rendered math. The only script
# that isn't ours is Google Analytics (src/analytics/google-analytics.ts), and
# film and lesson media come from the CDN. Ad conversions are sent server-side.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://d38iwc9748jekz.cloudfront.net https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; media-src 'self' blob: https://d38iwc9748jekz.cloudfront.net; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' blob:; frame-ancestors 'self' https://corpora.inc; form-action 'self' https:; base-uri 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
