services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: amp
      POSTGRES_DB: amp
    ports:
      - "127.0.0.1:${AMP_DB_PORT:-55439}:5432"
    volumes:
      - amp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  amp-postgres:
