[package]
name = "amp-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "AMP mathematics native preview shell"

[lib]
name = "amp_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
