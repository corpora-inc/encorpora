[package]
name = "amp-native-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "AMP native memory-only OIDC session and fixed learning transport"

[dependencies]
openidconnect = { version = "4", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
