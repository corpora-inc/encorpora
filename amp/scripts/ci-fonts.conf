<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Browser checks measure layout with a font learners actually get. The app's
  stack (-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui,
  sans-serif) resolves to Roboto on Android and San Francisco on Apple
  devices. Linux CI would otherwise fall back to DejaVu Sans, which no learner
  sees and which sets text far wider. CI installs fonts-roboto and points
  FONTCONFIG_FILE here; local macOS runs already render San Francisco.
  These aliases precede the system rules so Roboto ranks first.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
