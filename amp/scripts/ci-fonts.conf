<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Linux browser checks use the installed Roboto family to exercise Android-like
  UI metrics. FONTCONFIG_FILE selects this configuration only for those checks.
  Chrome can resolve system-ui to DejaVu Sans before matching a font, so the
  final rule also replaces that resolved sans face. Serif and monospace families
  keep their system mappings.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" compare="eq"><string>DejaVu Sans</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Roboto</string>
    </edit>
  </match>
</fontconfig>
