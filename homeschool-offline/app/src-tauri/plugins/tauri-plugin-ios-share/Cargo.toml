[package]
name = "tauri-plugin-ios-share"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-ios-share"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
